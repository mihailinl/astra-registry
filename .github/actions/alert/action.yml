# The one step every `alert` job calls (registry plan RC-R1-0).
#
# Four things happen here, in an order that is the whole point:
#
#   1. the two scripts are actually present;
#   2. environment `alerts` carries the channel's required secrets — asked on
#      EVERY run, green or red — with ONE state excepted: a channel that has
#      never been created at all, which is said out loud and is not a failure;
#   3. the alarm, if the verdict is red, and the start signal for BOT-86's
#      acknowledgement check in the same step as the alarm it is about;
#   4. BOT-85's heartbeat, LAST.
#
# **Why the heartbeat is last, and never first.** The heartbeat tells the
# dead-man receiver that this check ran and is healthy; silence at the receiver
# is what pages a person when GitHub is the thing that failed. If the heartbeat
# went first, a job that then could not deliver its alarm would have already
# told the receiver everything was fine: the run goes red where nobody is
# looking, the receiver stays quiet, and the estate's two independent paths to
# a person have been collapsed into one by the order of two steps. Last means a
# channel that is broken takes the receiver's path down with it, and the
# receiver pages on silence within the check's bound.
#
# **Why step 2 runs on green runs too.** A missing `ASTRA_ALERT_TELEGRAM_TOKEN`
# is invisible on a green run: nothing was going to be sent anyway. Left
# unasked, the first run that discovers the channel is unreachable is the run
# that needed it. Asked every time, the answer arrives on the first scheduled
# run after the secret is lost, in a red job, with the name of the secret in
# it.
#
# **The one distinction step 2 makes, and why it is not a way out of the
# rule above.** "Never created yet" and "created and now broken" look identical
# to a job that asks only *is this secret set*, and they are not alike at all.
#
#   * **Unconfigured** — NONE of the channel secrets is present: not the two
#     required ones, and not the optional copy chat either. That is the
#     repository before the owner performs §2.12's R1 act, it has a named
#     owner act and a date nobody has yet, and it is not a defect. The step
#     says so, loudly, in the log and in the job summary; sets `configured` to
#     `false`; sends nothing; and posts NO heartbeat, because the receiver does
#     not exist either and a heartbeat to a check nobody created is a 404 that
#     reads like a typo. The job is green.
#   * **Broken** — some channel secret is present and a required one is not,
#     or the Bot API refuses, or a 2xx carries no `result.date`. Red, exactly
#     as before, with the name of each missing secret. A half-configured
#     channel is somebody's edit, or an `env:` block naming fewer secrets than
#     the environment holds, and it looks nothing like a fresh repository.
#
# The state is DERIVED from the absence of all of them and never declared: there
# is no input, flag or variable here that turns the alarm off, because a switch
# is how a channel ends up muted for a reason nobody remembers.
#
# **What makes the silence safe is that it is not silent everywhere.**
# `.github/workflows/alarm-drill.yml` asserts `configured == true` and is RED
# every Monday until the owner's act — one red run a week, on the workflow
# whose whole subject is whether this channel exists, instead of ninety-six a
# day on `served-set.yml` and one per listing issue on `ingest.yml`, whose
# subjects are something else. An estate with no alarm channel must not be
# indistinguishable from an estate with nothing to report; it also must not
# shout about a known, expected state until the next real alarm is invisible,
# because a check that fires when nothing differs is a check on its way to
# being ignored.
#
# This action is inside TRUST-31's hashed set (§2.4) precisely because it
# outputs the `delivered_at` that TRUST-32 gates publication on: a registry
# writer who could change what an ingest run reports as delivered, without bot
# calls returning to shadow, is the thing TRUST-31 exists to prevent.
#
# **The calling job, in full.** Two things about it are not optional and both
# are checked by `bot/tests/workflows.test.mjs`: the environment, and the
# `env:` block, because an environment secret is not ambient — a job sees one
# only where it says so. The block lists the three channel secrets — the
# optional copy chat among them, so that a copy chat the owner sets later
# reaches every job and not only some — and the whole ping URL of each check
# THIS job posts to, and nothing else.
#
# **Both of those used to be caught twice, and since 2026-09-19 are caught
# once.** A job with no environment, or with no `env:` block, sees none of the
# channel secrets — which is exactly what the repository before §2.12's R1 act
# looks like from inside a job, and this action now reports that state and
# stays green. So a forgotten `env:` block no longer turns anything red, and
# the test above is the whole of what stands between it and an alert job that
# pages nobody in silence. Do not weaken it.
#
#     alert:
#       needs: check
#       if: always() && !cancelled()
#       runs-on: ubuntu-24.04
#       environment: alerts
#       permissions:
#         contents: read
#       env:
#         ASTRA_ALERT_TELEGRAM_TOKEN: ${{ secrets.ASTRA_ALERT_TELEGRAM_TOKEN }}
#         ASTRA_ALERT_CHAT_ID: ${{ secrets.ASTRA_ALERT_CHAT_ID }}
#         ASTRA_ALERT_COPY_CHAT_ID: ${{ secrets.ASTRA_ALERT_COPY_CHAT_ID }}
#         ASTRA_DEADMAN_URL_SERVED_SET: ${{ secrets.ASTRA_DEADMAN_URL_SERVED_SET }}
#       steps:
#         - uses: actions/checkout@v4
#           with:
#             ref: ${{ github.sha }}
#             sparse-checkout: |
#               .github/actions/alert
#               bot/alert.mjs
#               bot/heartbeat.mjs
#               bot/lib/alert-verdict.mjs
#               bot/lib/alert-checks.mjs
#               tools/lib/ids.mjs
#             sparse-checkout-cone-mode: false
#         - … write verdict.json from the checking job's outputs …
#         - uses: ./.github/actions/alert
#           with:
#             verdict: verdict.json
#             check: served-set

name: Alert and heartbeat
description: >-
  Send a grammar-checked verdict to the alarm chat — the one group the owner
  and KNICE share — and to a separate copy chat only if one is set, and post
  the check's BOT-85 heartbeat to the dead-man receiver.

inputs:
  verdict:
    description: Path to the verdict JSON this job wrote (astra.registry.alert-verdict/1).
    required: true
  check:
    description: >-
      The receiver check this job posts its heartbeat to. Must be a registry
      check named in bot/lib/alert-checks.mjs. Exactly one of this and
      `no-heartbeat-because` is given.
    required: false
    default: ''
  no-heartbeat-because:
    description: >-
      Why this alert job posts no BOT-85 heartbeat. §2.0 says every SCHEDULED
      check posts one, and most alert jobs are scheduled — but some are not,
      and some are watched by another party. `ingest.yml` is the named case:
      BOT-51's schedule is deliberately absent from BOT-85's list because the
      plugins service's BOT-47 watches it, so an `alerts` job there would be
      posting to a check nobody meant to create. The omission is written down
      with its reason rather than inferred from an empty input, because an
      absent heartbeat is invisible and a reason is not.
    required: false
    default: ''
  ack-check:
    description: >-
      Optional. A receiver check to send a START signal to, in the same step as
      the alarm. Only BOT-86's weekly drill uses it, with `alarm-ack`.
    required: false
    default: ''

outputs:
  delivered_at:
    description: The Bot API's message time for the owner's chat (TRUST-14, TRUST-32), or empty.
    value: ${{ steps.alarm.outputs.delivered_at }}
  alerted:
    description: Whether an alarm was sent, as `true` or `false`.
    value: ${{ steps.alarm.outputs.alerted }}
  configured:
    description: >-
      Whether an alarm channel exists to be sent on, as `true` or `false`.
      `false` means none of the channel secrets is present — the state
      before §2.12's R1 act, in which this action sends nothing, posts no
      heartbeat and does not fail. A channel that is present and broken is red
      here and never reaches this output. `alarm-drill.yml` asserts it is
      `true`, which is where that state is loud.
    value: ${{ steps.channel.outputs.configured }}

runs:
  using: composite
  steps:
    # A sparse checkout that forgot a path fails four lines later with a Node
    # resolver error about a file nobody asked for. Saying it here costs one
    # step and names the checkout instead.
    - name: The scripts this step runs are actually here
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        for f in bot/alert.mjs bot/heartbeat.mjs bot/lib/alert-verdict.mjs bot/lib/alert-checks.mjs tools/lib/ids.mjs; do
          [ -f "$f" ] || missing+=("$f")
        done
        if [ ${#missing[@]} -ne 0 ]; then
          echo "::error::this job's sparse checkout is missing ${missing[*]}; the alert step cannot run"
          exit 1
        fi
        if [ ! -f "${{ inputs.verdict }}" ]; then
          echo "::error::no verdict at ${{ inputs.verdict }}; the job that calls this step writes one before it"
          exit 1
        fi

    # The names are every channel secret `bot/alert.mjs` names — its
    # `REQUIRED_SECRETS` and its `OPTIONAL_SECRETS` — and a copy of a list is a
    # list that goes stale: `bot/tests/workflows.test.mjs` compares this loop's
    # names with those two exports and is red when they differ. Without that, a
    # channel secret added there would be one this step never counts — and a
    # channel missing all but that one would read as "never created" and go
    # quiet, which is the exact failure this whole file is written against.
    #
    # The optional copy chat is counted on purpose. "Never created" is the
    # absence of EVERY channel secret; a copy chat standing alone, with no
    # token and no alarm chat beside it, is a channel somebody created and
    # something took apart, and it is red below like any other half.
    #
    # Which of them a channel cannot work without is `bot/alert.mjs`'s to say,
    # and this step asks it rather than counting. Until 2026-09-23 it counted —
    # fewer than three present was half-configured — and that stopped being
    # true the day the owner chose one alarm group for himself and KNICE and
    # the copy chat became optional: a correct channel now holds two of the
    # three.
    #
    # Nothing is printed but names. A value is tested for presence and never
    # echoed, and `${value//[[:space:]]/}` is the same question `alert.mjs`
    # asks — an unset GitHub secret interpolates to the empty string, and a
    # secret somebody set to a space is not a secret.
    - name: Environment `alerts` can reach a person at all
      id: channel
      shell: bash
      run: |
        set -euo pipefail
        present=0
        for name in ASTRA_ALERT_TELEGRAM_TOKEN ASTRA_ALERT_CHAT_ID ASTRA_ALERT_COPY_CHAT_ID; do
          value="${!name:-}"
          if [ -n "${value//[[:space:]]/}" ]; then
            present=$((present + 1))
          fi
        done

        if [ "$present" -eq 0 ]; then
          echo "configured=false" >> "$GITHUB_OUTPUT"
          line="THE ALARM CHANNEL DOES NOT EXIST YET. None of ASTRA_ALERT_TELEGRAM_TOKEN, ASTRA_ALERT_CHAT_ID and ASTRA_ALERT_COPY_CHAT_ID is present in this job, so this repository cannot reach a person at all: nothing was sent, no BOT-85 heartbeat was posted, and this job is green because a repository whose channel has never been created is not a repository with a defect. The act that creates it is registry plan RC-R1-0's owner approval, the R1 row of the plan's 2.12 — environment alerts in astra-registry, admitting only main, holding the registry's own Telegram bot token, the id of the one alarm group the owner and KNICE share, and one ASTRA_DEADMAN_URL_<CHECK> per receiver check (a separate copy chat, ASTRA_ALERT_COPY_CHAT_ID, is optional), with the receiver account created beside it. Until that act, the workflow that says so is .github/workflows/alarm-drill.yml, which is red once a week for exactly this reason and is the one workflow whose whole subject is this question."
          # One line, once: the annotation form is also what the raw log shows,
          # so a second bare echo of it would be the same sentence twice in the
          # place a reader is skimming.
          echo "::warning title=The alarm channel does not exist yet::$line"
          {
            echo "## The alarm channel does not exist yet"
            echo
            echo "$line"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        echo "configured=true" >> "$GITHUB_OUTPUT"
        if ! node bot/alert.mjs --check-credentials; then
          echo "::error::the alarm channel is HALF-CONFIGURED: $present of its secrets are present in this job and a required one is not — the names are above. This is not a repository waiting on §2.12's R1 act — that state has none of them — it is a channel somebody created and something then took apart: a secret deleted from environment alerts, or an env: block naming fewer of them than the environment holds. Nothing is sent and no heartbeat is posted."
          exit 1
        fi

    - name: The alarm, and BOT-86's start signal with it
      id: alarm
      if: steps.channel.outputs.configured == 'true'
      shell: bash
      env:
        ASTRA_ALERT_VERDICT: ${{ inputs.verdict }}
        ASTRA_ALERT_ACK_CHECK: ${{ inputs.ack-check }}
      run: |
        set -euo pipefail
        if [ -n "$ASTRA_ALERT_ACK_CHECK" ]; then
          node bot/alert.mjs --verdict "$ASTRA_ALERT_VERDICT" --if-red --ack
        else
          node bot/alert.mjs --verdict "$ASTRA_ALERT_VERDICT" --if-red
        fi
        # The start signal follows a DELIVERED alarm, in this same step, and
        # not before it. BOT-86 escalates to KNICE 48 hours after a start with
        # no acknowledgement; starting the clock for an alarm that never
        # arrived would page the second responder about an unacknowledged
        # message nobody was sent. If the alarm did not deliver, the line above
        # already failed this step.
        if [ -n "$ASTRA_ALERT_ACK_CHECK" ]; then
          node bot/heartbeat.mjs --check "$ASTRA_ALERT_ACK_CHECK" --signal start
        fi

    # Skipped, and not merely quiet, when there is no channel. A heartbeat is a
    # statement to the dead-man receiver that this check ran and is healthy,
    # and there is no receiver yet either: the POST would 404 on a check nobody
    # created. Silence is the honest signal while nothing is listening for it.
    - name: BOT-85's heartbeat, after the channel proved it works
      if: steps.channel.outputs.configured == 'true'
      shell: bash
      env:
        ASTRA_ALERT_CHECK: ${{ inputs.check }}
        ASTRA_ALERT_NO_HEARTBEAT: ${{ inputs.no-heartbeat-because }}
      run: |
        set -euo pipefail
        if [ -n "$ASTRA_ALERT_CHECK" ] && [ -n "$ASTRA_ALERT_NO_HEARTBEAT" ]; then
          echo "::error::this job names both a check and a reason not to post one; it can mean only one"
          exit 1
        fi
        if [ -n "$ASTRA_ALERT_CHECK" ]; then
          node bot/heartbeat.mjs --check "$ASTRA_ALERT_CHECK"
        elif [ -n "$ASTRA_ALERT_NO_HEARTBEAT" ]; then
          echo "ok    no BOT-85 heartbeat from this job: $ASTRA_ALERT_NO_HEARTBEAT"
        else
          echo "::error::this job names neither a receiver check nor a reason it posts no heartbeat"
          exit 1
        fi
