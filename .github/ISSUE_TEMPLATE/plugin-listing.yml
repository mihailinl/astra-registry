name: Plugin listing request
description: List a plugin in the Astra registry
title: "[listing] <owner>/<repo>"
labels: ["listing", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Two facts, three confirmations, and one optional paragraph.** That is
        the whole form.

        ## One commit first, or this will be refused

        The registry has to know that the person asking for the listing controls
        the repository — otherwise a stranger could list your plugin and become
        the account through which its updates reach Astra users. **The way you
        prove that is one file on your default branch:**

        ```
        mkdir -p .well-known
        echo YOUR-GITHUB-LOGIN > .well-known/astra-plugin-owner
        git add .well-known/astra-plugin-owner && git commit -m "registry: owner"
        git push
        ```

        One login per line, `#` starts a comment, and **the login has to be the
        one opening this issue** — the bot compares the file against the issue's
        author and nothing else. It is read live from the default branch on every
        run, so removing a line stops that login opening a new request or passing
        a `/recheck`; it does not reach a plugin that is already listed, whose
        later releases are proved against the account that published the release.
        No CI runs either way.

        Be clear about what it proves: that somebody who can write to that branch
        vouches for that login. It is a proof of *write access*, not of legal
        ownership.

        **There is no way to skip it.** The bot does ask GitHub who has `admin` or
        `maintain` first, but GitHub answers that question only for a caller that
        can already see the repository. The bot's token belongs to this registry,
        so for your repository the answer is `403` — "I will not tell you", not
        "no". That is never held against you, and it is also never a shortcut:
        the file is the only thing that can prove this.

        **Before you submit,** run this in your plugin directory:

        ```
        astra-plugin publish --dry-run
        ```

        It runs the local half of this registry's checks in a few seconds and
        names the ones only the registry can run. Fixing a problem there is
        minutes; fixing it here is a round trip.

        **You need a release that already exists.** This registry reads a
        GitHub Release — it does not build anything. The tag below must already
        carry `.astraplugin` files produced by `plugin-release.yml`, which is
        what attaches the *attestation*: a signed statement from GitHub saying
        which workflow, in which repository, built those exact bytes. Without
        one there is nothing here to verify.

        **Everything else is read out of the bundle** — id, version,
        capabilities, permissions, licence, summary, platforms, digests. That
        data is covered by the attestation, which makes it more trustworthy than
        anything typed into a form, so there is no such thing here as a "your
        form disagrees with `plugin.toml`" rejection.

        **A plugin is listed once, ever.** After this, releases are zero-touch:
        tag, let CI build and attest, and the registry picks it up.
        `docs/POLICY.md` says exactly when a release publishes itself, when it
        waits, and which three things still take a person.

        **What happens after you submit.** The bot comments here, usually within
        a few minutes: it downloads your release assets, verifies the
        attestation, reads the manifest, and posts a table of every check with a
        digest at the end. A first listing is one of three things a person still
        decides — a maintainer answers within 48 hours, and comments `/approve`
        or `/reject` with a reason. Either way you hear back on this thread.
  # Fact 1 of 2. The label text is parsed by `bot/lib/issue.mjs`; changing it
  # changes what the bot can read out of a rendered form, so change both.
  - type: input
    id: repository
    attributes:
      label: Source repository
      description: >-
        The repository whose GitHub Release carries the bundle. `owner/name`, or
        paste the full address — both work.
      placeholder: you/dice-roller
    validations:
      required: true

  # Fact 2 of 2.
  - type: input
    id: release_tag
    attributes:
      label: Release tag carrying the .astraplugin assets
      description: >-
        The tag of an existing release, not a branch and not a commit. If
        `astra-plugin publish --dry-run` warned that the tag is missing, publish
        the release first.
      placeholder: v0.2.0
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What does it do, and why should it be listed?
      description: >-
        Optional, a few sentences. The only part a human writes, and the first
        part a human reads.

  # All three required, and all three read. `bot/read-submission.mjs` refuses a
  # submission with an unticked box, and `bot/lib/intake.mjs` names the box in a
  # comment rather than letting the run die silently. Both read every `- [ ]`
  # line in the rendered body, so adding an option here needs no parser change.
  #
  # ── why the first one is a checkbox and not a text field ───────────────────
  #
  # The obvious alternative is an input asking which login you wrote in the
  # file, so a typo is caught by comparing two strings. It was considered and
  # rejected twice over. First, the bot already knows the login it expects — the
  # account that opened this issue — so a field could only introduce a *third*
  # string to disagree with the other two. Second, this registry's whole shape is
  # "there is no form to disagree with": everything except the repository and the
  # tag is read out of attested bytes, and a typed field that the ingest ignores
  # would be a promise the bot cannot keep.
  #
  # The typo is caught anyway, and by the half that can see it:
  # `bot/lib/ownership.mjs` prints the logins the file *does* contain when it
  # does not contain yours, so `Rel0dlx` versus `Rel0d1x` is visible in the
  # refusal instead of being silence.
  - type: checkboxes
    id: attest
    attributes:
      label: Confirmations
      description: >-
        None of these is evidence — ownership is proved against your repository
        either way. They are the difference between a mistake and a statement.
      options:
        - label: >-
            I have committed `.well-known/astra-plugin-owner` to this
            repository's default branch, and it contains my GitHub login (the
            account opening this issue) on a line of its own.
          required: true
        - label: I own or maintain this repository.
          required: true
        - label: I have read POLICY.md, including the data-handling section.
          required: true
