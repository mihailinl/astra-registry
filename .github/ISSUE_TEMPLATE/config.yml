# Since the cutover (ROLL-33; registry plan M-T6.2 commit C) there is no form
# here. The five forms went once the legacy queue drained: a listing, a release
# ping, a report, an appeal and a publisher verification are all made in
# Minice's panel now, and an issue opened on this repository reaches nobody
# (DEC-12). Blank issues stay off, so this page is the whole of what a visitor
# sees, and each link says where the thing they came for went.
#
# The first link is MOD-54's report action. Contract 0.12.0 gives its page path
# only as "under /plugins/_/" (MBE-PENDING), so until a version names it the link
# is the panel's plugin list, from which MOD-54 requires every plugin page to
# link the report page. It names the vulnerability channel as MOD-45 requires:
# security@minice.ai, its reader (the owner), "no encryption", and that a report
# is not embargoed.
blank_issues_enabled: false

contact_links:
  - name: Report a plugin, appeal a decision, or submit a listing — in Minice's panel
    url: https://astra.minice.ai/plugins
    about: >-
      Sign in with a Minice account. Report a listed plugin from its page (a
      report is not embargoed, so put no vulnerability in it), appeal a refusal
      or a moderation action, or submit a listing. Issues here reach nobody.
      A vulnerability goes to security@minice.ai instead, which the project
      owner reads — no encryption, so say you have one before sending details.

  - name: How do I build, sign and release a plugin?
    url: https://github.com/mihailinl/AstraPlugins
    about: >-
      The SDKs, the CLI, the release workflow and the documentation all live in
      AstraPlugins. Get a release built and attested there first — this registry
      only ever reads a release that already exists.
