name: Plugins moderation

# The moderation run: the second of the two workflows that hold a bot OIDC
# token (registry plan M-T3.4; contract ID-34, TRUST-31).
#
# ── what this file is for ──────────────────────────────────────────────────
#
# `plugins-ingest.yml` takes a release and decides whether it may be listed.
# This one takes a MODERATION DECISION and turns it into the artefacts that
# stop a plugin: an edit to a listing, an entry in the moderation log, a signed
# advisory, the decision records DEC-7 owes. It is the only path in this
# estate by which software already running on somebody's machine is turned off.
#
# That asymmetry decides everything about the file. An ingest that refuses too
# eagerly delays a release; a takedown that refuses too eagerly leaves a plugin
# installed, and BOT-81 makes `refused` FINAL — the moderator is told the
# takedown did not land, nobody is paged, and re-deciding refuses again. So the
# bias runs the other way from `plugins-ingest.yml`: everything this file does
# not understand FAILS THE RUN loudly, and only a condition the registry has
# actually judged becomes one of §0.8's seven refusals.
#
# **The rule, in one line: each job holds at most one of — a bot token,
# `contents: write`, the alarm channel's credential.**
#
#   | job       | holds                          |
#   |-----------|--------------------------------|
#   | `list`    | a bot token                    |
#   | `alert`   | the alarm channel's credential |
#   | `commit`  | `contents: write`              |
#   | `report`  | a bot token                    |
#   | `settled` | the alarm channel's credential |
#
# Nothing in YAML enforces that table; `bot/tests/workflows.test.mjs` does.
#
# ── the results history already decided, and why `list` posts them ─────────
#
# A hold ended by a commit already on `main` — a person deleting the entry, a
# release or cancel commit — has a result that names that commit. Until ops
# entry 100 closed, `report` re-derived and re-posted every one of them on
# every live run, for ever, because nothing recorded that the service had
# accepted it. The answer is seen only by a job with a bot token, and only
# `commit` may write; `report` runs after `commit`, and neither may carry bytes
# to the next run's `commit` (an artifact from a token job: BOT-55; a cache:
# BOT-56; another run's artifact would need `actions: read`, which `commit`
# does not hold). So `list` posts those results BEFORE `commit` — they wait
# for no push of this run — and hands on the ones the service ANSWERED
# `accepted` or `duplicate` as its `settled` output. `commit` re-checks them
# and records them in `state/moderation-settled.json`, and every later run
# skips them. No job gained a permission, an environment or a secret.
#
# ── why `alert` is a job and not a step, and why `commit` needs it ─────────
#
# MOD-8 requires every advisory and every hold to be alerted BEFORE the push,
# and TRUST-14 requires the alarm to go out in the run that first reads the
# event. A GitHub environment is a JOB-level property: there is no way to put
# one step of `commit` into `alerts` without giving the whole committing job
# the alarm credential, which `bot/tests/workflows.test.mjs` refuses. So the
# ordering is expressed in the graph — `commit` needs `alert` — which is the
# same shape `plugins-ingest.yml`'s `publish` uses, and for the same reason.
#
# The alarms are therefore derived from the LIST entry and not from the
# compile: `alarmsFor()` reads the `code`, `action` and `severity` the service
# sent. An alarm that named the advisory id would have to wait for the compile,
# which happens after this job, which is the ordering MOD-8 forbids.
#
# ── live on dispatch, and on the schedule as its floor ────────────────────
#
# B-T5.1 turned the three service calls live on 2026-10-14: `list`'s work and
# history steps and `report`'s post, each now the command its placeholder
# named. Until then each printed `::error::` and exited 1, so a dispatch was
# red at `list`, `settled` paged for the decision the service had listed, and
# nothing a moderator decided in the plugins service ever reached git — the
# owner's delist of `e2e-test` sat unsettled through run 38525175920.
#
# `DRY_RUN` is committed "false" with it, so a dispatch pushes what it
# compiles; the guard is the `apply` step's, and any other value withholds
# the push (the comment at `env:` says how).
#
# **The plugins service's waker is the primary trigger**: it dispatches this
# workflow when there is moderation work, about every five minutes on
# 2026-10-17. **The `schedule:` below is the floor under it**, restored
# 2026-10-17 (the plugins friction plan's item 13(d)): with the schedule
# commented out, a waker that stopped dispatching left every decision a
# moderator made unsettled, and nothing paged, because BOT-83's receiver check
# `moderation-run` was disarmed. It was armed by its first post — the
# `settled` job of dispatched run 38525175920, 2026-10-14T06:58:24Z — and the
# commit that restores the schedule records that `armed_at` in
# bot/lib/alert-checks.mjs: the workflow suite holds a live cron and an armed
# row to one commit, because a poster that runs before its first heartbeat
# arrives is one whose silence pages nobody. A scheduled run that finds no work
# lists nothing and commits nothing; its heartbeat is what lets a silent
# waker page.
#
# The workflow suite reads the cron line whether it is commented or not, and
# this run's own suite compares its interval with the token file's
# `schedule:moderation`. (Neither is named here by path, and that is not
# squeamishness: §2.0's check that every suite under `bot/tests/` is run by a
# workflow scans these files for the suite's path as a SUBSTRING, so a path in
# a comment reports a suite as run when nothing runs it. That is the defect
# this file found on its first green run.) BOT-83 pins 600 s, five minutes off
# `plugins-ingest.yml`'s `3-59/10`, so that a run of each never starts in the
# same minute. Since amendment A6 that interval is a contract MUST, and
# SCOPE-1 makes an edit to it a contract MINOR published BEFORE the line moves:
# a cron edit here is not a cron edit.
#
# `commit` measures TRUST-26's bound itself, out of its own full-history
# checkout (`bot/lib/takedown-bound.mjs`, M-T3.2), and spends it entry by
# entry, so no job hands it a bound and nothing outside the job can say "under
# the bound". Until 2026-09-24 this job read the bound from an input nothing
# supplied and was red here instead; contract 0.38.0 put the counter's imports
# inside TRUST-31's set, which is what let the job import it.
#
# This file is in TRUST-31's hashed set: every edit here, this one included,
# moves the set hash the owner's TRUST-42 acknowledgement names, and the
# `job_workflow_sha` the service hashes is the commit the edit lands as.

on:
  # ── BOT-83's schedule, the floor under the waker ─────────────────────────
  #
  # Every 600 seconds, five minutes after the ingest run's `3-59/10`. Live
  # since the commit that recorded `moderation-run`'s `armed_at` in
  # bot/lib/alert-checks.mjs (the header says why the two are one commit).
  schedule:
    - cron: '8-59/10 * * * *'

  # No inputs, and there will never be any (BOT-4). A dispatch of a
  # token-holding workflow may mean exactly one thing — "pull now". The
  # operator confirmations MOD-52 defines run in `operator.yml` (M-T3.5),
  # which holds no bot OIDC token and is deliberately outside TRUST-31's set.
  workflow_dispatch:

permissions: {}

# One group for the whole workflow, and no group on any job (BOT-5).
#
# `cancel-in-progress: false` matters more here than in the ingest graph: a
# cancelled run that had already pushed a release commit and not yet posted its
# result leaves a decision applied on `main` and unsettled at the service, and
# the next run re-posts it under BOT-82's key — which is fine — but a run
# cancelled mid-push leaves nothing at all, and the hold it was releasing waits
# another ten minutes. Never killing a started run is what keeps that to ten
# minutes rather than to an operator noticing.
concurrency:
  group: registry-moderation
  cancel-in-progress: false

# Committed "false" since B-T5.1 (2026-10-14), as `plugins-ingest.yml`'s was
# by B-T3.6 the day before. It was "true" through R3 and read by no step, so
# it withheld nothing: the `apply` step pushed whatever it was. It is read in
# ONE place now, that step, and the guard errs in the withholding direction —
# `!= "false"`, never `== "true"` — so "true", a typo or an unset value
# commits on the runner and pushes nothing.
env:
  DRY_RUN: "false"

jobs:
  # ── list: the only job that asks the service what there is to do ──────────
  #
  # It mints a masked bot OIDC token per call, calls `GET bot/moderation-work`
  # at most three times (BOT-63), and checks the ANSWER and every entry in it
  # against `schema/moderation-work-v1.json`.
  #
  # **It prints ids and codes and nothing else** (PRIV-2, BOT-89). The run logs
  # of this repository are public and a moderation decision is a fact about a
  # person's plugin; `listSummary` composes what goes to stdout and fails the
  # run past 900 kB rather than letting a long list truncate in the middle,
  # because `settled` compares what was listed with what got a result.
  list:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: plugins-service
    permissions:
      contents: read
      id-token: write
    outputs:
      # `shadow` travels as a job output and never as an artifact (BOT-55): any
      # job in a run can write that run's artifacts, and this one value decides
      # whether anything at all is committed and posted.
      shadow: ${{ steps.work.outputs.shadow }}
      entries: ${{ steps.work.outputs.entries }}
      submissions: ${{ steps.work.outputs.submissions }}
      refused: ${{ steps.work.outputs.refused }}
      listed: ${{ steps.work.outputs.listed }}
      # The results history decided that the service ANSWERED `accepted` or
      # `duplicate` in this run: ids, outcomes, commits, the answer word, when
      # and in which run — no token and no response body (ops entry 100).
      settled: ${{ steps.history.outputs.settled }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every job in this run reads the same tree, which is also the tree
          # whose `job_workflow_sha` the service hashes under TRUST-31.
          ref: ${{ github.sha }}
          # The `history` step reads every commit that deleted a hold entry,
          # which a shallow clone hides; `holdDeletions` refuses one rather
          # than report fewer.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # One bot OIDC token per attempt, with the bot audience compiled in,
      # masked before first use and refused outside `environment:
      # plugins-service` (bot/lib/oidc.mjs) — the pattern `plugins-ingest.yml`'s
      # `claim` job uses, through the same client. At most three GETs (BOT-63),
      # then the answer and every entry against schema/moderation-work-v1.json.
      #
      # The script writes one single-line JSON file per output and this step
      # copies each into $GITHUB_OUTPUT by name. A list with anything fatal in
      # it writes none and fails here, so every later job reads a failed
      # `list`, never an empty one.
      - name: List the moderation work, and check every entry against the schema
        id: work
        run: |
          set -euo pipefail
          node bot/moderation-run.mjs --job list --out moderation
          # Inside an `echo`, a `$(cat …)` of a missing file is an empty output
          # and `set -e` does not see it; so every file is asked for first.
          for name in shadow entries submissions refused listed; do
            if [ ! -s "moderation/${name}.json" ]; then
              echo "::error::the list job wrote no moderation/${name}.json, so this job has no ${name} output to hand on"
              exit 1
            fi
          done
          {
            echo "shadow=$(cat moderation/shadow.json)"
            echo "entries=$(cat moderation/entries.json)"
            echo "submissions=$(cat moderation/submissions.json)"
            echo "refused=$(cat moderation/refused.json)"
            echo "listed=$(cat moderation/listed.json)"
          } >> "$GITHUB_OUTPUT"

      # Ops entry 100. Before `commit`, and in this job because it holds the
      # token and `commit` may not: post each result a commit already on `main`
      # decided and the record does not yet hold, and hand on the ones the
      # service answered `accepted` or `duplicate`. Keyed on the answer — a
      # 5xx, a timeout or a shadow answer records nothing — and a result not
      # settled here is posted again by `report` after the commit.
      #
      # Under anything but the work step's `shadow` output being `false` it
      # posts nothing and hands on `[]` (BOT-92); an answer to a post that is
      # itself shadow settles nothing either (bot/lib/settled.mjs).
      - name: Post the results history decided, and hand on what the service settled
        id: history
        env:
          ASTRA_SHADOW: ${{ steps.work.outputs.shadow }}
        run: |
          set -euo pipefail
          node bot/moderation-run.mjs --job history --out moderation
          if [ ! -s moderation/settled.json ]; then
            echo "::error::the history job wrote no moderation/settled.json, so this job has no settled output to hand on"
            exit 1
          fi
          echo "settled=$(cat moderation/settled.json)" >> "$GITHUB_OUTPUT"

  # ── alert: MOD-8's alarms, before anything is pushed ───────────────────────
  #
  # It runs `always()`, because the runs it exists for are the red ones, and it
  # downloads nothing at all: no artifact, no cache, no releases feed, no
  # `GITHUB_TOKEN` (BOT-46). Everything it says comes from `list`'s outputs.
  #
  # It posts NO heartbeat. `settled` is this run's liveness signal — it is the
  # last job and runs on `always()` — and two jobs posting to one receiver
  # check would mean a run in which `settled` never ran still looked alive.
  alert:
    needs: list
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: alerts
    permissions:
      contents: read
      id-token: none
    outputs:
      delivered_at: ${{ steps.alert.outputs.delivered_at }}
      alerted: ${{ steps.alert.outputs.alerted }}
    env:
      ASTRA_ALERT_TELEGRAM_TOKEN: ${{ secrets.ASTRA_ALERT_TELEGRAM_TOKEN }}
      ASTRA_ALERT_CHAT_ID: ${{ secrets.ASTRA_ALERT_CHAT_ID }}
      ASTRA_ALERT_COPY_CHAT_ID: ${{ secrets.ASTRA_ALERT_COPY_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # An EMPTY entry list is the case this step exists for. A `list` job that
      # died before writing its output looks, to an alert job that simply sends
      # what it was given, exactly like a list job with nothing to say — which
      # is the shape every "the alarm was never wired up" defect takes. The
      # composer refuses a verdict the channel would refuse, here, where the
      # refusal is red in a job somebody is reading.
      - name: The alarms MOD-8 owes for the work this run was handed
        env:
          ASTRA_ENTRIES: ${{ needs.list.outputs.entries }}
          ASTRA_LIST_RESULT: ${{ needs.list.result }}
        run: |
          set -euo pipefail
          if [ "$ASTRA_LIST_RESULT" != "success" ]; then
            ASTRA_VERDICT_CODES='["BOT_80_LIST_UNAVAILABLE"]' \
            ASTRA_VERDICT_IDS='[]' \
              node bot/moderation-run.mjs --job verdict --check moderation-run --out verdict.json
          else
            node bot/moderation-run.mjs --job alarms --entries "$ASTRA_ENTRIES" --out verdict.json
          fi

      - uses: ./.github/actions/alert
        id: alert
        with:
          verdict: verdict.json
          no-heartbeat-because: >-
            `settled` is this run's BOT-85 heartbeat for check `moderation-run`.
            It is the last job and runs on always(), so it is the one that can
            say the run finished; a second poster here would keep the receiver
            quiet in exactly the runs where `settled` never ran.

  # ── commit: the only job that writes to `main` ────────────────────────────
  #
  # `contents: write` and therefore **no bot OIDC token** (BOT-2): one
  # compromised job must not both speak for the bot and write the catalogue.
  #
  # **It reads only `needs.list.outputs`, re-checked, plus `main`, and
  # downloads no artifact.** The re-check is not ceremony: `list` is a
  # different job and its outputs travel through the run's public metadata, so
  # the same schema is applied again here, a millisecond's work that closes the
  # door between the two jobs.
  #
  # **It walks every hold even when `list` failed**, which is why it runs on
  # `always() && !cancelled()` and asks the list result by name rather than
  # inheriting it. A hold is not work the list answer names: a
  # settled `held` result took it off BOT-80's list and its release is driven
  # by git — TRUST-26's window counted from this checkout, or a MOD-52 record
  # (BOT-81, M-T3.3). The service being down must not be able to keep a held
  # takedown from releasing.
  commit:
    needs: [list, alert]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: none
    outputs:
      results: ${{ steps.apply.outputs.results }}
      main_commit: ${{ steps.apply.outputs.main_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The compile reads git history: MOD-13's next advisory id is "one
          # more than the highest ever ADDED", which a shallow clone cannot
          # answer, and MOD-19's identity entries walk every historic
          # `source.repo` of the listing.
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # TRUST-26's bound is counted here, out of this checkout's whole history,
      # and each takedown this run compiles spends it before the next is asked.
      # There is no bound input: `bot/moderation-run.mjs` reads none, because an
      # input that says "under the bound" would be the whole of the bypass.
      - name: Compile, walk the holds, and write what this run produced
        id: compile
        env:
          ASTRA_SHADOW: ${{ needs.list.outputs.shadow }}
          ASTRA_ENTRIES: ${{ needs.list.outputs.entries }}
          ASTRA_SUBMISSIONS: ${{ needs.list.outputs.submissions }}
          # The decisions `list` refused, re-checked and handed to `report` in
          # `results` with the compile's own refusals, so each is posted once
          # and leaves BOT-80's list; until B-T5.1 nothing read this output.
          ASTRA_REFUSED: ${{ needs.list.outputs.refused }}
          # Ops entry 100: re-checked like `entries`, and recorded in
          # state/moderation-settled.json only under `shadow: false` and only
          # for a result this job's own walk derived.
          ASTRA_SETTLED: ${{ needs.list.outputs.settled }}
          ASTRA_DELIVERED_AT: ${{ needs.alert.outputs.delivered_at }}
        run: node bot/moderation-run.mjs --job commit --out moderation

      # The gates, in the order the plan states, and every one of them is about
      # the documents this job is about to commit. `tools/validate.mjs` is
      # where BOT-34's second Check clause lives — a commit yanking n versions
      # under an `A_YANK` carries n author-action records — so a short-counted
      # yank never leaves the runner (B-T2.1; M-T3.1's canary).
      #
      # **The documents are regenerated by the step above, not here.** Until
      # 2026-09-22 this step ran both generators itself, after the commit job
      # had already written `paths.txt` — so neither document was ever listed,
      # a delist landed beside an index that still listed the plugin, and an
      # advisory beside a withdrawal list that did not carry it (ops entry 102).
      # The job that lists what is committed is now the job that writes it (the
      # lesson of entry 79), and it writes the list at the serial the signer
      # gives the commit that lands it, which only that job knows (entry 69).
      # This step holds what it wrote to the generators' own `--check`.
      - name: The documents this commit produces are the generators' own
        id: documents
        if: ${{ !cancelled() && steps.compile.conclusion == 'success' }}
        run: |
          set -euo pipefail
          node tools/build-index.mjs --check
          node tools/build-revocations.mjs --check

      # `--allow-staging`, the flags `build-index.yml` validates every push to
      # `main` with. Without it this gate refused the tree `main` already held —
      # ten staging records on 2026-09-22 — and every moderation commit stopped
      # here (ops entry 102). `bot/tests/workflows.test.mjs` holds every gate on
      # the validator to one set of flags.
      - name: Every registry rule, over the staged tree
        id: rules
        if: ${{ !cancelled() && steps.compile.conclusion == 'success' }}
        run: |
          set -euo pipefail
          node tools/validate.mjs --allow-staging
          node tools/selftest.mjs
          node bot/moderation.mjs --check

      # A run with NOTHING to commit is the common case — no work listed, no
      # hold due — and it must be a clean no-op, not a red step every ten
      # minutes. The commit job always writes moderation/paths.txt, zero bytes
      # when there is nothing, and then writes no commit-message.txt. Until
      # 2026-09-22 it wrote a single newline instead, `git add` exited 128 on
      # the empty pathspec and `git commit` exited 128 on the missing message.
      # A MISSING paths.txt is not "nothing": it is a job that never got that
      # far, and it fails here rather than reading as a quiet run.
      #
      # **Then the two outputs, and only once the push landed.** `report` and
      # `settled` each start from a fresh checkout, so this job's outputs are
      # the only way either learns what happened here: `main_commit` is the
      # commit this step pushed — empty when it pushed nothing — and BOT-81 has
      # every `applied` and every newly entered `held` name it, which is why no
      # result can be composed before this line; `results` is the job's
      # `results.json`, from which `report` composes each result. Until
      # 2026-09-22 the job's `outputs:` read both from this step and nothing
      # wrote either, so `settled` was handed no results on every run and would
      # have paged for decisions that had landed (ops entry 102). Written after
      # the push, so a step that failed on the way hands on nothing at all.
      #
      # **`DRY_RUN` withholds the push and nothing else.** Under any value but
      # exactly "false" the commit is made and checked here and stays on the
      # runner, and `main_commit` is empty. `report` then refuses every result
      # that would have named it (`resultsFor`) and `settled` pages for those
      # decisions: a dry run that had a takedown to land is RED, because the
      # takedown did not land, and that is what the alarm says.
      #
      # **It runs only when the documents and the rules are green.** Until
      # 2026-10-29 this step shared the two gates' `if`, which `!cancelled()`
      # makes true after a FAILED gate: run 40810498499's rules step failed, this
      # step pushed anyway (8bd29d5, the release of game-companion's revoke),
      # the job went red and `report` was skipped, so the service never heard
      # `applied`, listed the decision again, and the next run held it a second
      # time (abec3f9). A gate that does not stop the push is not a gate.
      #
      # **Deletions are staged already.** The commit job `git rm --cached`s
      # every listed path it deleted (a released or cancelled hold, a reset's
      # identity record) so the rules step reads the index this commit holds;
      # `git add` here takes what is still on disk, and a listed path gone from
      # disk but still in the index is a deletion nothing staged, which fails.
      - name: "Commit once, with a Service-Decision: trailer per decision, and push"
        id: apply
        if: ${{ !cancelled() && steps.compile.conclusion == 'success' && steps.documents.conclusion == 'success' && steps.rules.conclusion == 'success' }}
        run: |
          set -euo pipefail
          if [ ! -f moderation/paths.txt ]; then
            echo "::error::the commit job left no moderation/paths.txt, so this step cannot tell a run with nothing to commit from a job that never finished"
            exit 1
          fi
          main_commit=""
          if [ ! -s moderation/paths.txt ]; then
            if [ -e moderation/commit-message.txt ]; then
              echo "::error::moderation/paths.txt is empty and moderation/commit-message.txt exists; the commit job writes a message only with a path to commit"
              exit 1
            fi
            echo "nothing to commit: the commit job listed no path, so nothing is added, committed or pushed"
          else
            git config user.name "astra-registry-bot"
            git config user.email "bot@users.noreply.github.com"
            : > moderation/present.txt
            while IFS= read -r p; do
              if [ -e "$p" ] || [ -L "$p" ]; then
                printf '%s\n' "$p" >> moderation/present.txt
              elif git ls-files --error-unmatch -- "$p" > /dev/null 2>&1; then
                echo "::error::$p is listed for this commit and gone from disk, and its deletion is not staged"
                exit 1
              fi
            done < moderation/paths.txt
            if [ -s moderation/present.txt ]; then
              git add --pathspec-from-file=moderation/present.txt
            fi
            git commit --file=moderation/commit-message.txt
            # The tree rule on the commit just made, before it leaves the
            # runner (ops couplings 216). The validator above read the commit
            # this job started from, and `git add` takes whatever stands at a
            # listed path, a link included; a refusal ends the step here.
            node tools/lib/tree-modes.mjs HEAD
            if [ "${DRY_RUN:-}" != "false" ]; then
              echo "::warning::DRY_RUN is '${DRY_RUN:-}', not exactly \"false\": this commit stays on the runner and nothing is pushed"
              git show --stat --format='would push %H' HEAD
            else
              # R6 (2026-10-29): another writer of `main` (ingest, the
              # operator) can land between this job's checkout and its push;
              # run 40274912876 lost a decision for a cycle on a non-fast-
              # forward. So a rejected push fetches, rebases this one commit
              # onto the new `main`, re-checks the rebased commit — the tree
              # rule, and both generated documents at the serial it now gets
              # (`--job documents-at-head`) — and pushes again, three times at
              # most. A conflict or a failed re-check pushes nothing: the next
              # run does the work again, and applies nothing twice (R1). Not
              # one shared `concurrency` group across the writers: GitHub keeps
              # one PENDING run per group and cancels the older, so an
              # operator's dispatch could be cancelled by a moderation tick.
              for attempt in 1 2 3; do
                if git push origin HEAD:main; then
                  main_commit=$(git rev-parse HEAD)
                  break
                fi
                if [ "$attempt" = 3 ]; then
                  echo "::error::main moved under this run three times; nothing is pushed, and the next run does the work again"
                  exit 1
                fi
                echo "::warning::the push was rejected (attempt ${attempt}); rebasing this commit onto the main that moved"
                git fetch origin main
                if ! git rebase origin/main; then
                  git rebase --abort || true
                  echo "::error::this commit does not rebase cleanly onto the new main; nothing is pushed, and the next run does the work again"
                  exit 1
                fi
                node tools/lib/tree-modes.mjs HEAD
                node "${ASTRA_BOT_DIR:-.}/bot/moderation-run.mjs" --job documents-at-head --registry-dir .
              done
            fi
          fi
          {
            echo "main_commit=${main_commit}"
            echo "results<<ASTRA_MODERATION_RESULTS"
            cat moderation/results.json
            echo "ASTRA_MODERATION_RESULTS"
          } >> "$GITHUB_OUTPUT"

  # ── report: the result, and only once the commit landed ───────────────────
  #
  # BOT-6. It runs when `commit` succeeded or pushed (`main_commit` set), and
  # never otherwise: a promise without a commit is this registry's oldest
  # defect, and a commit without its result is the 2026-10-29 one. The service
  # records what this job posts.
  #
  # Under a `shadow: true` list answer it posts NOTHING for the work that answer
  # names, a `held` result included: a settled `held` takes the decision off
  # BOT-80's list and names the hold entry's commit, and a shadow run enters no
  # hold (BOT-92; ops entry 97). A released or cancelled hold's `applied` or
  # `cancelled` settles, which BOT-92 calls state-setting, so it waits for the
  # next run whose answer is `shadow: false` — and BOT-82's key settles the
  # repeat as `duplicate`.
  #
  # It composes every result HERE, from the `commit` job's `results` and
  # `main_commit`, and not in that job: an `applied` and a newly entered `held`
  # name the commit the `apply` step pushed (BOT-81), which does not exist
  # until that step has run.
  #
  # A result a commit in history decided is posted first by `list`, and the
  # ones the service settled there are recorded by `commit` and are not in
  # `results` at all. What reaches this job is what `list` could not settle —
  # a 5xx, a timeout, a shadow answer — and it is posted again here, and by
  # the next live run's `list`, until an answer settles it (ops entry 100).
  report:
    needs: [list, commit]
    # Whenever a push happened (R1, 2026-10-29): a commit that landed and was
    # never reported is a decision the service lists again. A commit job that
    # pushed and then failed still hands on `main_commit`.
    if: ${{ !cancelled() && (needs.commit.result == 'success' || needs.commit.outputs.main_commit != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: plugins-service
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # One bot OIDC token per call, minted and masked as `list`'s are. At most
      # one `held` and exactly one final result per decision, to
      # bot/service-decision-results, 20 seconds per call; an identical re-post
      # after a lost acknowledgement is answered `duplicate` under BOT-82's key.
      # A result that would name no commit is refused here and fails the job
      # (`resultsFor`), so `settled` pages for it rather than the service
      # recording a takedown that landed nowhere.
      - name: Post each result once, and re-send it byte-identical
        env:
          ASTRA_RESULTS: ${{ needs.commit.outputs.results }}
          ASTRA_MAIN_COMMIT: ${{ needs.commit.outputs.main_commit }}
        run: node bot/moderation-run.mjs --job report

  # ── settled: every listed id got a result, and the run said it was alive ───
  #
  # It runs `always()` and it is the last job, which is what makes it the one
  # that can post BOT-85's heartbeat: a run in which `commit` died still ran,
  # and the receiver's silence must mean the WORKFLOW stopped rather than that
  # one job did.
  #
  # It fails and alerts when a listed id got no result, or when `list` failed.
  # BOT-84 pages only for a decision with NO settled result, so this is the one
  # place in the estate that can see an id which was listed, not refused, not
  # compiled and not held — a decision that fell out of the run in silence.
  settled:
    needs: [list, alert, commit, report]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: alerts
    permissions:
      contents: read
      id-token: none
    env:
      ASTRA_ALERT_TELEGRAM_TOKEN: ${{ secrets.ASTRA_ALERT_TELEGRAM_TOKEN }}
      ASTRA_ALERT_CHAT_ID: ${{ secrets.ASTRA_ALERT_CHAT_ID }}
      ASTRA_ALERT_COPY_CHAT_ID: ${{ secrets.ASTRA_ALERT_COPY_CHAT_ID }}
      ASTRA_DEADMAN_URL_MODERATION_RUN: ${{ secrets.ASTRA_DEADMAN_URL_MODERATION_RUN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The results count only in a run whose `report` succeeded. A result the
      # commit job recorded and `report` never posted is a decision the service
      # still has no result for — the one this job exists to see — so a failed
      # or skipped `report` hands this step nothing, and every listed id pages.
      - name: Every decision this run was handed has a result
        id: settle
        continue-on-error: true
        env:
          ASTRA_LISTED_IDS: ${{ needs.list.outputs.listed }}
          ASTRA_RESULTS: ${{ needs.report.result == 'success' && needs.commit.outputs.results || '' }}
          ASTRA_MAIN_COMMIT: ${{ needs.commit.outputs.main_commit }}
          ASTRA_LIST_FAILED: ${{ needs.list.result != 'success' }}
        run: node bot/moderation-run.mjs --job settled

      # The verdict is composed from the step above rather than from its exit
      # code alone, so that the alarm carries the ids. `continue-on-error` on
      # that step and a red verdict here is the order that matters: a job that
      # died before composing a verdict would send nothing, and a dead-man
      # receiver that had already been told the run was healthy would stay
      # quiet about it.
      - name: The verdict this run sends
        env:
          ASTRA_VERDICT_CODES: ${{ steps.settle.outcome == 'success' && '[]' || '["BOT_84_UNSETTLED_DECISION"]' }}
          ASTRA_VERDICT_IDS: '[]'
        run: node bot/moderation-run.mjs --job verdict --check moderation-run --out verdict.json

      - uses: ./.github/actions/alert
        id: alert
        with:
          verdict: verdict.json
          check: moderation-run

      # The red comes AFTER the alarm, and that order is the whole of it. A job
      # that failed on the settle step would never have reached the alert
      # action, and a decision that fell out of a run in silence would be
      # reported by a red tick on a page nobody is watching at 03:00 — which is
      # the state BOT-84 pages for and cannot see, because a refused decision
      # is settled and this one is not refused, it is missing.
      - name: A run that lost a decision is a red run
        if: steps.settle.outcome != 'success'
        run: |
          set -euo pipefail
          echo "::error::a decision the service listed got no result in this run; the alarm above carries the reason"
          exit 1
