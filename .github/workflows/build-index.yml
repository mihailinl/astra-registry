name: Registry index

# ─────────────────────────────────────────────────────────────────────────────
# Regenerates and validates registry/v1/index.json on every push and every PR.
#
# WHAT THIS FILE IS DEFENDING
#
#   A listing that nobody can verify.  `validate.mjs` refuses an artifact with
#     no digest unless --allow-staging is passed, and that flag is passed on
#     exactly one line below, with a comment naming the day it comes out.
#   An index somebody edited by hand.  `build-index.mjs --check` regenerates the
#     committed file from plugins/** and compares byte for byte. Editing a URL
#     or a digest straight into the index — the single highest-value edit an
#     attacker with commit access could make — is a red build, not a merge.
#   An index that is not reproducible.  The `determinism` step generates twice
#     and diffs. This file is signed below, and a signature over bytes a rerun
#     cannot reproduce is a signature nobody can audit. It is also why the
#     generator stamps no timestamp and bot/sign-index.mjs does: content is
#     reproducible, publication time is not, and only one of them is generated.
#   An unsigned catalogue reaching users.  On `main` the signing key must be
#     present and the signature must verify against the published root-signed
#     trust.json, or this job fails. An unsigned file arriving at the CDN under
#     the name of a signed one is a downgrade attack the registry would have
#     performed on itself.
#
# WHAT IT IS NOT.  It does not deploy, and it does not prove where any artifact
# came from. Phase 3.3 adds the attestation checks; until then, say so rather
# than letting a green tick imply more than it means.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One index build in flight at a time. Two runs racing would each compute a
# serial and each upload an artifact, and whichever finished second would win —
# which is not necessarily the newer one. `cancel-in-progress: false` because
# the run already in flight is doing real work; queue behind it, do not kill it.
concurrency:
  group: registry-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The serial is a commit count. Without full history git counts what
          # it was given, which is 1, and the catalogue looks like it rolled
          # back to the beginning of time.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`. This repo has no dependencies, on purpose: the validator
      # is the last gate before a listing reaches a stranger's machine, and it
      # has to be a gate that still runs when a registry is down or a lockfile
      # is being argued about. If you ever add a dependency here, explain in
      # this comment why the gate is better for it.
      - name: Self-test (schemas, canonical JSON, the rejections)
        run: node tools/selftest.mjs

      - name: Validate the listings
        # --allow-staging tolerates plugins/dice-roller/versions/0.1.1.json,
        # whose release does not exist yet. REMOVE IT the moment Phase 2.13
        # publishes that release and the entry gains a real digest. A registry
        # that keeps this flag on is a registry that lists things it cannot
        # verify, which is the one thing it exists not to do.
        run: node tools/validate.mjs --allow-staging

      - name: The committed index is exactly what the generator produces
        run: node tools/build-index.mjs --check

      - name: Compute the serial from the commit count on the default branch
        id: serial
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.repository.default_branch }}"
          # Path-limited to plugins/: the serial is the catalogue's version, and
          # a commit that touches only docs or tooling did not change the
          # catalogue. It also means a future bot that regenerates and commits
          # the index cannot bump the serial and re-trigger itself forever.
          # Never read-and-increment a counter file: two PRs merging in the same
          # minute both read N, both write N+1, and the second silently
          # un-bumps the first. A commit count cannot do that.
          SERIAL="$(git rev-list --count "origin/${BRANCH}" -- plugins 2>/dev/null \
                    || git rev-list --count HEAD -- plugins)"
          echo "serial=${SERIAL}" >> "$GITHUB_OUTPUT"
          echo "serial ${SERIAL} (commits touching plugins/ on ${BRANCH})"

      - name: Generate the deploy candidate, twice, and diff it
        env:
          ASTRA_REGISTRY_SERIAL: ${{ steps.serial.outputs.serial }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node tools/build-index.mjs --stdout > dist/index.json
          node tools/build-index.mjs --stdout > dist/index.again.json
          diff -u dist/index.json dist/index.again.json \
            || { echo "::error::the index generator is not deterministic"; exit 1; }
          rm dist/index.again.json
          echo "bytes: $(wc -c < dist/index.json), sha256: $(sha256sum dist/index.json | cut -d' ' -f1)"

      - name: Validate the deploy candidate against schema/index-v1.json
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            import("./tools/lib/jsonschema.mjs").then(({ validate }) => {
              const schema = JSON.parse(fs.readFileSync("schema/index-v1.json", "utf8"));
              const doc = JSON.parse(fs.readFileSync("dist/index.json", "utf8"));
              const errs = validate(schema, doc);
              for (const e of errs) console.error(`${e.path} ${e.message}`);
              if (errs.length) process.exit(1);
              console.log(`ok  dist/index.json validates, serial ${doc.signed.serial}, ${doc.signed.plugins.length} plugin(s)`);
            });
          '

      # ── 3.2: the signature ────────────────────────────────────────────────
      #
      # The key lives in the `publish` environment with the maintainer as a
      # required reviewer (PRODUCTION_PLAN §5.1), so it is unavailable on a pull
      # request and on a fork by construction — which is the point. This job
      # therefore has to do something sensible with no key, and "quietly deploy
      # an unsigned catalogue" is not it: an unsigned file that reaches the CDN
      # under the same name as a signed one is a downgrade attack the registry
      # performed on itself.
      #
      # So the rule is: on `main`, the key MUST be there and the signature MUST
      # verify. Anywhere else, sign nothing, say so, and upload the unsigned
      # candidate as a build artefact only — never as a deploy.
      - name: Sign the deploy candidate
        id: sign
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          ASTRA_INDEX_SIGNING_KEY: ${{ secrets.ASTRA_INDEX_SIGNING_KEY }}
          ASTRA_INDEX_SIGNING_KEY_ID: ${{ secrets.ASTRA_INDEX_SIGNING_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ASTRA_INDEX_SIGNING_KEY:-}" ]; then
            echo "::error::no ASTRA_INDEX_SIGNING_KEY on main. Refusing to publish an unsigned catalogue."
            exit 1
          fi
          # The key is passed through the environment and never appears on a
          # command line: `ps` is readable by every process on the runner and
          # `set -x` would put it in the log.
          node bot/sign-index.mjs --in dist/index.json --out dist/index.signed.json
          mv dist/index.signed.json dist/index.json
          echo "sha256: $(sha256sum dist/index.json | cut -d' ' -f1)"

      # Verified against the CURRENTLY PUBLISHED root-signed trust.json, not
      # against the key we just signed with. Signing with a key and then
      # checking the signature with the same key proves the crypto library
      # works; checking it against trust.json proves the daemon will accept it.
      # A key that has fallen out of its validity window fails here rather than
      # in every user's client.
      - name: Verify the signature the way the daemon will
        if: steps.sign.outcome == 'success'
        run: |
          set -euo pipefail
          if [ ! -f registry/v1/trust.json ]; then
            echo "::error::registry/v1/trust.json is not published yet, so nothing can check this signature."
            exit 1
          fi
          node bot/sign-index.mjs --verify dist/index.json --trust registry/v1/trust.json

      - name: Say plainly that nothing here is signed
        if: steps.sign.outcome == 'skipped'
        run: echo "::notice::dist/index.json is UNSIGNED — the signing key is unavailable outside main. This artefact is for inspection, not for deploy."

      - uses: actions/upload-artifact@v4
        with:
          name: registry-index-v1
          path: dist/index.json
          if-no-files-found: error
