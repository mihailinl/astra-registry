name: Registry index

# ─────────────────────────────────────────────────────────────────────────────
# Regenerates and validates registry/v1/index.json on every push and every PR.
#
# **THIS FILE NO LONGER SIGNS OR DEPLOYS ANYTHING** (registry plan D1,
# RC-R1-2). Its `sign` and `deploy` jobs are gone; `.github/workflows/sign.yml`
# is the one publisher of the catalogue, the withdrawal list and Pages, and it
# is the one job in this repository that holds the index signing key. The two
# left in the same commit those jobs left, because a two-publisher interval is
# the race being removed and two commits are what would create one.
#
# What remains here is every CHECK, and that is the point of the split: these
# run on a pull request, for strangers, and must never be able to reach a key.
# The signer runs them again in its own way at the Source-Commit and decides
# what to publish; this job decides whether a change may land on `main` at all.
#
# WHAT THIS FILE IS DEFENDING
#
#   A listing that nobody can verify.  `validate.mjs` refuses an artifact with
#     no digest unless --allow-staging is passed, and that flag is passed on
#     exactly one line below, with a comment naming the day it comes out.
#   An index somebody edited by hand.  `build-index.mjs --check` regenerates the
#     committed file from plugins/** and compares byte for byte. Editing a URL
#     or a digest straight into the index — the single highest-value edit an
#     attacker with commit access could make — is a red build, not a merge.
#   An index that is not reproducible.  The `determinism` step generates twice
#     and diffs. The signer signs bytes it generates the same way, and a
#     signature over bytes a rerun cannot reproduce is a signature nobody can
#     audit. It is also why the generator stamps no timestamp and the signer
#     does: content is reproducible, publication time is not, and only one of
#     them is generated.
#   A cross-repository coupling that silently did not run.  This job HAS the
#     AstraPlugins checkout, so a `NOT verified` line here means a check that
#     should have run did not, and it is exit 1. The signer has no checkout by
#     design and its notes decide nothing (seam 4) — signing that waits on
#     another repository is signing that stops when that repository is
#     unavailable, which is when a withdrawal is most likely to be needed.
#
#   A website that disagrees with the catalogue.  Task 6.5. The site is
#     generated from `dist/index.json` — the candidate this job built — and the
#     same file is published under `/registry/v1/` inside the site tree. A
#     plugin page therefore exists if and only if an index entry does, by
#     construction rather than by discipline. The site that is DEPLOYED is
#     built the same way by `sign.yml`'s `pages` job, over `signed`'s bytes.
#
# WHAT IT IS NOT.  It does not prove where any artifact came from. Phase 3.3
# adds the attestation checks; until then, say so rather than letting a green
# tick imply more than it means. Nothing it produces reaches a user: the
# artifact it uploads is unsigned and is for inspection.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The bot just finished. Check what it committed, now, rather than at the top
  # of the next hour.
  #
  # `workflow_run` fires when another workflow COMPLETES. That is the whole
  # point of using it here: the rule that keeps `ingest.yml`'s publish commit
  # from starting this file — GitHub does not raise workflow-starting events
  # from the repository's own `GITHUB_TOKEN` — is about `push`, and does not
  # reach an event the platform raises about a run finishing. So this is the one
  # prompt trigger available that needs no personal access token in a secret,
  # which `ingest.yml` argues against at length and for good reason: the job it
  # would sit in exists precisely to hold no credentials.
  #
  # **What it no longer buys is publication latency.** It used to: signing and
  # the Pages deploy lived here, and on 2026-08-20 the catalogue published
  # `minecraft-for-astra 0.3.3` at 18:03 while mihailinl.github.io served 0.3.1
  # until 18:09. That is `sign.yml`'s job now, and it hears the same completion
  # on its own trigger. What is left here is worth keeping on its own: the
  # bot's commit is the one commit that reaches `main` without a pull request,
  # so it is the one commit whose checks would otherwise wait for the hour.
  #
  # `success` is gated on below because a failed ingest committed nothing, so
  # re-checking after one is pure noise. **The signer's rule is the opposite,
  # and deliberately so** (D1): a run that committed and THEN failed a later
  # job must not leave its takedown waiting for the cron, so `sign.yml` gates
  # on completion alone. The cost of the rule here is real and bounded: a run
  # that commits and then fails a LATER job — `Plugins ingest`'s `report`, say —
  # is not re-checked until the cron below. That is the schedule's job.
  #
  # ── every workflow that commits to `main`, by the name in its own file ──
  #
  # BOT-50's build-index conjunct. The list is matched against another file's
  # `name:` by string at dispatch time, so a rename breaks it in silence: no
  # error, no warning, no run. `bot/tests/policy.test.mjs` reads these names out
  # of the workflow files and compares, and refuses a `contents: write` workflow
  # that appears in neither this list nor its exception map.
  #
  #   Ingest              commits plugins/** from `bot/publish-apply.mjs`.
  #   Plugins ingest      the service path, same committer, and it also commits
  #                       state/** and registry/v1/index.json (B-T3.1).
  #   Plugins moderation  regenerates the index and the withdrawal list and
  #                       commits both to main (M-T3.4).
  #   publisher re-check  commits publishers/** and regenerates NOTHING — and
  #                       `build-index.mjs` embeds `last_confirmed_at` and
  #                       `tier` per publisher. Its commit is therefore the one
  #                       that can leave the committed index disagreeing with a
  #                       fresh generation, which is the single assertion this
  #                       file exists to make.
  #
  # **Three of the four commit nothing today, and are listed anyway**, exactly
  # as `sign.yml`'s list was and for the reason its header gives: a trigger
  # naming a workflow that never runs costs nothing, and a checker that goes
  # deaf on the day one of them lands costs an hour of `main` being wrong with
  # nothing red anywhere. `plugins-ingest.yml`'s schedule is commented out until
  # R3 (plan row reg.52) and its publish job exits 1 on B-T3.4;
  # `plugins-moderation.yml`'s commit job exits 1 on M-T3.2; `publisher
  # re-check` runs daily but writes only for a publisher whose tier is
  # `verified`, and both records here are `astra_team`.
  workflow_run:
    workflows: ["Ingest", "Plugins ingest", "Plugins moderation", "publisher re-check"]
    types: [completed]
  # Hourly. THE BOT'S PUBLISH COMMIT DOES NOT TRIGGER THIS FILE by `push`:
  # `ingest.yml`'s publish job commits with the repository's own
  # `GITHUB_TOKEN`, and GitHub does not start workflow runs from events raised
  # by that token — the same rule `ingest.yml` documents at the top of itself
  # for its cron paths. The `workflow_run` trigger above covers that case and
  # this is the backstop for the run that never started.
  #
  # **The catalogue's expiry is no longer a reason for this schedule.**
  # `CATALOG_TTL_DAYS` is 30 and `issued_at` is stamped at SIGNING, which
  # happens in `sign.yml`; its own hourly cron is what refreshes a document
  # nobody has changed (D4's cadence: re-signed once `signed`'s copy is 20
  # hours old). Nothing this job produces has an expiry, because nothing it
  # produces is published.
  schedule:
    - cron: '23 * * * *'

# One index build in flight at a time. Two runs racing would each compute a
# serial and each upload an artifact, and whichever finished second would win —
# which is not necessarily the newer one. `cancel-in-progress: false` because
# the run already in flight is doing real work; queue behind it, do not kill it.
#
# A PULL REQUEST gets a group of its own. It publishes nothing, so it has no
# race to lose — and in the shared group it did harm: GitHub keeps one PENDING
# run per group, so a PR's run queued behind a main run was cancelled when the
# next run queued, and `gh pr checks` then listed no Registry index check at all
# for that head. A PR could be merged with its selftest never having run on it
# (measured 2026-09-22: run 35768780051, cancelled 7 s after it was queued).
# Per PR, a newer push still replaces an older pending run of the same PR,
# which is the run nobody needs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('registry-index-pr-{0}', github.event.pull_request.number) || 'registry-index' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ── check ────────────────────────────────────────────────────────────────
  #
  # Every check, and no key. This job holds NO environment: an environment is
  # where the signing key lives, and a job that runs on a pull request must not
  # be able to reach it. Splitting it out is what makes that structural rather
  # than a matter of remembering the `if:` on one step (registry plan RC-R0-1).
  check:
    runs-on: ubuntu-24.04
    # A failed ingest published nothing, so there is nothing new to check. Every
    # other event carries no `workflow_run` object and the condition is vacuously
    # true for them — the push, the schedule, the dispatch and the pull request
    # all reach this job exactly as they did before.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # The serial is a commit count. Without full history git counts what
          # it was given, which is 1, and the catalogue looks like it rolled
          # back to the beginning of time.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No `npm ci`. This repo has no dependencies, on purpose: the validator
      # is the last gate before a listing reaches a stranger's machine, and it
      # has to be a gate that still runs when a registry is down or a lockfile
      # is being argued about. If you ever add a dependency here, explain in
      # this comment why the gate is better for it.
      - name: Self-test (schemas, canonical JSON, the rejections)
        run: node tools/selftest.mjs --loads  # records what the run loads; no gate passes this (ops couplings 116)

      # `bot/manifest-probe/astra-plugins.pin` names the AstraPlugins commit
      # whose `astra-plugin-manifest` this bot judges a stranger's manifest
      # with. It is a SHA typed by hand, and for a while it named a commit on a
      # branch that was rewritten before it was pushed — so it existed nowhere,
      # `link-deps.sh --clone` died with `fatal: unable to read tree`, and the
      # first real submission was answered with "the ingest job did not produce
      # a report".
      #
      # That answer is honest and it is useless: it points at the whole bot. A
      # bad pin belongs to whoever pushed it, so it is checked here, on push,
      # rather than discovered by a stranger opening an issue.
      #
      # Read from the pin file, not out of `ingest.yml` (B-T1.4): that workflow
      # is deleted at R6 and this grep would then have matched nothing, which
      # `|| true` turns into an empty `ref` and the shape check below into the
      # only thing standing between R6 and an unpinned judgement.
      - name: The AstraPlugins pin this bot judges manifests by is fetchable
        if: ${{ !cancelled() }}
        id: pin
        run: |
          set -euo pipefail
          pin=bot/manifest-probe/astra-plugins.pin
          if [ ! -f "$pin" ]; then
            echo "::error::$pin is missing. It is the only place ASTRA_PLUGINS_REF is written (B-T1.4)."
            exit 1
          fi
          ref=$(grep -oP '^ASTRA_PLUGINS_REF=\K[0-9a-f]+' "$pin" || true)
          url=$(grep -oP '^ASTRA_PLUGINS_URL=\K\S+' "$pin" || true)
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ASTRA_PLUGINS_REF is not a 40-hex commit in $pin: '$ref'"
            exit 1
          fi
          if [ -z "$url" ]; then
            echo "::error::ASTRA_PLUGINS_URL is not in $pin"
            exit 1
          fi
          # `--filter=blob:none` fetches the commit and its trees without the
          # file contents: enough to prove it is reachable, and a fraction of a
          # clone. A commit on no remote ref fails here exactly as it would in
          # the bot.
          tmp=$(mktemp -d)
          git init -q "$tmp"
          if ! git -C "$tmp" fetch -q --depth 1 --filter=blob:none "$url" "$ref" 2>/dev/null; then
            echo "::error::$url has no commit $ref."
            echo "Nothing can fetch it, so every ingest fails before it reads a manifest."
            echo "Point ASTRA_PLUGINS_REF at a commit that is on a branch or a tag."
            exit 1
          fi
          echo "ok    $ref is fetchable from $url"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # The pinned tree on disk, so the cross-repository couplings are CHECKED
      # rather than reported as unchecked.
      #
      # `validate.mjs` compares `policy/limits.json`'s `*_mirrors` entries and
      # `bot/lib/assets.mjs`'s ICON_FORMATS against `spec/limits.yaml` and
      # `spec/icon-formats.yaml` in AstraPlugins — and looks for that checkout
      # at `$ASTRA_PLUGINS_DIR`, else a sibling directory. CI had neither. Both
      # checks were therefore reporting "NOT verified: no checkout found" on
      # every run, which is the honest answer and reads, in a wall of green,
      # exactly like a check that passed.
      #
      # The numeric mirror has been in that state since it was written. The
      # icon-format one was added the same day this was noticed, and would have
      # joined it.
      #
      # `sparse-checkout` because only these two directories are read; the
      # manifest crate the pin also governs is fetched separately by
      # `link-deps.sh` in the job that needs it.
      #
      # `testdata/locales` is the shared locale-rule corpus — coupling C16 —
      # read by `tools/validate.mjs` here and by `astra-plugin`'s own unit tests
      # there, so that the rules the CLI refuses a bundle by and the rules this
      # repository refuses a listing by are held to one set of fixtures instead
      # of to each other's good intentions.
      #
      # It is added HERE, in its own commit, BEFORE anything reads it. A reader
      # pointed at a directory a sparse checkout does not fetch enumerates
      # nothing, and this workflow is unusually unforgiving of that by design:
      # the "Validate the listings" step below turns any `NOT verified` line
      # into `::error::` and `exit 1`, which stops the catalogue deploying for
      # every plugin — not only for one that ships `locales/`.
      - uses: actions/checkout@v4
        if: ${{ !cancelled() && steps.pin.conclusion == 'success' }}
        with:
          repository: mihailinl/AstraPlugins
          ref: ${{ steps.pin.outputs.ref }}
          path: _astra-plugins
          sparse-checkout: |
            spec
            testdata/locales
          persist-credentials: false
          fetch-depth: 1

      # The site's own tests, and they run BEFORE the catalogue is built rather
      # than after the site is. The one they exist for — a page exists iff an
      # entry does — is asserted in both directions against a synthetic
      # catalogue, so it is a property of the generator rather than a property
      # of today's eleven listings.
      #
      # The presentation suite runs here as well as in `ingest.yml`, and the
      # duplication is deliberate: `ingest.yml` is event-driven — issues,
      # dispatch, cron — and never fires on a pull request, so a change to the
      # icon and README derivation could reach `main` with nothing having run
      # its tests. This workflow is the one that gates a PR.
      - name: Self-test (the site, the moderation log, the asset check, the presentation rules)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node site/selftest.mjs
          node bot/moderation.mjs --check
          node bot/tests/asset-check.test.mjs
          node bot/tests/presentation.test.mjs

      - name: Validate the listings
        if: ${{ !cancelled() }}
        # --allow-staging tolerates every version file marked `"staging": true`:
        # a listing with no artifact digest, because its release has not been
        # cut. That field is the only thing `validate.mjs` identifies a staging
        # entry by, and without the flag it refuses each one. This comment names
        # none of them, because the set moves: this step's own output lists
        # them, one `accepted as staging (--allow-staging)` line each, and
        # `node tools/validate.mjs` run without the flag prints each as an
        # ERROR. REMOVE THE FLAG the moment the last of them gains a real
        # digest. A registry that keeps this flag on is a registry that lists
        # things it cannot verify, which is the one thing it exists not to do.
        env:
          # The checkout above. Without it both cross-repository couplings
          # degrade to a note, and a note in a green run is invisible.
          ASTRA_PLUGINS_DIR: ${{ github.workspace }}/_astra-plugins
        run: |
          set -uo pipefail
          # `|| status=$?`, because the runner's shell is `bash -e` and a bare
          # call would abort here the moment the validator returned non-zero —
          # the same mistake ingest.yml made, where it cost every correct
          # outcome a red X.
          status=0
          out=$(node tools/validate.mjs --allow-staging 2>&1) || status=$?
          printf '%s\n' "$out"
          # A checkout that silently did not arrive would put both couplings
          # back to "not verified" with nothing red anywhere — the exact state
          # this step was added to end. So the absence of the checkout is an
          # error here, even though the validator is right to call it a note.
          if printf '%s' "$out" | grep -q "NOT verified"; then
            echo "::error::a cross-repository coupling did not run. \$ASTRA_PLUGINS_DIR is ${ASTRA_PLUGINS_DIR}."
            exit 1
          fi
          exit $status

      - name: The committed index is exactly what the generator produces
        if: ${{ !cancelled() }}
        run: node tools/build-index.mjs --check

      - name: Compute the serial from the commit count on the default branch
        if: ${{ !cancelled() }}
        id: serial
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.repository.default_branch }}"
          # Path-limited to plugins/: the serial is the catalogue's version, and
          # a commit that touches only docs or tooling did not change the
          # catalogue. It also means a future bot that regenerates and commits
          # the index cannot bump the serial and re-trigger itself forever.
          # Never read-and-increment a counter file: two PRs merging in the same
          # minute both read N, both write N+1, and the second silently
          # un-bumps the first. A commit count cannot do that.
          SERIAL="$(git rev-list --count "origin/${BRANCH}" -- plugins 2>/dev/null \
                    || git rev-list --count HEAD -- plugins)"
          echo "serial=${SERIAL}" >> "$GITHUB_OUTPUT"
          echo "serial ${SERIAL} (commits touching plugins/ on ${BRANCH})"

      - name: Generate the deploy candidate, twice, and diff it
        id: candidate
        if: ${{ !cancelled() && steps.serial.conclusion == 'success' }}
        env:
          ASTRA_REGISTRY_SERIAL: ${{ steps.serial.outputs.serial }}
        run: |
          set -euo pipefail
          mkdir -p dist
          node tools/build-index.mjs --stdout > dist/index.json
          node tools/build-index.mjs --stdout > dist/index.again.json
          diff -u dist/index.json dist/index.again.json \
            || { echo "::error::the index generator is not deterministic"; exit 1; }
          rm dist/index.again.json
          echo "sha256: $(sha256sum dist/index.json | cut -d' ' -f1)"
          echo "signed=true" >> "$GITHUB_OUTPUT"

          # The size gate. This step used to echo `wc -c` and compare it to
          # nothing, while notes/icon-readme-contract.md's "do not let the index
          # quietly grow past a few megabytes" was enforced by nobody reading a
          # log line. The catalogue is ONE signed document that every install
          # fetches whole every hour, so its size is a cost paid by every user
          # of every plugin, and it grows one listing at a time in pull requests
          # that each look small.
          bytes=$(wc -c < dist/index.json)
          ceiling=$(node -p 'require("./policy/limits.json").max_index_bytes')
          if [ "$bytes" -gt "$ceiling" ]; then
            echo "::error::index is $bytes bytes, over the $ceiling ceiling in policy/limits.json."
            echo "Icons and READMEs are three quarters of this document. The fix is to move the"
            echo "largest inlined field to a *_url + *_sha256 pair, which notes/icon-readme-contract.md"
            echo "already sanctions — not to raise the number, which needs a written reason in"
            echo "policy/limits.json's max_index_bytes_note."
            exit 1
          fi
          echo "index: $bytes / $ceiling bytes ($(( bytes * 100 / ceiling ))%)"

      - name: Validate the deploy candidate against schema/index-v1.json
        if: ${{ !cancelled() && steps.candidate.conclusion == 'success' }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            import("./tools/lib/jsonschema.mjs").then(({ validate }) => {
              const schema = JSON.parse(fs.readFileSync("schema/index-v1.json", "utf8"));
              const doc = JSON.parse(fs.readFileSync("dist/index.json", "utf8"));
              const errs = validate(schema, doc);
              for (const e of errs) console.error(`${e.path} ${e.message}`);
              if (errs.length) process.exit(1);
              console.log(`ok  dist/index.json validates, serial ${doc.signed.serial}, ${doc.signed.plugins.length} plugin(s)`);
            });
          '
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.candidate.conclusion == 'success' }}
        with:
          name: registry-index-v1
          path: dist/index.json
          if-no-files-found: error

      - name: Say plainly that nothing here is signed
        if: ${{ !cancelled() && steps.candidate.conclusion == 'success' }}
        run: echo "::notice::dist/index.json is UNSIGNED — this workflow holds no signing key by construction, and since RC-R1-2 no job in it publishes anything. This artefact is for inspection. sign.yml is the one publisher."
      # ── 6.5: the website, built here from the candidate to assert the page set ──
      #
      # This workflow never signs, so what it builds is the UNSIGNED candidate:
      # the assertion it exists for — a page exists iff an entry does — is a
      # property of the entry set, which signing does not change. `sign.yml`'s
      # `pages` job builds the site again from `signed`'s bytes, which is the
      # tree that is actually deployed.
      #
      # `dist/registry/v1/` is assembled first and `--index` points INTO it, so
      # the bytes the generator reads and the bytes published under
      # `/registry/v1/index.json` are one file rather than two copies of one.
      # That is what makes "a page exists iff an entry does" structural: there
      # is no second input that could be stale.
      #
      # The withdrawal list and the trust documents are taken from the committed
      # tree, unsigned. `sign.yml` owns their generation and signing, and a
      # listing build that re-signed them would be the second publisher of a
      # document that must have exactly one. Nothing assembled here is
      # deployed — this tree exists so the page set can be asserted.
      - name: Assemble the tree the site is generated from
        id: site
        if: ${{ !cancelled() && steps.candidate.conclusion == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p dist/registry/v1
          cp dist/index.json dist/registry/v1/index.json
          for f in revocations.json trust.json root.json; do
            [ -f "registry/v1/$f" ] && cp "registry/v1/$f" "dist/registry/v1/$f"
          done
          node site/build.mjs \
            --index dist/registry/v1/index.json \
            --revocations dist/registry/v1/revocations.json \
            --registry-dir dist/registry/v1 \
            --repo "${{ github.repository }}" \
            --out dist/site

      # The acceptance criterion, asserted against what was actually written
      # rather than against what the generator says it wrote.
      - name: A page exists for every entry, and for nothing else
        if: ${{ !cancelled() && steps.site.conclusion == 'success' }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const ids = JSON.parse(fs.readFileSync("dist/registry/v1/index.json", "utf8"))
              .signed.plugins.map((p) => p.id).sort();
            const pages = fs.readdirSync("dist/site/p").sort();
            const missing = ids.filter((i) => !pages.includes(i));
            const extra = pages.filter((p) => !ids.includes(p));
            if (missing.length || extra.length) {
              console.error(`::error::pages and entries disagree — missing ${missing.join(", ") || "none"}, extra ${extra.join(", ") || "none"}`);
              process.exit(1);
            }
            console.log(`ok  ${ids.length} entr(y/ies), ${pages.length} page(s), and they are the same set`);
          '
