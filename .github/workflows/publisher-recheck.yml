name: publisher re-check

# `verified` is a standing claim, not a verdict, so something has to keep
# checking it. This is that something.
#
# A publisher earns the tier by serving a document on a domain they control
# that names their GitHub login. This re-fetches those documents daily and
# pushes the confirmation window forward when one still holds. A FAILURE moves
# nothing — a certificate renewing or a CDN having a minute is not a publisher
# ceasing to exist, and a badge that flickered would be one nobody read.
#
# What withdraws a badge is therefore the ABSENCE of confirmations rather than
# the presence of a failure: the window runs out, and the record is deleted in
# an ordinary commit somebody can read in the log.
#
# The clock lives here and nowhere downstream. tools/build-index.mjs reads no
# clock by contract — same sources, same bytes — so expiry could not be enforced
# there without making today's catalogue differ from tomorrow's for a reason no
# diff can show.

on:
  schedule:
    # Early, and off the hour, for the same reason as asset-check: a cron that
    # everybody writes at midnight is a cron that runs late.
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publisher-recheck
  cancel-in-progress: false

jobs:
  recheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # commit a renewed window, or a withdrawal
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Re-fetch every verified publisher's evidence
        id: run
        run: |
          set -euo pipefail
          node bot/recheck-publishers.mjs --write | tee "$RUNNER_TEMP/recheck.log"
          {
            echo 'report<<REPORT'
            cat "$RUNNER_TEMP/recheck.log"
            echo REPORT
          } >> "$GITHUB_OUTPUT"

      # Two paths, and the second is not optional: a withdrawn record that was
      # declared in state/publishers-without-listing.json takes its
      # declaration with it, because the suite refuses a declaration that names
      # no record. The job drops it; this commits it with the withdrawal. The
      # path is bot/recheck-publishers.mjs's NO_LISTING_FILE, and
      # tools/selftest/publishers.mjs fails if this step stops staging it — or
      # stages anything inside contract TRUST-31's hashed set: this job runs
      # unattended, and after R3 such a commit would put the bot into shadow.
      # That is why the declarations are under state/ and not tools/selftest/.
      #
      # The message, and why it is built this way (registry plan M-T5.8,
      # contract MOD-44). A deletion here narrows a publisher record, and the
      # coverage canary's walk (moderation-coverage.yml) is red on a narrowing
      # that carries neither `Badge-Withdrawn: <reason>` nor
      # `Moderation-Exempt:`. A lapse is no withdrawal for cause — it sends no
      # notice (MOD-44: "for such a commit, and no other") — so it never
      # carries `Badge-Withdrawn:`, and it carries the exemption only when the
      # report says a badge came off (`GONE`), because a renewal narrows
      # nothing and an exemption on it would say something false.
      #
      # **The report is indented** before it goes into the message. The walk
      # reads `Moderation-Exempt:` and `Badge-Withdrawn:` at the start of ANY
      # line of a message, and a `Moderation-Exempt: <sha>: …` line clears
      # another commit. Every line the re-check prints starts with a fixed
      # word today, and the one variable part that is not a committed file is
      # an error message; indenting the whole report makes "no line of the
      # report can be a trailer" a property of this step rather than of every
      # message the fetcher may one day print. `bot/tests/moderation-coverage
      # .test.mjs` runs this block for real, in a fixture, and holds both.
      - name: Commit whatever moved
        run: |
          set -euo pipefail
          if git diff --quiet -- publishers/ state/publishers-without-listing.json; then
            echo "nothing moved"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- publishers/ state/publishers-without-listing.json
          {
            printf 'publishers: re-check %s\n\n' "$(date -u +%Y-%m-%d)"
            sed 's/^/    /' "$RUNNER_TEMP/recheck.log"
            if grep -q '^GONE ' "$RUNNER_TEMP/recheck.log"; then
              printf '\nModeration-Exempt: publisher-recheck: evidence lapsed past the confirmation window\n'
            fi
          } > "$RUNNER_TEMP/commit-message.txt"
          git commit -F "$RUNNER_TEMP/commit-message.txt"
          git push

      # A withdrawal is the one outcome a person has to hear about. It used to
      # open an issue for the publisher; from the cutover no issue on this
      # repository reaches anybody (DEC-12), so it is an alarm to the owner
      # through environment `alerts`, and this job lost `issues: write`
      # (registry plan M-T6.2 commit C, BOT-53). A lapse is not a withdrawal
      # for cause (MOD-44), so no `notice.moderated` goes to the publisher; the
      # owner, told here, is who can ask them to restore the evidence. The
      # verdict carries a code and the run, never a login.
      - name: The verdict a withdrawn badge owes the alarm channel
        id: verdict
        if: always()
        env:
          GONE: ${{ contains(steps.run.outputs.report, 'GONE') }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import { runUrl } from "./bot/lib/alert-verdict.mjs";
            const red = process.env.GONE === "true";
            const run = runUrl();
            const verdict = { schema: "astra.registry.alert-verdict/1", check: "publisher-recheck",
              status: red ? "red" : "green", codes: red ? ["PUBLISHER_BADGE_WITHDRAWN"] : [], ...(run ? { run } : {}) };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `verdict=${JSON.stringify(verdict)}\n`);
          '

  # The alarm, in environment `alerts`, reading nothing but the verdict.
  alert:
    needs: recheck
    if: always() && !cancelled() && needs.recheck.outputs.verdict != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: alerts
    permissions:
      contents: read
    env:
      ASTRA_ALERT_TELEGRAM_TOKEN: ${{ secrets.ASTRA_ALERT_TELEGRAM_TOKEN }}
      ASTRA_ALERT_CHAT_ID: ${{ secrets.ASTRA_ALERT_CHAT_ID }}
      ASTRA_ALERT_COPY_CHAT_ID: ${{ secrets.ASTRA_ALERT_COPY_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/alert
            bot/alert.mjs
            bot/heartbeat.mjs
            bot/lib/alert-verdict.mjs
            bot/lib/alert-checks.mjs
            tools/lib/ids.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The verdict the recheck job composed
        env:
          VERDICT: ${{ needs.recheck.outputs.verdict }}
        run: printf '%s\n' "$VERDICT" > verdict.json
      - uses: ./.github/actions/alert
        with:
          verdict: verdict.json
          no-heartbeat-because: >-
            The publisher re-check has no receiver check of its own: it is not
            on BOT-85's list, and a missed run only delays a withdrawal to the
            next day's run. A failed run is also the job's own red X.
