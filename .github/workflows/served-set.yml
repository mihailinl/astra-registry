# Is what we serve what we signed, is what we signed what `main` says, and how
# long has the document under all of it got left?
#
# Four checks and one alarm (registry plan RC-R1-4, RC-R1-5, RC-R1-6, RC-R2-3).
# They are one workflow because they are one receiver check: `bot/lib/alert-checks.mjs`
# gives `served-set` a single BOT-85 heartbeat, since two checks would page
# twice for one silence and would need a second poster that does not exist.
#
#   main-vs-signed    SERVE-85. The withdrawal list `main` implies, against the
#                     one `signed` publishes. Nothing else in this estate ever
#                     compares those two: SERVE-39 compares Pages with `signed`
#                     and would find a dropped advisory perfectly consistent.
#
#   served-vs-signed  SERVE-39's Pages half, D5's arming latch, and SERVE-90's
#                     provenance fallback — every `signed` commit younger than
#                     7 days, and always the head, shown to have been pushed by
#                     a run of sign.yml that holds its receipt.
#
#   host-vs-signed    SERVE-39's catalogue-host half, from the day
#                     `registry.minice.ai` first answers (RC-R2-3 commit (i)):
#                     all four documents against `signed`'s head, with no latch
#                     and with TRUST-38's expired list as one it must NOT serve;
#                     and SERVE-52's and INV-40's named-path probes, sent to
#                     that host through the CDN and to nothing else (attack
#                     M-12). It holds no token at all.
#
#   trust-runway      ROLL-45. How many days `registry/v1/trust.json` has left,
#                     on main's copy and on the one `signed` publishes, and the
#                     same question for any index key carrying a `not_after`.
#                     It is here rather than in CI because it is the one row of
#                     RC-R1-6 that is a property of the CALENDAR rather than of
#                     a commit: the repository can sit untouched for a month
#                     while the runway runs out, and renewal is a hand-run root
#                     ceremony with a dress rehearsal in front of it.
#
#   alert             The one page, and the one heartbeat.
#
# **The comparisons run no author code and hold no alarm credential**, which is
# SERVE-39's own wording and the reason the alert job is separate. `main-vs-
# signed` builds the withdrawal list from `tools/revocations/**` and touches
# `plugins/**` nowhere; `served-vs-signed` compares bytes. Neither job can
# reach the channel, and the job that can reach the channel reads only what
# they reported.
#
# **Every rule lives in `tools/served-set/`, not here.** These steps read the
# world and run a module; the modules decide. That is not tidiness — each of
# these rules decides whether a person is woken at three in the morning, the
# canaries RC-R1-4 and RC-R1-5 ask for are "a hand-pushed commit fails", "a
# Pages copy held back 31 minutes fails", "a signed list before the flag
# fails", and none of those can be watched failing if the rule only exists
# inside a scheduled job on GitHub.
#
# Until the owner performs §2.12's R1 act — environment `alerts`, its secrets,
# the receiver account — the `alert` job below sends nothing, and since
# 2026-09-19 it says so in a notice and stays GREEN. At four runs an hour, the
# red it used to go was ninety-six a day about a state that has a named owner
# act in front of it, which is not information: it is the training that makes
# the next real alarm invisible. What must not happen — an estate with no alarm
# channel looking like an estate with nothing to report — is held by
# `alarm-drill.yml`, which asserts the channel exists and is red once a week
# until it does. A channel that exists and is BROKEN is still red here, on
# every run, naming the secret (RC-R1-0).

name: Served set

on:
  schedule:
    # Every 15 minutes, which is SERVE-39's and SERVE-85's floor. Off the
    # quarter-hour for the reason `alarm-drill.yml` gives: a job that shares
    # its minute with every other cron on the runner fleet is a job that waits,
    # and a 30-minute window has no use for a tidy minute.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: served-set
  # Never cancel. A cancelled run posts no heartbeat and sends no alarm — the
  # alert job's `if:` excludes cancellation deliberately — so cancelling the
  # older of two overlapping runs would silently drop the comparison that had
  # already found something.
  cancel-in-progress: false

jobs:
  main-vs-signed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      status: ${{ steps.check.outputs.status }}
      codes: ${{ steps.check.outputs.codes }}
      hexes: ${{ steps.check.outputs.hexes }}
    steps:
      # The whole history, because D3's serial is `rev-list --count` over
      # `tools/revocations` and a shallow clone counts what it was given.
      #
      # `persist-credentials: false` is SERVE-39's "holds no secret" taken at
      # its word. This repository is public, so the fetch of `signed` below
      # needs no token, and a job that keeps one in `.git/config` for the
      # length of its run is a job whose compromise is worth something.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: SERVE-85 — the list main implies, against the list `signed` serves
        id: check
        run: node tools/served-set/check.mjs --job main-vs-signed

      # Two steps, and the split is not style. A step that writes
      # `$GITHUB_OUTPUT` and then exits non-zero is a step whose outputs the
      # alert job may or may not be handed, and the alert job is the only
      # reason this run exists. So the comparison always exits 0 and this step
      # decides the colour — which also makes an empty status (the checker
      # crashed before it could write one) red rather than green.
      - name: A red comparison is a red run
        if: steps.check.outputs.status != 'green'
        run: |
          echo "::error::main-vs-signed reported ${{ steps.check.outputs.status || 'nothing at all' }}"
          exit 1

  served-vs-signed:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # SERVE-90's fallback reads runs and their artifacts of this repository.
      # It is the only reason this job differs from the one above.
      actions: read
    timeout-minutes: 15
    outputs:
      status: ${{ steps.check.outputs.status }}
      codes: ${{ steps.check.outputs.codes }}
      hexes: ${{ steps.check.outputs.hexes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The token is handed to this one step, for the Actions API and nothing
      # else: `persist-credentials: false` above keeps it out of git's config,
      # so a `git fetch` here cannot quietly become an authenticated one.
      - name: SERVE-39 and SERVE-90 — what Pages serves, and who pushed `signed`
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/served-set/check.mjs --job served-vs-signed

      - name: A red comparison is a red run
        if: steps.check.outputs.status != 'green'
        run: |
          echo "::error::served-vs-signed reported ${{ steps.check.outputs.status || 'nothing at all' }}"
          exit 1

  host-vs-signed:
    runs-on: ubuntu-24.04
    # No token of any kind: the host and `signed` are both public, and this job
    # needs neither the Actions API nor a write. SERVE-39's "holds no secret".
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      status: ${{ steps.check.outputs.status }}
      codes: ${{ steps.check.outputs.codes }}
      hexes: ${{ steps.check.outputs.hexes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: SERVE-39, SERVE-52 and INV-40 — what the catalogue host serves
        id: check
        run: node tools/served-set/check.mjs --job host-vs-signed

      - name: A red comparison is a red run
        if: steps.check.outputs.status != 'green'
        run: |
          echo "::error::host-vs-signed reported ${{ steps.check.outputs.status || 'nothing at all' }}"
          exit 1

  trust-runway:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      status: ${{ steps.check.outputs.status }}
      codes: ${{ steps.check.outputs.codes }}
      hexes: ${{ steps.check.outputs.hexes }}
    steps:
      # The same depth as its two siblings. This job counts no commits — it
      # reads one file out of the checkout and one blob out of `signed` — but a
      # third answer to "how much history" in one workflow is a third thing to
      # reason about at three in the morning, and the fetch of `signed` below
      # must not be where a shallow clone is first discovered.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ROLL-45 — how long trust.json has left, on main and on `signed`
        id: check
        run: node tools/served-set/check.mjs --job trust-runway

      - name: A red comparison is a red run
        if: steps.check.outputs.status != 'green'
        run: |
          echo "::error::trust-runway reported ${{ steps.check.outputs.status || 'nothing at all' }}"
          exit 1

  alert:
    needs: [main-vs-signed, served-vs-signed, host-vs-signed, trust-runway]
    # `always()` so a red comparison still pages — the jobs above fail on
    # purpose — and `!cancelled()` so a cancelled run does not send an alarm
    # about a comparison that never finished.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    environment: alerts
    permissions:
      contents: read
    timeout-minutes: 5
    # An environment secret is not ambient: a job reads one only where it says
    # so. The three channel secrets, and the whole ping URL of the one check
    # this job posts to. Nothing else — a job that mapped another check's URL
    # would be a job whose compromise silences a check it never posts to
    # (attack M-5), and `bot/tests/workflows.test.mjs` refuses one.
    env:
      ASTRA_ALERT_TELEGRAM_TOKEN: ${{ secrets.ASTRA_ALERT_TELEGRAM_TOKEN }}
      ASTRA_ALERT_CHAT_ID: ${{ secrets.ASTRA_ALERT_CHAT_ID }}
      ASTRA_ALERT_COPY_CHAT_ID: ${{ secrets.ASTRA_ALERT_COPY_CHAT_ID }}
      ASTRA_DEADMAN_URL_SERVED_SET: ${{ secrets.ASTRA_DEADMAN_URL_SERVED_SET }}
    steps:
      # Only what this job runs, at this commit. A job holding the alarm
      # channel's credential reads no author code and checks out no more of
      # this repository than the scripts it executes (BOT-46).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/alert
            bot/alert.mjs
            bot/heartbeat.mjs
            bot/lib/alert-verdict.mjs
            bot/lib/alert-checks.mjs
            tools/lib/ids.mjs
            tools/served-set/compose.mjs
          sparse-checkout-cone-mode: false

      # `ASTRA_SERVED_SET_JOBS` names the comparisons this alarm speaks for, so
      # a job deleted from this workflow and forgotten here pages rather than
      # going quiet: `compose.mjs` reports a named job with no variables as one
      # that did not report, which is red.
      - name: The verdict, from what the two comparisons reported
        env:
          ASTRA_SERVED_SET_JOBS: main-vs-signed served-vs-signed host-vs-signed trust-runway
          MAIN_VS_SIGNED_RESULT: ${{ needs.main-vs-signed.result }}
          MAIN_VS_SIGNED_STATUS: ${{ needs.main-vs-signed.outputs.status }}
          MAIN_VS_SIGNED_CODES: ${{ needs.main-vs-signed.outputs.codes }}
          MAIN_VS_SIGNED_HEXES: ${{ needs.main-vs-signed.outputs.hexes }}
          SERVED_VS_SIGNED_RESULT: ${{ needs.served-vs-signed.result }}
          SERVED_VS_SIGNED_STATUS: ${{ needs.served-vs-signed.outputs.status }}
          SERVED_VS_SIGNED_CODES: ${{ needs.served-vs-signed.outputs.codes }}
          SERVED_VS_SIGNED_HEXES: ${{ needs.served-vs-signed.outputs.hexes }}
          HOST_VS_SIGNED_RESULT: ${{ needs.host-vs-signed.result }}
          HOST_VS_SIGNED_STATUS: ${{ needs.host-vs-signed.outputs.status }}
          HOST_VS_SIGNED_CODES: ${{ needs.host-vs-signed.outputs.codes }}
          HOST_VS_SIGNED_HEXES: ${{ needs.host-vs-signed.outputs.hexes }}
          TRUST_RUNWAY_RESULT: ${{ needs.trust-runway.result }}
          TRUST_RUNWAY_STATUS: ${{ needs.trust-runway.outputs.status }}
          TRUST_RUNWAY_CODES: ${{ needs.trust-runway.outputs.codes }}
          TRUST_RUNWAY_HEXES: ${{ needs.trust-runway.outputs.hexes }}
        run: node tools/served-set/compose.mjs --out verdict.json --check served-set

      - uses: ./.github/actions/alert
        with:
          verdict: verdict.json
          check: served-set
