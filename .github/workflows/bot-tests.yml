# The bot's own tests, on the path that reaches `main`.
#
# `ingest.yml` runs `bot/tests/ingest.test.mjs` and `bot/tests/policy.test.mjs`
# before every ingest, and that placement is right: a bot that cannot pass its
# own tests should decide nothing about a stranger's release. But `ingest.yml`
# is event-driven — issues, dispatch, cron — and never fires on a push or a pull
# request, so until this file existed a change to the checks or to the policy
# could reach `main` with neither suite having run. One did: the commit that
# taught the bot to close a published issue changed `bot/lib/policy.mjs` and
# went green without `policy.test.mjs` executing once.
#
# `build-index.yml` already runs the cheap suites for the same reason. These two
# are not there because they need the manifest probe — a Rust binary built from
# the crate the daemon itself parses manifests with — and a Rust build does not
# belong in the job that regenerates the index.
#
# **No path filter, deliberately.** These suites assert agreement between code
# and prose in several directories at once: `policy.test.mjs` checks that
# `docs/POLICY.md` quotes the numbers `bot/lib/policy.mjs` enforces, and
# `ingest.test.mjs` checks that `docs/BOT-CHECKS.md` describes exactly the codes
# that exist. A path filter that forgets one of those turns this workflow into a
# check that is green because it did not run — which is the failure it is here
# to prevent, one level up.
name: Bot tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The same two steps `ingest.yml` runs, in the same order, for the same
      # reason: the probe parses `plugin.toml` with the daemon's own crate, so
      # the tests are asserting the daemon's rules rather than a re-reading of
      # them.
      # The pin is read OUT OF `ingest.yml` rather than repeated here. It is one
      # decision — which commit of AstraPlugins states the manifest rules this
      # bot enforces — and a second copy of it is a copy that goes stale without
      # anything going red. `build-index.yml` reads it the same way and for the
      # same reason; `link-deps.sh` refuses to clone without it, which is how
      # this workflow found out.
      - name: The AstraPlugins pin ingest.yml judges manifests by
        id: pin
        run: |
          set -euo pipefail
          ref=$(grep -oP '^\s*ASTRA_PLUGINS_REF:\s*\K[0-9a-f]+' .github/workflows/ingest.yml || true)
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ASTRA_PLUGINS_REF is not a 40-hex commit in .github/workflows/ingest.yml: '$ref'"
            exit 1
          fi
          url=$(grep -oP '^\s*ASTRA_PLUGINS_URL:\s*\K\S+' .github/workflows/ingest.yml || true)
          if [ -z "$url" ]; then
            echo "::error::ASTRA_PLUGINS_URL is not in .github/workflows/ingest.yml"
            exit 1
          fi
          echo "ASTRA_PLUGINS_REF=$ref" >> "$GITHUB_ENV"
          echo "ASTRA_PLUGINS_URL=$url" >> "$GITHUB_ENV"
          echo "ok    judging manifests by $ref from $url"

      - name: Fetch the manifest crate the daemon uses
        run: |
          set -euo pipefail
          bot/manifest-probe/link-deps.sh --clone

      - name: Cache the probe build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bot/manifest-probe/target
          key: probe-${{ runner.os }}-${{ hashFiles('bot/manifest-probe/Cargo.toml', 'bot/manifest-probe/src/**') }}
          restore-keys: probe-${{ runner.os }}-

      - name: Build the manifest probe
        run: cargo build --release --manifest-path bot/manifest-probe/Cargo.toml

      - name: The probe's own tests — the daemon's manifest rules, asserted
        run: cargo test --manifest-path bot/manifest-probe/Cargo.toml

      # A run that reported PASS because the probe was missing would be the
      # worst possible outcome here: `E_PROBE_UNAVAILABLE` is a finding, and a
      # suite that treated it as one more expected refusal would go green over
      # a binary that was never built. The tests fail loudly on it — this step
      # says so out loud anyway, so the reason is in the log and not only in a
      # test name.
      - name: The probe is actually there
        run: |
          set -euo pipefail
          test -x bot/manifest-probe/target/release/astra-manifest-probe
          bot/manifest-probe/target/release/astra-manifest-probe --version || true

      - name: The bot's tests, including every shared bundle vector
        run: node bot/tests/ingest.test.mjs

      - name: The publication policy's tests, including its published numbers
        run: node bot/tests/policy.test.mjs

      # What the workflow files may and may not say: which job can reach the
      # signing key, whether a shell re-derives the plugin-id predicate, whether
      # a dispatch can name a submitter. Properties of the YAML, so no other
      # suite can hold them (registry plan B-T0.3, B-T0.5, B-T0.6).
      - name: The workflow files' own tests
        run: node --test bot/tests/workflows.test.mjs

      # Two clones and a bare remote: what `bot/publish-apply.mjs` does when two
      # publications reach `main` at once. It needs no probe and no second
      # checkout, only git (registry plan B-T0.3).
      - name: The publish path, under contention
        run: node --test bot/tests/publish-apply.test.mjs

      # These four ran nowhere on the path to `main` until now. Each is cheap,
      # each asserts agreement between code and something a human reads, and
      # each was already written: `presentation.test.mjs` holds the card's text
      # and its assets, `asset-check.test.mjs` the icon and README lifted out of
      # an attested bundle, `moderation.mjs --check` the moderation records
      # against their schema, and `gen-checks-doc.mjs --check` that
      # `docs/BOT-CHECKS.md` still describes the checks that exist. That last
      # one ran only at `ingest.yml:591` — which is to say only when a stranger
      # published something, so the documentation of what the bot refuses could
      # sit stale on `main` for as long as nobody submitted a release.
      - name: The presentation the card is built from
        run: node bot/tests/presentation.test.mjs

      - name: The icon and README lifted out of the bundle
        run: node bot/tests/asset-check.test.mjs

      # The steps below this line are added by the batch's coordinator, not by
      # the lanes that wrote the suites, and the reason is a rule the lane
      # grouping cannot see. §2.0: "a new registry test file is a check only
      # once a workflow names it, so every one below is added to
      # bot-tests.yml." That governs forty-seven tasks and is written into the
      # `Repo/files` line of two, so the grouping — which unions over those
      # lines — computed several of those tasks as sharing no file with anybody
      # when they all share this one. Each lane refused to edit a workflow
      # outside its own, correctly, and that is the only reason nine concurrent
      # agents did not collide here.
      #
      # It collided anyway, once, and by the coordinator's hand: these two
      # steps were added on two branches at the same anchor, minutes apart,
      # which is exactly what the lanes were told not to do. The rule was right
      # and the person who wrote it did not follow it. Anything added here
      # afterwards goes in ONE commit, after the lanes that own the suites have
      # finished.
      - name: The holds, and the four ways one of them ends
        run: node bot/tests/holds.test.mjs

      # MIG-21's historic export, and the one suite here that cannot be re-run
      # later: it renders the four decisions with `bot/ingest.mjs` and
      # `bot/lib/policy/comment.mjs` and reads them back, so a reworded heading
      # in either goes red here rather than in the single baseline dispatch.
      # After ROLL-42 switches Issues off there is no archive left to compare
      # against (registry plan M-T3.8).
      - name: The historic export, against the comments the bot actually posts
        run: node bot/tests/export-issues.test.mjs

      # RC-R1-0. The alarm channel and the dead-man heartbeat, against a
      # loopback stub. Half of it asks that a working channel works; the half
      # that matters asks what happens when a secret is missing, the Bot API
      # answers non-2xx or `ok: false`, or a 2xx carries no `result.date` —
      # every one of those has to be a non-zero exit with no `delivered_at`,
      # because an alarm that could not be sent looks exactly like nothing
      # having gone wrong.
      - name: The alarm channel, and every way it can fail to be one
        run: node bot/tests/alert.test.mjs

      # B-T1.5 (BOT-7). The root keys are compiled into bot/lib/roots.mjs and a
      # trust.json is verified against those and nothing else. This asks
      # whether that is still true: that no flag, argument or tree reaches past
      # the compiled set, and that a trust.json signed by any other key is
      # refused even when root.json is edited to publish that key.
      - name: The compiled root keys, and the only set they can be
        run: node --test bot/tests/roots.test.mjs

      - name: The moderation records, against their own schema
        run: node bot/moderation.mjs --check

      - name: docs/BOT-CHECKS.md still describes the checks that exist
        run: node bot/gen-checks-doc.mjs --check
