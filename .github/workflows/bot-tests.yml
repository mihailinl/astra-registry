# The bot's own tests, on the path that reaches `main`.
#
# `ingest.yml` runs `bot/tests/ingest.test.mjs` and `bot/tests/policy.test.mjs`
# before every ingest, and that placement is right: a bot that cannot pass its
# own tests should decide nothing about a stranger's release. But `ingest.yml`
# is event-driven — issues, dispatch, cron — and never fires on a push or a pull
# request, so until this file existed a change to the checks or to the policy
# could reach `main` with neither suite having run. One did: the commit that
# taught the bot to close a published issue changed `bot/lib/policy.mjs` and
# went green without `policy.test.mjs` executing once.
#
# `build-index.yml` already runs the cheap suites for the same reason. These two
# are not there because they need the manifest probe — a Rust binary built from
# the crate the daemon itself parses manifests with — and a Rust build does not
# belong in the job that regenerates the index.
#
# **No path filter, deliberately.** These suites assert agreement between code
# and prose in several directories at once: `policy.test.mjs` checks that
# `docs/POLICY.md` quotes the numbers `bot/lib/policy.mjs` enforces, and
# `ingest.test.mjs` checks that `docs/BOT-CHECKS.md` describes exactly the codes
# that exist. A path filter that forgets one of those turns this workflow into a
# check that is green because it did not run — which is the failure it is here
# to prevent, one level up.
name: Bot tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The same two steps `ingest.yml` runs, in the same order, for the same
      # reason: the probe parses `plugin.toml` with the daemon's own crate, so
      # the tests are asserting the daemon's rules rather than a re-reading of
      # them.
      # The pin is read OUT OF `ingest.yml` rather than repeated here. It is one
      # decision — which commit of AstraPlugins states the manifest rules this
      # bot enforces — and a second copy of it is a copy that goes stale without
      # anything going red. `build-index.yml` reads it the same way and for the
      # same reason; `link-deps.sh` refuses to clone without it, which is how
      # this workflow found out.
      # B-T1.4 moved the pin out of `ingest.yml` and into a file of its own,
      # because `ingest.yml` is deleted at R6 and three workflows read the pin
      # out of it. This step read it with a grep over that workflow; after the
      # move the grep matches nothing, which is why it is replaced rather than
      # repointed — a grep that can match nothing is the shape this repository
      # has spent two days removing.
      - name: The AstraPlugins pin this bot judges manifests by
        id: pin
        run: |
          set -euo pipefail
          pin=bot/manifest-probe/astra-plugins.pin
          if [ ! -f "$pin" ]; then
            echo "::error::$pin is missing. It is the only place ASTRA_PLUGINS_REF is written (B-T1.4)."
            exit 1
          fi
          ref=$(grep -oP '^ASTRA_PLUGINS_REF=\K[0-9a-f]+' "$pin" || true)
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ASTRA_PLUGINS_REF is not a 40-hex commit in $pin: '$ref'"
            exit 1
          fi
          url=$(grep -oP '^ASTRA_PLUGINS_URL=\K\S+' "$pin" || true)
          if [ -z "$url" ]; then
            echo "::error::ASTRA_PLUGINS_URL is not in $pin"
            exit 1
          fi
          echo "ASTRA_PLUGINS_REF=$ref" >> "$GITHUB_ENV"
          echo "ASTRA_PLUGINS_URL=$url" >> "$GITHUB_ENV"
          echo "ok    judging manifests by $ref from $url"

      - name: Fetch the manifest crate the daemon uses
        run: |
          set -euo pipefail
          bot/manifest-probe/link-deps.sh --clone

      - name: Cache the probe build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bot/manifest-probe/target
          key: probe-${{ runner.os }}-${{ hashFiles('bot/manifest-probe/Cargo.toml', 'bot/manifest-probe/src/**') }}
          restore-keys: probe-${{ runner.os }}-

      - name: Build the manifest probe
        run: cargo build --release --manifest-path bot/manifest-probe/Cargo.toml

      - name: The probe's own tests — the daemon's manifest rules, asserted
        run: cargo test --manifest-path bot/manifest-probe/Cargo.toml

      # A run that reported PASS because the probe was missing would be the
      # worst possible outcome here: `E_PROBE_UNAVAILABLE` is a finding, and a
      # suite that treated it as one more expected refusal would go green over
      # a binary that was never built. The tests fail loudly on it — this step
      # says so out loud anyway, so the reason is in the log and not only in a
      # test name.
      - name: The probe is actually there
        id: probe
        run: |
          set -euo pipefail
          test -x bot/manifest-probe/target/release/astra-manifest-probe
          bot/manifest-probe/target/release/astra-manifest-probe --version || true

      - name: The bot's tests, including every shared bundle vector
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/tests/ingest.test.mjs

      - name: The publication policy's tests, including its published numbers
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/tests/policy.test.mjs

      # What the workflow files may and may not say: which job can reach the
      # signing key, whether a shell re-derives the plugin-id predicate, whether
      # a dispatch can name a submitter. Properties of the YAML, so no other
      # suite can hold them (registry plan B-T0.3, B-T0.5, B-T0.6).
      - name: The workflow files' own tests
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/workflows.test.mjs

      # B-T3.2 / B-T3.3a. Which repository published these bytes: the
      # certificate's .12/.15/.17 against MIG-20's baseline, a rename, a
      # transfer, a re-creation, and a freed login somebody else registered.
      # Pure, no probe, ~50 ms.
      - name: The identity comparison, one fixture per outcome
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/identity.test.mjs

      # Two clones and a bare remote: what `bot/publish-apply.mjs` does when two
      # publications reach `main` at once. It needs no probe and no second
      # checkout, only git (registry plan B-T0.3).
      - name: The publish path, under contention
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/publish-apply.test.mjs

      # These four ran nowhere on the path to `main` until now. Each is cheap,
      # each asserts agreement between code and something a human reads, and
      # each was already written: `presentation.test.mjs` holds the card's text
      # and its assets, `asset-check.test.mjs` the icon and README lifted out of
      # an attested bundle, `moderation.mjs --check` the moderation records
      # against their schema, and `gen-checks-doc.mjs --check` that
      # `docs/BOT-CHECKS.md` still describes the checks that exist. That last
      # one ran only at `ingest.yml:591` — which is to say only when a stranger
      # published something, so the documentation of what the bot refuses could
      # sit stale on `main` for as long as nobody submitted a release.
      - name: The presentation the card is built from
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/tests/presentation.test.mjs

      - name: The icon and README lifted out of the bundle
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/tests/asset-check.test.mjs

      # The steps below this line are added by the batch's coordinator, not by
      # the lanes that wrote the suites, and the reason is a rule the lane
      # grouping cannot see. §2.0: "a new registry test file is a check only
      # once a workflow names it, so every one below is added to
      # bot-tests.yml." That governs forty-seven tasks and is written into the
      # `Repo/files` line of two, so the grouping — which unions over those
      # lines — computed several of those tasks as sharing no file with anybody
      # when they all share this one. Each lane refused to edit a workflow
      # outside its own, correctly, and that is the only reason nine concurrent
      # agents did not collide here.
      #
      # It collided anyway, once, and by the coordinator's hand: these two
      # steps were added on two branches at the same anchor, minutes apart,
      # which is exactly what the lanes were told not to do. The rule was right
      # and the person who wrote it did not follow it. Anything added here
      # afterwards goes in ONE commit, after the lanes that own the suites have
      # finished.
      - name: The holds, and the four ways one of them ends
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/tests/holds.test.mjs

      # MIG-21's historic export, and the one suite here that cannot be re-run
      # later: it renders the four decisions with `bot/ingest.mjs` and
      # `bot/lib/policy/comment.mjs` and reads them back, so a reworded heading
      # in either goes red here rather than in the single baseline dispatch.
      # After ROLL-42 switches Issues off there is no archive left to compare
      # against (registry plan M-T3.8).
      - name: The historic export, against the comments the bot actually posts
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/tests/export-issues.test.mjs

      # RC-R1-0. The alarm channel and the dead-man heartbeat, against a
      # loopback stub. Half of it asks that a working channel works; the half
      # that matters asks what happens when a secret is missing, the Bot API
      # answers non-2xx or `ok: false`, or a 2xx carries no `result.date` —
      # every one of those has to be a non-zero exit with no `delivered_at`,
      # because an alarm that could not be sent looks exactly like nothing
      # having gone wrong.
      - name: The alarm channel, and every way it can fail to be one
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/tests/alert.test.mjs

      # B-T1.5 (BOT-7). The root keys are compiled into bot/lib/roots.mjs and a
      # trust.json is verified against those and nothing else. This asks
      # whether that is still true: that no flag, argument or tree reaches past
      # the compiled set, and that a trust.json signed by any other key is
      # refused even when root.json is edited to publish that key.
      - name: The compiled root keys, and the only set they can be
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/roots.test.mjs
      # M-T1.5. The coverage canary's own canaries: real git fixture
      # repositories, because both rules read HISTORY and a fixture that
      # stubbed git would be a fixture that tested the stub. ~1s, no probe.
      - name: The coverage canary, against repositories it has to judge
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/moderation-coverage.test.mjs

      # M-T1.6. The moderation log's schema and MOD-41's shared reason corpus.
      # Pure, no probe, no network, ~60 ms. Every rule in it is about an entry
      # that does not exist yet — the second same-day delist, the unrevoke that
      # settles a revoke, the reason at 299 code points and 303 UTF-16 units —
      # and by the time one is written by hand at the moment of a takedown the
      # rule has to already be right.
      - name: The moderation schema, and the reason corpus both validators read
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/moderation.test.mjs

      # B-T3.7b. The once-only migration baseline. These two steps are late
      # because they are a repair: both suites landed in `b248a34` and **were
      # run by nothing for a day** — 46 tests, green on a laptop, absent from
      # every workflow. Nothing globs in this repository; every suite is named
      # here or in `ingest.yml` by hand, and these two are the ones the
      # coordinator missed while adding eleven others in the same batch.
      #
      # §2.0 is the rule they fell through: *a new registry test file is a
      # check only once a workflow names it.* It is stated once, in the
      # `Repo/files` line of two tasks out of forty-seven, and a derivation
      # over per-item fields cannot see a rule that quantifies over items — so
      # the omission was invisible to the lane, to the plan and to CI at the
      # same time. What found it was somebody listing every test file's name
      # and subtracting the ones a workflow runs.
      #
      # What the baseline suite holds that nothing else does: the marker's
      # shape; the refusal ORDER — a second dispatch must refuse before the
      # absent-writer refusal, or the day B-T2.2 lands a second migration
      # record is written for every version; PRIV-2's name-free record; and
      # SCOPE-5's refusal of a certificate id that arrives as a JSON number,
      # because 9007199254740993 rounds to …92 and names a repository that
      # never published the bytes.
      - name: The migration baseline, and the one dispatch that writes it
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/baseline.test.mjs

      # B-T3.8. Detector A, the reconciliation that reads only public git.
      #
      # One test in here outranks the rest and is why this step is not
      # optional: *the skip is derived from the marker, not written down*.
      # Four of the five detectors skip until `log/baseline.json` exists, and
      # that test is the only thing in the repository that can tell a DERIVED
      # skip from a hard-coded one. Without it, `if (true)` ships and all five
      # detectors are permanently off while every run reports green — the
      # exact shape RC-R1-0 calls the repair this estate must never reach for.
      #
      # The shipped detector is not untested by the world: A7 fired in
      # production on 2026-09-20, run 35502265394, and the finding was real
      # enough to be worth a fix. But a rule watched red by an incident is not
      # the same as its unit tests running, and the four A7 cases here include
      # both bounds and the no-trailer case, which no incident has exercised.
      - name: Detector A, and the skips that have to be derived
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/detectors.test.mjs

      # B-T2.6. The releases feed after it got a module of its own: `pollFeed`
      # and `parseReleasesAtom` moved out of `bot/watch.mjs` and
      # `bot/lib/notify.mjs` into `bot/lib/poll.mjs`. Half the file is the guard
      # on that cut — the three export surfaces pinned BY NAME, the sixteen
      # pre-cut names pinned as a list that is deliberately NOT derived from
      # those three, one definition of each moved function in the whole tree,
      # and every module under `bot/lib/` imported by something other than
      # itself. The independent list is the one that matters: the other three
      # cannot see a name moved out of one module with both pins updated in
      # step and never exported at the far end, which is the break that was
      # watched. Pure, no probe, no network, ~65 ms.
      - name: The feed poll, and the surfaces the split had to keep
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/poll.test.mjs

      # B-T2.5. The service client and the bot OIDC token, against a server on
      # 127.0.0.1. A socket and not a recording `fetch`, because three of the
      # rules are properties of HTTP and no stub holds any of them:
      # `redirect: "manual"` is honoured by the runtime, `Retry-After` is a
      # header, and "the mask precedes first use" is an ORDER between a log
      # line and bytes leaving the process, which only a journal both ends
      # append to can compare.
      #
      # The two distinctions it holds that a reading of §4.2 alone would lose.
      # An item-level `stop_status` `unavailable` is contract DEC-11's wait for
      # ONE submission (0.13.0, n13); treated as the call-level one, a single
      # unresolved row costs the whole batched call, and silently, because the
      # call is green either way and the batch merely gets smaller. And an
      # `unavailable` carrying `Retry-After` is a stated wait, so the first in
      # a run is silent and the second is not (attack m-1) — which is what
      # stops B-T3.6's W0 drill producing a bot-side alert and no shadow page
      # on its first run after reg.80a, and a walk then recording a failure of
      # something it is not testing.
      #
      # It also compares the compiled operations, audience and every body's
      # members against `schema/contract-tokens-v1.json`, each with a floor
      # asserted first. Pure, no probe, no network beyond loopback, ~135 ms.
      - name: The service client, the bot token, and the mask that precedes it
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/service.test.mjs

      # Immediately after the step above, because it is that step's other half.
      # `service.test.mjs` imports `splitTable` and `markerProblems` out of the
      # cutover preflight, to prove that the condition contract 0.30.1 publishes
      # on `astra.registry.migration-notice/1` is one something in this
      # repository actually runs. That import is only affordable because of the
      # main guard at the bottom of that file — without it the import runs an
      # eleven-check gate, a live `gh` query and a walk of four repositories
      # before the first assertion, and the step above goes from 134 ms to
      # 710 ms with 201 lines of cutover gate in its transcript.
      #
      # NOTHING SAID SO UNTIL THIS LINE. dev/couplings.md entry 60: removing
      # that guard leaves the step above failing as `'test failed'` with no
      # assertion and no file to open, and passing outright the day the gate
      # goes green — with a network call inside a test whose name is about a
      # bot token. `--selftest` is what makes it loud: it imports this module
      # in a child whose `git` and `gh` are recording shims and asserts that
      # neither ran and that nothing was printed, with the same file run as a
      # program as the positive control. It also drives that tool's exported
      # readers over hand-built member tables — no count here, because this line
      # said ten while main exported eleven functions — including entry 58's —
      # a published `when` naming the integer `1` meeting a marker that spells
      # its round `"1"`. No network, no git of its own, ~150 ms.
      - name: The cutover preflight's readers, and the guard that keeps its gate out of a test
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node tools/cutover-preflight.mjs --selftest

      - name: The moderation records, against their own schema
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/moderation.mjs --check

      - name: docs/BOT-CHECKS.md still describes the checks that exist
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node bot/gen-checks-doc.mjs --check

      # FLOW-13's reason-code table is the published interface the panel reads,
      # and it is published inside SCOPE-7's token file in another repository —
      # so this is the only place a stale table is caught before it is merged
      # there. `--selftest` holds the floors: one full entry per code, the table
      # and its declared population equal in both directions, no panel-only code
      # in a table the bot emits from, no service-path remedy naming a channel
      # that path does not have (FLOW-15). `--check` holds the committed
      # intermediate against `bot/lib/codes.mjs` and `POLICY_CODES`.
      - name: FLOW-13's reason-code table, against the code tables it comes from
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: |
          node tools/gen-codes-table.mjs --selftest
          node tools/gen-codes-table.mjs --check tools/codes-table.json

      # B-T1.7 (BOT-78). The two risk tiers, against the crate that defines
      # them. `HIGH_RISK` and `CONSENT_HIGH_RISK` in bot/lib/policy/constants.mjs
      # decide what stops a release and asks a person; PRODUCTION_PLAN §5.5 and
      # §5.6 decide what they are, and the place that reading is written as
      # code is `TIER2_REFUSED_PERMISSIONS` and `HIGH_RISK_PERMISSIONS` in
      # AstraPlugins' vendored manifest crate. Until this suite the two agreed
      # by hand, and a disagreement is silent in BOTH directions: a release
      # auto-published for an authority the daemon refuses an imported file
      # over, or one held for a person over an authority nobody upstream calls
      # high-risk. Each side's own tests could only prove it agreed with itself.
      #
      # It must run AFTER `Fetch the manifest crate the daemon uses`, which is
      # the step that puts a checkout on disk. It needs nothing else — not the
      # cargo build, not the probe binary — and it reads the crate out of git
      # at the pin's own commit rather than off that checkout's working tree,
      # so the answer is the same here and on a workstation whose sibling copy
      # is on some branch. That is deliberate: this repository has already
      # shipped a floor measured against build artifacts, and it went red in CI
      # on the commit that added it.
      #
      # With no checkout reachable it FAILS, naming every place it looked. A
      # cross-repository check that skips quietly is the failure the step above
      # this one exists to prevent, one level up.
      - name: The risk tiers, against the manifest crate at the pin
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/risk-tiers.test.mjs

      # M-T5.1. MIG-1's listing states, decided from git: fixtures either side
      # of the deadline and of `log/cutover.json`, one listing with a revoked
      # binding, one with no baseline, one whose `identity.json` a B-T4.2 reset
      # deleted, and a shallow checkout that cannot answer ID-25's "ever" and
      # refuses to instead of guessing. Real git repositories, because every
      # one of those is a statement about HISTORY and a fixture that stubbed
      # `git log` would be a fixture of the stub.
      #
      # It is also the only thing that reads `schema/deadline-v1.json` and
      # `schema/cutover-v1.json` through `tools/validate.mjs`, so without this
      # step the two new B.4 records are documents rather than checks — and
      # both are written by hand, one by the owner (MIG-2) and one by the
      # cutover commit (ROLL-33). ~0.3 s, no probe, no network.
      - name: MIG-1's listing states, against repositories and both new records
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/listing-state.test.mjs

      # M-T3.2. TRUST-26's takedown bound, counted out of git: real repositories
      # again, because every part of the rule is a comparison between a commit
      # and its parent — was this listing listed a commit ago, did this advisory
      # match this id before it matched it now, did this happen inside the
      # trailing 24 hours. The case that matters most is the one attack M-2
      # named: a hand advisory committed under `Moderation-Exempt:` and no
      # `Service-Decision:` must COUNT, because a counter that filtered on that
      # trailer returned 0 on the one day the registry was withdrawing by hand
      # and let a fourth withdrawal out unheld. ~0.4 s, no probe, no network.
      - name: The takedown bound, against repositories that withdrew something
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/takedown-bound.test.mjs

      # B-T2.2. The decision-record writer, the only thing in this repository
      # that derives BOT-35's `decision_id`. Four callers refuse by name
      # against its absence, so the test that matters most here is not a shape
      # test: it runs `bot/export-issues.mjs`'s `resolveWriter` against the
      # real module, and it compares all three spellings of BOT-35's
      # `migration:<owner/name>@<tag>` key this repository carries — one in
      # the writer, one in `bot/export-issues.mjs` over `fact.repository`, one
      # in `bot/baseline.mjs` over `fact.repo`. A drift between any two writes
      # one record where MIG-20 and MIG-21 owe two, and nothing else compares
      # them.
      #
      # It also holds the scan that says no SECOND derivation of a decision id
      # is on the tree, over `git ls-files` with a floor of 100 against 130
      # measured — a directory walk under `bot/` follows
      # `bot/manifest-probe/_deps/AstraPlugins` and would report findings in
      # another repository under this one's name. ~0.1 s, no probe, no network.
      - name: The decision record, and the one place its id is derived
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/decisions.test.mjs

      # M-T3.1. The decision compiler, against trees it has to judge. Real git
      # repositories again: MOD-13's next advisory id is "one more than the
      # highest ever ADDED", and the add-then-delete case exists precisely
      # because a tree reading hands the next advisory the id the deleted one
      # had. It also holds the one clause of M-T3.1's canary that is NOT about
      # the compiler's return value — BOT-34's count of author-action records
      # against the versions a commit yanks, which lives in `tools/validate.mjs`
      # and which the plan says a short-counted yank is otherwise caught by
      # nothing. ~0.3 s, no probe, no network.
      - name: The decision compiler, and the yank nothing else counts
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/compile-decision.test.mjs

      # B-T2.4. The binding line, against thirty-one files a stranger could
      # commit. `tests/binding-line/vectors.json` is registry-CANONICAL:
      # AstraPlugins mirrors it byte for byte (AP-6, rule C31) and the plugins
      # service pins it, so this step is the only place the corpus and the
      # parser that answers it are ever compared. It regenerates the corpus
      # with `--check` before it reads a case, which is what turns a hand edit
      # here — an edit to two other repositories' fixtures — into a named
      # failure rather than a suite that passes about the wrong bytes.
      #
      # The case that outranks the rest is vector 15: 1400 three-byte
      # characters and then a binding line at byte 4201 and UTF-16 unit 1401.
      # A reader that slices 4096 UTF-16 units — which `bot/lib/ownership.mjs`
      # does today for logins — binds the repository off a line ID-23 puts
      # outside the window, and passes every other case in the file.
      # No probe, no network, ~90 ms.
      - name: The binding line, and the window that is measured in bytes
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/binding.test.mjs

      # B-T3.10. TRUST-31's hashed code paths, and the one thing a path list
      # cannot say about itself: whether the code the two bot workflows
      # actually reach is inside it. It walks out from each workflow file
      # through every `node` entry point, every `uses: ./…` composite action
      # and the entry points inside it, the static import closure of all of
      # them and every node script those modules spawn — and fails on a target
      # the published set does not name. It found one on its first run:
      # `bot/publish-apply.mjs` runs `node tools/selftest.mjs` as the last of
      # five gates before it commits, and the draft set had that file outside.
      # It also prints the set hash a TRUST-42 acknowledgement names, as a
      # value rather than a description of one. Pure, no probe, no network,
      # ~60 ms; it shells out to `git ls-tree` only.
      - name: TRUST-31's hashed set, and everything a bot run can reach
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/code-paths.test.mjs

      # M-T3.4. The moderation run, against the answers it has to judge. The
      # two clauses that matter most are not about its return values: an entry
      # carrying a member BOT-80 does not name is ACCEPTED, compiles normally
      # and reaches no committed file — watched failing both ways, by making
      # the schema reject it and by bypassing the write-side allowlist — and
      # the comparison with the token file's members is TWO-WAY, so a member
      # the contract adds at a token-moving version turns this red at the
      # moment it is added rather than turning every takedown into a silent
      # `kind_refused` in production. Real git repositories, because MOD-13's
      # next advisory id is a statement about history. ~0.3 s, no probe, no
      # network.
      - name: The moderation run, and the member that must reach no file
        if: ${{ !cancelled() && steps.probe.conclusion == 'success' }}
        run: node --test bot/tests/moderation-run.test.mjs
