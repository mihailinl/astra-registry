# MIG-20's migration baseline: the run that is meant to happen once, and the
# daily job that outlives it.
#
# What the dispatch is FOR: one `migration` record per non-staging published
# version, plus `log/baseline.json` — the marker four other mechanisms wait on
# (registry plan B-T3.7b) — in one commit (BOT-73). MIG-21's historic records
# follow in a commit of their own (below). `--write` refuses when the marker is
# already on the tree, and that refusal is what makes the main path run once in
# the life of the repository: the dispatch that commits the marker is the last
# one that writes anything.
#
# **The daily half is not the same job and does not end.** `names` asks GitHub,
# for every baseline `repository_id`, what that repository is called today, and
# alarms when the answer is not the `source.repo` the catalogue serves. It never
# re-baselines from a name (MIG-20). It is the registry's only defence against
# threat row 18 — clients key on names, so a freed `owner/name` somebody else
# registers is an update channel into every installation — and it runs every day
# from the moment this file lands, whether or not a baseline exists yet. Before
# there is one it says so and exits green, which is how the schedule proves it is
# alive for the weeks between this file landing and the dispatch.
#
# ── what a dispatch does, walked end to end ────────────────────────────────
#
# **This section used to list the stops a dispatch met**, measured on
# 2026-09-22: `verify` downloaded nothing (`--population` emitted no URL, and
# the job set no `GH_TOKEN` for `gh`); `--write` refused the commitless
# version (dice-roller 0.1.2) at the record grammar and wrote `null` ids that
# schema/decision-v1.json refuses; nothing wrote the marker; and no step
# committed. B-T3.7b walked the three modes end to end over a fixture registry
# (`bot/tests/baseline.test.mjs`, "--population → --verify → --write") and
# over four real versions of this catalogue, and removed each stop:
#
#   * `--population` names every asset's URL and digest; `--verify` downloads
#     each, holds its bytes to the recorded digest, and runs `gh attestation
#     verify` with this job's token (contents: read, and nothing else).
#   * a commitless version's record carries no `commit`, and an unverified
#     certificate's record carries no ids — absent, never null — and both are
#     named in the commit message.
#   * `--write` refuses a facts file that does not cover the population
#     exactly, writes one `migration` record per version and the marker, and
#     composes the commit message.
#   * `write` commits `log/` and nothing else, pushes, and reads the marker
#     back from `main`. A push that is refused — `main` moved under the run —
#     fails the job; the marker is not on `main`, so a re-dispatch recomputes
#     the baseline over the new tree rather than landing one computed over an
#     old one.
#
# **What the commit does NOT carry: MIG-21's historic records.** `export`
# still reads them, and `--write` counts them and names the count in the
# message. `bot/export-issues.mjs --compose` refuses the live archive,
# because BOT-35's `migration:<owner/name>@<tag>` keys are shared by more
# than one decision there — this registry refused and approved one tag two to
# eight times — and by a historic decision and this run's baseline record for
# the same tag. That domain separates versions, which is right for THIS
# workflow's own records and wrong for MIG-21's; widening it is an amendment to
# BOT-35 (ops.22, §1.3 row 6), after which the historic records land in a
# commit of their own. Nothing the marker gates waits on them.
#
# Why `verify` stays first and refuses rather than degrades: there is no second
# place OIDs .15 and .17 live — ID-28 forbids a predicate fallback and forbids a
# name lookup — and a run that wrote null ids because the tool could not look
# would record a registry-wide attestation failure that did not happen, in a
# file written once.

name: Migration baseline

on:
  # No inputs (BOT-4). The one thing a dispatch could usefully parameterise is
  # which commit to baseline, and that is `github.sha` — an input would be a
  # second answer to it.
  workflow_dispatch:
  schedule:
    # Daily, 04:17 UTC, for the `names` job alone. Not on the hour: a job that
    # shares its minute with every other cron on the runner fleet is a job that
    # waits, and BOT-85's bound is measured from completion.
    - cron: '17 4 * * *'

permissions: {}

concurrency:
  # Workflow-level, and never cancelling. Two baseline runs in flight would each
  # see no marker and each go on to write; the second losing its work to a
  # cancellation mid-commit is worse than the second waiting and then refusing —
  # which is what it will do once a run commits the marker. Until one does, the
  # second finds no marker either and repeats the first (header).
  group: migration-baseline
  cancel-in-progress: false

jobs:
  # ── the one-time half ────────────────────────────────────────────────────
  verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The population first, from git alone, before anything is downloaded.
      # It is the list the rest of the run is about, it costs nothing, and its
      # floors — no versions at all, or any version file this cannot read —
      # are the two failures that would otherwise be discovered as an empty
      # facts file three jobs later.
      - name: MIG-20's population, from the committed version files
        run: node bot/baseline.mjs --population --out population.json

      # For each version: downloads every asset, holds its bytes to the digest
      # the version file records, runs `gh attestation verify` and reads the
      # certificate ids. `gh` will not run without a token (gh 2.100.0 with
      # `GITHUB_ACTIONS=true` and none: exit 4), and this job's is
      # `contents: read` and nothing else. It NEVER unpacks an archive: a
      # baseline run must not be the thing that opens every stranger's archive
      # in the catalogue.
      - name: The certificate ids, from the verified certificate only
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bot/baseline.mjs --verify --population-file population.json --out facts.json

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-facts
          path: |
            population.json
            facts.json
          if-no-files-found: error

  export:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # MIG-21's historic export (M-T3.8). It is the only job in this workflow
      # that reads a stranger's bytes, which is why it is a job of its own with
      # no write permission anywhere near it: what leaves here is a fixed, tiny
      # grammar, and `write` can compose nothing this job did not emit. Today
      # it composes nothing from it at all: `--write` counts these facts and
      # reports them "pending", and `bot/export-issues.mjs --compose`, which
      # would turn them into records, refuses them (header).
      - name: The decisions that exist only on an issue thread
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bot/export-issues.mjs --facts --repo ${{ github.repository }} --out historic.json

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-historic
          path: historic.json
          if-no-files-found: error

  write:
    needs: [verify, export]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: baseline-*
          merge-multiple: true

      # INV-37: the writing job composes from facts it re-reads, never from a
      # job that parsed submitter bytes. The two artifacts above are that
      # grammar and nothing else. `composeRecords` in `bot/baseline.mjs` copies
      # named members out of each fact and nothing more, so a member nobody
      # listed never reaches a record — it is dropped, not refused (a facts
      # file with a `login` added went through `--write` with exit 0 and no
      # record carried it). `refuseUncomposable` is the refusal, and it is
      # asked of each composed record, not of the files.
      #
      # One record per version and the marker, into this runner's checkout;
      # the commit is the step after the checks. A run that leaves no marker on
      # the tree still ends on a refusal naming what it did not do.
      - name: One `migration` record per version, and the marker
        run: |
          node bot/baseline.mjs --write \
            --facts-file facts.json \
            --historic-file historic.json \
            --source-commit ${{ github.sha }} \
            --message-out baseline-commit.txt

      # BOT-71: regenerate both unsigned documents and pass the selftest before
      # committing. This step is reached only after a `--write` that left
      # `log/baseline.json` on the tree — the step above refuses otherwise —
      # and BOT-73's one commit, holding every record and the marker, is to
      # follow it (header).
      #
      # **`--check`, as operator.yml's same step runs them.** Until 2026-09-24
      # these ran in write mode, and each generator's default serial is a
      # `git rev-list --count` over its sources — on this job's one-commit
      # checkout, not main's history. So both documents changed, the next
      # step's guard refused the commit ("the baseline commit is log/ and
      # nothing else"), and the dispatch could never have taken the baseline.
      # `--check` regenerates each at the serial its committed file claims and
      # fails on any difference, which is BOT-71's question; the commit carries
      # `log/` alone either way. `bot/tests/baseline.test.mjs` runs these lines
      # over a one-commit copy of the tree.
      - name: The catalogue the records were composed beside
        run: |
          node tools/build-index.mjs --check
          node tools/build-revocations.mjs --check
          node tools/selftest.mjs
          node tools/validate.mjs --allow-staging

      # BOT-73's one commit: `log/` and nothing else, pushed onto the commit
      # the baseline was computed over, and the marker read back from `main`.
      #
      # Nothing else may be in it. The two generators above regenerate from a
      # tree whose `plugins/` and `tools/revocations/` this run did not touch,
      # so a difference there is a generator disagreeing with `main` and is a
      # failure, not something to commit here.
      #
      # **No retry on a refused push**, deliberately unlike publish-apply. The
      # marker names `github.sha` as the commit the population was read at; a
      # rebase onto a moved `main` would land a baseline over a tree it was not
      # computed over, and detector A1 would then find the versions published in
      # between neither baselined nor recorded. Refused, the marker is not on
      # `main`, and a re-dispatch recomputes it.
      - name: One commit holding every record and the marker, pushed, and read back
        run: |
          set -euo pipefail
          test -f log/baseline.json
          git diff --exit-code -- registry/ plugins/ tools/ > /dev/null || {
            echo "::error::a generator changed a document this commit does not carry; the baseline commit is log/ and nothing else"
            exit 1
          }
          git config user.name "astra-registry-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -- log/decisions log/baseline.json
          extra=$(git diff --cached --name-only | grep -v -e '^log/decisions/' -e '^log/baseline\.json$' || true)
          if [ -n "$extra" ]; then
            echo "::error::the baseline commit would carry more than log/: $extra"
            exit 1
          fi
          git commit -q -F baseline-commit.txt
          # One commit on top of the main it was computed over, and nothing
          # else: a dispatch on another ref (workflow_dispatch takes one) must
          # not carry that ref's commits to main in the same push. This is a
          # guard in the file, which that ref can edit, so it is defence in
          # depth; the structural one is an environment admitting only main.
          git fetch -q origin main
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD^)" || {
            echo "::error::main is not the commit this baseline was computed over; nothing was pushed, and a re-dispatch recomputes it"
            exit 1
          }
          git push origin "HEAD:main"
          git fetch -q origin main
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
          git cat-file -e FETCH_HEAD:log/baseline.json
          echo "ok    $(git rev-parse --short HEAD) is on main and carries log/baseline.json"

  # ── the half that does not end ───────────────────────────────────────────
  names:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: MIG-20's rename watch, by repository id and never by name
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node bot/baseline.mjs --names

  alert:
    needs: [verify, export, write, names]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    environment: alerts
    permissions:
      contents: read
    timeout-minutes: 5
    env:
      ASTRA_ALERT_TELEGRAM_TOKEN: ${{ secrets.ASTRA_ALERT_TELEGRAM_TOKEN }}
      ASTRA_ALERT_CHAT_ID: ${{ secrets.ASTRA_ALERT_CHAT_ID }}
      ASTRA_ALERT_COPY_CHAT_ID: ${{ secrets.ASTRA_ALERT_COPY_CHAT_ID }}
      ASTRA_DEADMAN_URL_BASELINE_NAMES: ${{ secrets.ASTRA_DEADMAN_URL_BASELINE_NAMES }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/actions/alert
            bot/alert.mjs
            bot/heartbeat.mjs
            bot/lib/alert-verdict.mjs
            bot/lib/alert-checks.mjs
            tools/lib/ids.mjs
          sparse-checkout-cone-mode: false

      # Codes, never sentences. `skipped` is not a failure: on a scheduled run
      # the three dispatch-only jobs are skipped and that is the ordinary day.
      - name: What this run has to say
        env:
          VERIFY: ${{ needs.verify.result }}
          EXPORT: ${{ needs.export.result }}
          WRITE: ${{ needs.write.result }}
          NAMES: ${{ needs.names.result }}
        run: |
          set -euo pipefail
          codes=""
          add() { codes="${codes:+$codes, }\"$1\""; }
          [ "$VERIFY" = "failure" ] && add BASELINE_VERIFY_FAILED
          [ "$EXPORT" = "failure" ] && add BASELINE_EXPORT_FAILED
          [ "$WRITE"  = "failure" ] && add BASELINE_WRITE_FAILED
          [ "$NAMES"  = "failure" ] && add MIG20_BASELINE_NAME_DRIFT
          status=green
          [ -n "$codes" ] && status=red
          cat > verdict.json <<JSON
          {
            "schema": "astra.registry.alert-verdict/1",
            "check": "baseline-names",
            "status": "$status",
            "codes": [$codes],
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
          if [ "$status" = green ]; then
            # An empty `codes` is a member the channel renders as nothing; it
            # is dropped rather than sent as `[]`.
            grep -v '"codes": \[\]' verdict.json > verdict.tmp && mv verdict.tmp verdict.json
          fi
          cat verdict.json

      # `check: baseline-names`, because what the receiver's silence is about
      # is the DAILY job, not the one-time dispatch. A dispatch posts the same
      # heartbeat, which is harmless: a check that is fed one extra ping is a
      # check that is quiet for one extra bound, not a check that is wrong.
      # That holds however many dispatches there are, and nothing limits them
      # to one until a run commits the marker (header).
      - uses: ./.github/actions/alert
        with:
          verdict: verdict.json
          check: baseline-names
