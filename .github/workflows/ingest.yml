name: Ingest

# The registry bot (PRODUCTION_PLAN tasks 3.3, 3.4 and 3.5), wired to every way
# this repository can learn that a release exists:
#
#   * a listing issue is opened or edited (task 3.3's submission form);
#   * somebody comments `/recheck` on one;
#   * a maintainer comments **`/approve`** or **`/reject <reason>`** on one —
#     the other half of `outcome: "review"`. `/approve` clears the hold and
#     nothing else: it becomes an ordinary target carrying two extra fields, and
#     the whole ingest runs again from scratch against the release as it is now.
#     The permission is proved against the GitHub API in `triage`, which has no
#     write access to anything, before a target is emitted at all;
#   * a **release ping** — `/release v0.2.0` on a listing issue, or
#     `/release you/plugin v0.2.0` as a new issue. Task 3.4's first layer: it
#     carries owner/repo/tag and no authority whatsoever, which is what lets an
#     author use it with no token for this repository. `bot/triage.mjs` honours
#     an unlabelled one only for a repository that is already listed, so the
#     worst a stranger achieves is a re-check of a listing that is already
#     pinned to a repository identity;
#   * a **cron backstop** for the ping that never arrived (task 3.4, layer 2):
#     `releases.atom` with `If-None-Match`, over only the listings that have
#     been quiet, so an unchanged repository costs one 304;
#   * a **cron drain** for releases waiting out task 3.5's publication delay;
#   * `repository_dispatch`, which is where the GitHub App upgrade lands when
#     the maintainer's account can create one. Same payload, same verification.
#
# ── the permission split, which is the point ────────────────────────────────
#
# `check` runs a stranger's issue text through a parser, downloads a stranger's
# release asset, and inspects it. It has `contents: read`, no secrets, and no
# write access to anything. `comment` posts the result and has `issues: write`;
# `publish` commits the listing and has `contents: write`. Neither runs a line
# of submitter-controlled code: one posts a markdown file out of an artifact,
# the other copies JSON files out of one, revalidates them with this
# repository's own validator, and commits.
#
# `respond` is the same split applied to the reply an unlabelled submission
# gets. `triage` — no write access, no downloads — decides what to say and
# writes it to a FILE; `respond` has `issues: write`, reads that one file out of
# an artifact, posts it, and closes the issue when the mode was `reject`. The
# job that can write to an issue never parses a submission, and the job that
# parses a submission can write nothing. That is the same rule as check/comment,
# and it is why the fix for "an author heard nothing" did not become a fourth
# job with a token and a parser in it.
#
# That split is the whole security design of this file. A single job with write
# access that also downloads attacker-controlled archives is one sandbox escape
# away from a bot that can edit the catalogue, and the catalogue is the thing
# every Astra trusts.
#
# The submission text NEVER reaches a `run:` block through `${{ }}`. Every
# stranger-controlled value travels via a file or an environment variable, which
# is the documented way to avoid script injection in GitHub Actions: `${{
# github.event.issue.body }}` inside a shell command is substituted by the
# runner before bash parses a single quote.
#
# ── why the cron paths are a matrix and not a dispatch ──────────────────────
#
# The obvious shape for "the backstop found a release" is for the cron job to
# fire a `workflow_dispatch` at this same workflow. It does not work, and the
# reason is worth writing down so nobody rediscovers it: **events triggered with
# the repository's own `GITHUB_TOKEN` do not start workflow runs.** Doing it that
# way would need a personal access token with write access to this repository,
# sitting in a secret, for a job whose entire purpose is to need no credentials.
# So `triage` emits a JSON array of targets and `check` is a matrix over it —
# one job definition serving the submission path, the ping, the backstop and the
# queue drain, which also means all four are verified by exactly the same code.

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [plugin-release]
  schedule:
    # The queue drain. Hourly, because that is the resolution a publication
    # delay is quoted at: a release that says it publishes at 14:00 should not
    # appear at 20:00.
    - cron: '17 * * * *'
    # The release backstop. Daily, and it polls only listings that have been
    # quiet for a week — the ping is the fast path and this is the safety net,
    # so paying for it more often would buy minutes on a path that is already
    # measured in days.
    - cron: '41 5 * * *'
  # No inputs, deliberately (registry plan B-T0.6). A dispatch used to take a
  # repository, a tag and a LOGIN whose ownership would then be re-proved — so
  # whoever could press the button chose whose authority the run would check.
  # A no-input dispatch runs what the crons run: the publication drain and the
  # release backstop. To re-ingest one release, ping it with a `[release]` issue
  # or `/recheck` it, which both carry an author GitHub asserts.
  workflow_dispatch:

permissions: {}

# ── what may cancel what, and what may never ────────────────────────────────
#
# This used to be `group: ingest-<issue number>` with `cancel-in-progress: true`
# for both `issues` and `issue_comment`. The intent was sound — an author who
# edits their submission six times should not start six ingests — but a comment
# became able to *publish* when `/approve` landed, and the group did not move
# with it. Every event on the issue shared one key, so any second event killed a
# decision that was already running: an edit, a `/recheck`, a `/release`, a
# second comment of any kind.
#
# What a cancelled publish leaves behind is not "nothing":
#
#   * `publish` is the only job that commits. Cancel it and the listing is not
#     written, the QUEUE ENTRY for a delayed release is not written either, and
#     the backstop's etag memory is thrown away. The queue entry is the worst of
#     the three: `comment` may already have told the author "publishing itself
#     at 14:00", and the file that would have made that true never reached the
#     repository. Nothing retries it. The release simply never publishes, and
#     the only record is a comment promising that it will.
#   * a cancelled run may have posted its comment and not made its commit, or
#     removed a queue entry in the artifact it never got to apply.
#   * and the `/approve` itself is spent. GitHub will not redeliver the comment;
#     the hold stays up, and nobody is told why.
#
# So: **nothing cancels anything in progress any more.** The spending argument
# survives without cancellation, because a group with `cancel-in-progress: false`
# still serialises: a second event on the same issue waits, and a third replaces
# the second *while it is still pending*. An edit storm therefore costs one
# in-flight run plus one queued run, whatever its length — bounded, and with
# nothing half-written.
#
# `cancel-in-progress: false` is not the whole story, and the version of this
# comment that gave a maintainer's decision its own `comment-<id>` key read as
# though it were. GitHub keeps at most ONE running and ONE pending run per
# group: a third arrival does not queue behind the second, it REPLACES it, and
# the replaced run is cancelled while still pending. `cancel-in-progress: false`
# protects the running job and says nothing about the pending one.
#
# That property is unavoidable, so the only question is what shares a key with
# what — and for as long as the `publish` job carried a repo-wide
# `registry-publish` group, a per-comment key answered it the wrong way. It made
# every comment its own workflow run, so N comments started N parallel ingests,
# and all N of their `publish` jobs then queued on that single group, where the
# same replace-the-pending-one rule applies but now BETWEEN STRANGERS. A
# `/release <listed-repo> <tag>` ping needs no authority at all, so anyone could
# keep that lane churning and drop somebody else's pending publish. The hazard
# did not go away when it left this key; it moved from per-issue and bounded to
# repo-wide and third-party-triggerable.
#
# **That lane is gone** (registry plan B-T0.3). `publish` has no `concurrency:`
# at all, because `bot/publish-apply.mjs` now makes two publish jobs racing to
# push a survivable event rather than a lost one: the loser re-applies against
# what landed, re-runs every check, and pushes again — or, if the other commit
# touched the same listing, ends with no commit and says so on the thread.
#
# So the premise of the paragraph above no longer holds, and the key moves with
# it. A maintainer's decision — `/approve`, `/publish`, `/reject` — gets its own
# `ingest-cmd-<comment id>` key, because that comment is SPENT: GitHub will not
# redeliver it, so a run that is replaced while pending takes the decision with
# it and nobody is told. Everything else still shares the issue's key, so an
# edit storm is still bounded to one running plus one pending run, and a
# superseded pending run is still another event on the SAME submission.
#
# **And the key's test for a command is not the parser's**, which is a real
# asymmetry rather than a tidy one. This expression can only call `startsWith`
# on the raw comment body; `parseMaintainerCommand` matches
# `/^\/(approve|publish|reject)\b/i` against `firstWrittenLine`, which trims each
# line and skips blank ones and markdown headings. So a `/approve` written after
# a blank line, or indented, is a real command that shares the issue's lane —
# it keeps the old protection and loses the new one — and a comment that merely
# STARTS with the word gets a lane of its own and is then parsed as nothing.
# Neither direction is unsafe: the first is the behaviour that stood until
# today, and the second costs one idle run. Written down because the two rules
# look identical in a diff and are not, and because the day somebody makes them
# agree they should do it in the parser's direction, not this one's.
#
# What this does NOT fix, said plainly, because two versions of this comment
# have now claimed a hazard was eliminated when it had only been relocated: a
# maintainer who comments `/approve` twice within seconds can still have the
# first run replaced while pending — same key, same submission, and the second
# `/approve` does the same work. And a `/recheck` arriving while an ingest for
# the same issue is pending still replaces it. Both are duplicates of work the
# replacing run redoes from scratch. What is no longer true is the sentence this
# replaces: a publish can no longer be lost, and an author is no longer told
# "publishing itself at 14:00" by a run whose queue entry never reached the
# repository — `comment` needs `publish` and makes that promise from the entry
# that landed, not from the decision that wanted to.
concurrency:
  # Folded to one line: every continuation below is at the same indentation as
  # the first, which is what makes YAML join them with spaces rather than keep
  # the newlines. An expression with a newline inside `${{ }}` is not worth
  # finding out about on a live run.
  group: >-
    ${{ (github.event_name == 'issue_comment'
    && (startsWith(github.event.comment.body, '/approve')
    || startsWith(github.event.comment.body, '/publish')
    || startsWith(github.event.comment.body, '/reject')))
    && format('ingest-cmd-{0}', github.event.comment.id)
    || format('ingest-{0}', github.event.issue.number
    || github.event.client_payload.repo
    || github.event.schedule
    || github.run_id) }}
  cancel-in-progress: false

# The AstraPlugins pin is NOT here any more.
#
# It is `bot/manifest-probe/astra-plugins.pin`, one `KEY=VALUE` per line, with
# every word of its history (registry plan B-T1.4). It moved because this file
# is DELETED at R6 by B-T5.2, and three readers were grepping the pin out of
# it — a workflow with a deletion date is the wrong home for a fact three
# other files depend on, and the way they would have failed is by grepping
# nothing out of a file that is not there.
#
# The job below that needs it reads the file into `$GITHUB_ENV`; there is no
# workflow-level `env:` to inherit from, deliberately, so a job that starts
# reading the pin has to say so.

jobs:
  # ── the anchor, before anything else in this file runs ─────────────────────
  #
  # `bot/lib/roots.mjs` compiles the two public root keys in, and
  # `bot/ingest.mjs` verifies `registry/v1/trust.json` against those and
  # nothing else (registry plan B-T1.5, BOT-7). This job asks the one question
  # that arrangement leaves open: does the PUBLISHED `registry/v1/root.json`
  # still say the same thing?
  #
  # It is first, and every other job needs it, because a disagreement between
  # the two is a disagreement about who may vouch for a release — and an
  # ingest that publishes a listing while that is unresolved publishes it on an
  # anchor nobody can name. `bot/check-roots.mjs` says which direction the
  # divergence runs and which of the two is SERVE-92's rotation done correctly.
  #
  # No bot token, no write, no stranger bytes: it reads two files out of this
  # repository's own tree and compares them with a constant. `contents: read`
  # is what `actions/checkout` needs and is all it has.
  roots:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      # Read by `alert` below. A job output and not an artifact: the `alerts`
      # environment must not download one (`bot/tests/workflows.test.mjs`),
      # because an artifact is bytes another job produced and a cache is bytes
      # a pull request can poison.
      status: ${{ steps.check.outputs.status }}
      verdict: ${{ steps.check.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every job in this run reads the same tree.
          ref: ${{ github.sha }}
          # Six files and the document under test. Listed rather than cloned
          # whole so that what this job can read is a statement somebody wrote,
          # and so that a module added to the import graph of
          # `bot/check-roots.mjs` is a red run here rather than a mystery.
          sparse-checkout: |
            bot/check-roots.mjs
            bot/lib/roots.mjs
            bot/lib/sign.mjs
            bot/lib/alert-verdict.mjs
            tools/lib/canonical.mjs
            tools/lib/ids.mjs
            registry/v1/root.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: The published root keys are the ones this bot compiles in
        id: check
        run: node bot/check-roots.mjs

  # ── the alarm for the job above ────────────────────────────────────────────
  #
  # A SEPARATE JOB, and that is a correction to the plan rather than a
  # decoration. The plan reads as though the alert could be a step of the
  # `roots` job — "whose `alert` step is in `alerts`" — and it cannot be: a
  # GitHub environment is a JOB-level property. There is no way to put one
  # step of a job in an environment, so an `alert` step inside `roots` would
  # either give the whole roots job the alarm credential (which
  # `bot/tests/workflows.test.mjs` refuses, correctly: an alert job may hold
  # nothing else) or give it no credential at all and be red for ever.
  #
  # **It posts no BOT-85 heartbeat, and says so in a sentence rather than by
  # leaving an input empty.** `ingest.yml` runs on BOT-51's schedule, which is
  # deliberately outside BOT-85's dead-man list because the plugins service's
  # BOT-47 watches it; a heartbeat from here would be a POST to a receiver
  # check nobody created, which 404s and reads like a typo. `no-heartbeat-because`
  # is the input for that, and naming neither it nor a `check:` is a red
  # workflow test.
  #
  # **The `env:` block is not optional and is not ambient.** An environment
  # secret reaches a job only where the job names it. Without these three
  # lines the environment is empty and nothing about the file looks wrong —
  # the same shape as a release workflow whose comment described a checkout
  # step nobody wrote. It used to be red on every run for ever, which was the
  # second way of finding out; since 2026-09-19 it is not, because an empty
  # environment is exactly what this repository looks like before §2.12's R1
  # act and the alert action reports that state green. **So the only thing
  # that now catches these three lines going missing is
  # `bot/tests/workflows.test.mjs`**, which asserts that every job in `alerts`
  # maps all three. No `ASTRA_DEADMAN_URL_*` is mapped, because this job posts
  # to no receiver check and a job that mapped one could silence a check it
  # never posts to.
  #
  # This is the job B-T3.1's `alert` grows into when `plugins-ingest.yml`
  # takes over: same environment, same credential, more verdicts to carry.
  alert:
    needs: roots
    # The whole point is the red runs. `always()` so a roots job that failed
    # still gets its alarm sent, and `!cancelled()` so a cancelled run does
    # not page anybody about a decision nobody took.
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    environment: alerts
    permissions:
      contents: read
    env:
      ASTRA_ALERT_TELEGRAM_TOKEN: ${{ secrets.ASTRA_ALERT_TELEGRAM_TOKEN }}
      ASTRA_ALERT_CHAT_ID: ${{ secrets.ASTRA_ALERT_CHAT_ID }}
      ASTRA_ALERT_COPY_CHAT_ID: ${{ secrets.ASTRA_ALERT_COPY_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .github/actions/alert
            bot/alert.mjs
            bot/check-roots.mjs
            bot/heartbeat.mjs
            bot/lib/alert-verdict.mjs
            bot/lib/alert-checks.mjs
            bot/lib/roots.mjs
            bot/lib/sign.mjs
            tools/lib/canonical.mjs
            tools/lib/ids.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # An EMPTY relay is the case this step exists for. The roots job dying
      # before it wrote its output looks, to an alert job that simply sends
      # what it was given, exactly like a roots job with nothing to say — and
      # that is the shape every "the alarm was never wired up" defect takes.
      # `relayVerdict` turns an absent or ungrammatical verdict into a red one
      # saying the check did not report.
      - name: The verdict the roots job reported, or an alarm saying it did not
        env:
          ASTRA_ROOTS_VERDICT: ${{ needs.roots.outputs.verdict }}
        run: node bot/check-roots.mjs --relay --out verdict.json

      - uses: ./.github/actions/alert
        with:
          verdict: verdict.json
          no-heartbeat-because: >-
            ingest.yml runs on BOT-51's 600-second schedule, which is
            deliberately outside BOT-85's dead-man list: the plugins service's
            BOT-47 watches that schedule, so a receiver check for it would be
            one the owner created and this estate is not the party that
            notices its silence.

  # Does this event ask for an ingest at all, and of what? Runs no submitter
  # code and touches no network beyond the public reads it was already given.
  triage:
    # Every job in this file needs `roots`, explicitly and not through a
    # chain. A job that inherits the dependency through another one loses it
    # the day that other one's `needs` is edited, and nothing says so.
    needs: roots
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      # A JSON array of `{repo, tag, submitter}`. One entry for a submission or
      # a ping, N for a cron run, `[]` for an event that asked for nothing.
      targets: ${{ steps.decide.outputs.targets }}
      issue: ${{ steps.decide.outputs.issue }}
      watch: ${{ steps.decide.outputs.watch }}
      # `form`, `ping`, `approve`, `reject`, `reply` or `none`. Read by
      # `respond`, which needs to know whether a reply also closes the issue —
      # and reads it from HERE rather than from the reply file, because the
      # instruction must not travel inside the text a stranger influenced.
      mode: ${{ steps.decide.outputs.mode }}
      # There is a markdown file waiting for somebody to read. Set on every path
      # that decided not to start work: the whole point of this workflow's
      # rewrite is that "decided not to start work" and "said nothing" stopped
      # being the same thing.
      reply: ${{ steps.decide.outputs.reply }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every job in this run reads the same tree. The commit that added
          # this pin to `publish` said "every job" and pinned one, which is the
          # class of claim this repository treats as a defect in its own right:
          # a comment that describes a change nobody made.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Which submission, if any
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # `opened`, `edited`, `labeled`, `created`. It decides only how often
          # the bot repeats itself, never whether it may act.
          ACTION: ${{ github.event.action }}
          REGISTRY: ${{ github.repository }}
          SCHEDULE: ${{ github.event.schedule }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          # Whose control of THIS repository is proved before `/approve` or
          # `/reject` is honoured. A login, never a claim: `bot/lib/maintainer.mjs`
          # asks GitHub about it.
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          # The one payload field that check will look at, and only when the
          # permission API declines to answer: `OWNER` is GitHub asserting that
          # this commenter is the account the repository belongs to. This job's
          # token holds `contents: read`, the collaborators endpoint is
          # documented as needing push access, and `administration` is not a
          # scope a workflow token can ask for — so without this the endpoint
          # 403ing would make `/approve` refuse the owner of the repository, on
          # every path, silently. See the block at the top of maintainer.mjs;
          # the API is still tried first and an answered denial still stands.
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          # Stranger text. All three go to files, never into a command.
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          # `client_payload.submitter` is deliberately not read: a dispatch
          # carries no authority, so the submitter is resolved from the release
          # itself below (AV-5; INV-6).
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > issue-body.md
          printf '%s' "$ISSUE_TITLE" > issue-title.md
          printf '%s' "$COMMENT_BODY" > comment-body.md
          mkdir -p out
          echo 'targets=[]' >> "$GITHUB_OUTPUT"

          one_target() {
            # $1 repo, $2 tag, $3 submitter — as separate argv entries, never
            # interpolated into a command line.
            node -e '
              const [repo, tag, submitter] = process.argv.slice(1);
              process.stdout.write(JSON.stringify([{ repo, tag, submitter }]));
            ' "$1" "$2" "$3" > targets.json
            echo "targets=$(cat targets.json)" >> "$GITHUB_OUTPUT"
          }

          case "$EVENT" in
            workflow_dispatch)
              # The drain and the backstop, exactly as the crons run them.
              node bot/watch.mjs --drain --out out
              node bot/watch.mjs --watch --out out
              echo "watch=true" >> "$GITHUB_OUTPUT"
              ;;

            repository_dispatch)
              # Where the GitHub App upgrade lands. A dispatch carries
              # owner/repo/tag and no authority; the submitter it names is the
              # account that published the release, read from the release here
              # rather than taken from the payload, and proved against GitHub
              # downstream exactly like every other path's.
              submitter="$(node -e '
                const [repo, tag] = process.argv.slice(1);
                Promise.all([import("./bot/lib/notify.mjs"), import("./bot/lib/github.mjs")])
                  .then(([notify, gh]) => notify.resolveSubmitter(repo, tag, gh.fetchRelease))
                  .then((login) => process.stdout.write(login))
                  .catch((e) => { console.error(`::error::${e.message}`); process.exit(1); });
              ' "$DISPATCH_REPO" "$DISPATCH_TAG")"
              one_target "$DISPATCH_REPO" "$DISPATCH_TAG" "$submitter"
              ;;

            schedule)
              case "$SCHEDULE" in
                '17 * * * *')
                  # The publication queue. Reads files this repository wrote.
                  node bot/watch.mjs --drain --out out
                  ;;
                *)
                  # The release backstop. Polls the quiet listings, writes the
                  # updated etag memory for `publish` to commit.
                  node bot/watch.mjs --watch --out out
                  echo "watch=true" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              # Three fields, and deliberately not an approval among them. A
              # release that a maintainer approved and that then landed in the
              # publication delay is re-ingested here with no comment behind it,
              # and it must not raise the same hold again — so the approval is
              # carried in the QUEUE ENTRY, which is a file in this repository
              # that only the publish job can write, and `bot/lib/policy.mjs`
              # reads it back. Passing it through a cron job's output instead
              # would put a permission in a place a workflow input can reach.
              echo "targets=$(node -e '
                const fs = require("node:fs");
                const list = JSON.parse(fs.readFileSync("out/dispatch.json", "utf8"));
                process.stdout.write(JSON.stringify(list.map(({ repo, tag, submitter }) => ({ repo, tag, submitter }))));
              ')" >> "$GITHUB_OUTPUT"
              ;;

            issues|issue_comment)
              # `bot/triage.mjs` answers form / ping / approve / reject / reply
              # / none, resolves a ping's submitter from the release author, and
              # — for `/approve` and `/reject` only — asks GitHub whether the
              # commenter may decide. Its answers arrive as three files; nothing
              # here sources a file written from stranger text.
              #
              # It also appends one line to this job's summary when it asks:
              # `collaborator-permission: answered=<bool> outcome=<token>`, with
              # no login. That line is R0's measurement (registry plan B-T0.4a).
              # The `OWNER` fallback in `bot/lib/maintainer.mjs` is there because
              # nobody has ever seen whether this token can read that endpoint in
              # a real run, and removing it on a guess would strand every held
              # submission if the endpoint is silent. The summary is where the
              # answer becomes a fact instead of an assumption.
              node bot/triage.mjs \
                --event "$EVENT" --action "$ACTION" --labels "$LABELS" \
                --repository "$REGISTRY" \
                --issue-body issue-body.md --issue-title issue-title.md \
                --comment-body comment-body.md \
                --issue-author "$ISSUE_AUTHOR" --commenter "$COMMENT_AUTHOR" \
                --commenter-association "$COMMENT_ASSOCIATION" \
                --mode-file mode.txt --targets-file targets.json \
                --reply-file out/reply.md
              mode="$(cat mode.txt)"
              echo "mode=$mode" >> "$GITHUB_OUTPUT"
              case "$mode" in
                form)
                  # The two facts out of the rendered form, with the
                  # confirmations checked. The submitter is the issue author,
                  # whose control of the repository is then proved against
                  # GitHub — this is the path a first listing takes.
                  #
                  # `read-submission.mjs` exits 2 on a form it cannot read, and
                  # `set -e` above would kill the step — no target, no comment,
                  # a red X and silence for somebody who ticked one box instead
                  # of two. It cannot get here any more: triage answers the same
                  # question with the same parser first, and an unreadable form
                  # leaves as `reply` with a comment naming the missing field.
                  node bot/read-submission.mjs --body-file issue-body.md --output form.env
                  one_target \
                    "$(grep '^repo=' form.env | head -1 | cut -d= -f2-)" \
                    "$(grep '^tag=' form.env | head -1 | cut -d= -f2-)" \
                    "$ISSUE_AUTHOR"
                  echo "issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  ;;
                ping|approve)
                  # An approval is an ordinary target with `approved_by` and
                  # `approved_at` alongside it. Everything downstream is
                  # identical, which is the property that matters: there is no
                  # second, shorter route into the catalogue for a release
                  # somebody said yes to.
                  echo "targets=$(cat targets.json)" >> "$GITHUB_OUTPUT"
                  echo "issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  ;;
                reply|reject)
                  # Nothing is downloaded, verified or published. One comment is
                  # posted by `respond` — and for `reject`, the issue is closed
                  # with the reason on the thread rather than in silence.
                  echo "issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  ;;
              esac
              ;;
          esac

          # Every path above that refused to start work either produced a target
          # or produced this file. An empty one means the event genuinely asked
          # for nothing — an unrelated comment, one of the bot's own notices —
          # and that is the only case in which nobody is told anything.
          if [ -s out/reply.md ]; then echo "reply=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.watch == 'true'
        with:
          name: watch-state
          path: out/state
          if-no-files-found: ignore
          retention-days: 7

      # The markdown a human will read, handed to the job that may post it.
      # An artifact rather than a job output for the same reason `comment` reads
      # one: a workflow output is a string that gets expanded, and this text was
      # composed with a stranger's repository name in it.
      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.reply == 'true'
        with:
          name: intake-reply
          path: out/reply.md
          retention-days: 7

  # The answer to an event that started no verification.
  #
  # This job is the whole of defect 1. Two listing requests arrived carrying the
  # rendered form and no labels; `triage` answered `none`, every later job was
  # skipped, the run went green — it had succeeded at deciding to do nothing —
  # and neither author was told anything at all. Not refused. Nothing.
  #
  # It runs no submitter code, downloads no archive and parses nothing. It reads
  # one markdown file out of an artifact and posts it, which is exactly what
  # `comment` does with the ingest report and for exactly the same reason.
  #
  # `mode` comes from the triage job's output rather than from inside the file,
  # because "and also close the issue" is an instruction and instructions must
  # not travel in text a stranger influenced.
  respond:
    needs: [roots, triage]
    if: needs.triage.outputs.reply == 'true' && needs.triage.outputs.issue != ''
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: intake-reply
          path: reply

      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.triage.outputs.issue }}
          MODE: ${{ needs.triage.outputs.mode }}
        with:
          script: |
            const fs = require("node:fs");
            const issue_number = Number(process.env.ISSUE);
            if (!issue_number) return;
            const body = fs.readFileSync("reply/reply.md", "utf8");
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

            // A rejection closes the issue, and only after the reason is on the
            // thread. In that order, always: a close that races the comment is
            // the silent close this whole job exists to stop being possible.
            if (process.env.MODE === "reject") {
              await github.rest.issues.update({
                owner, repo, issue_number, state: "closed", state_reason: "not_planned",
              });
            }

  # The bot that judges a stranger's release runs its own tests first. A suite
  # that only runs on pull requests is a suite that is green on the day it
  # matters and unverified on every other one.
  selftest:
    needs: [roots, triage]
    if: needs.triage.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Every job in this run reads the same tree. The commit that added
          # this pin to `publish` said "every job" and pinned one, which is the
          # class of claim this repository treats as a defect in its own right:
          # a comment that describes a change nobody made.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The pin, read out of the one file that holds it (B-T1.4). `link-deps.sh`
      # refuses to clone without `ASTRA_PLUGINS_REF`, so a missing or renamed
      # pin file fails the next step by name rather than quietly cloning
      # whatever AstraPlugins' HEAD says today.
      - name: The AstraPlugins pin this bot judges manifests by
        run: |
          set -euo pipefail
          grep -E '^(ASTRA_PLUGINS_REF|ASTRA_PLUGINS_URL)=' bot/manifest-probe/astra-plugins.pin >> "$GITHUB_ENV"

      - name: Fetch the manifest crate the daemon uses
        run: |
          set -euo pipefail
          bot/manifest-probe/link-deps.sh --clone

      - name: Build the manifest probe
        run: cargo build --release --manifest-path bot/manifest-probe/Cargo.toml

      - name: The probe's own tests — the daemon's manifest rules, asserted
        run: cargo test --manifest-path bot/manifest-probe/Cargo.toml

      - name: The bot's tests, including every shared bundle vector
        run: node bot/tests/ingest.test.mjs

      - name: The publication policy's tests, including its published numbers
        run: node bot/tests/policy.test.mjs

      # The icon and the README are the only bytes in a listing that Astra
      # renders BEFORE the user has agreed to anything — they are what somebody
      # reads in order to reach the consent sheet. So most of what this suite
      # asserts is not that a picture survives the trip, but what a hostile
      # picture and a hostile README are turned into on the way.
      - name: The icon and README derivation, including the hostile cases
        run: node bot/tests/presentation.test.mjs

      # The nightly asset check runs against a stranger's release assets and
      # decides whether bytes that are already listed still match. Its tests
      # belong beside the bot's for the same reason the bot's run here at all:
      # a suite that only runs on pull requests is a suite that is green on the
      # day it matters and unverified on every other one.
      - name: The asset check, measured against a real HTTP server
        run: node bot/tests/asset-check.test.mjs

      - name: The moderation sources, and the log built from them
        run: node bot/moderation.mjs --check

      - name: The listing rules, unchanged
        run: node tools/selftest.mjs

      - name: The error-code documentation is not stale
        run: node bot/gen-checks-doc.mjs --check

      # The two suites that are about the job with write access, running on the
      # path where being wrong costs a publication. They were wired into
      # `bot-tests.yml` alone, which runs on pushes and pull requests — so the
      # code that decides what gets committed was covered everywhere except in
      # the run that commits. This job's own header states that rule; it did not
      # follow it.
      - name: The publish path, under contention
        run: node --test bot/tests/publish-apply.test.mjs

      - name: What the workflow files may and may not say
        run: node --test bot/tests/workflows.test.mjs

      # The anchor, from the other side. The `roots` job above asks whether
      # the published root.json still matches the compiled set on this one
      # run; this asks whether the compiled set can still be the ONLY set —
      # that no argument, flag or tree reaches past it, and that a trust.json
      # signed by any other key is refused (registry plan B-T1.5).
      - name: The compiled root keys, and the only set they can be
        run: node --test bot/tests/roots.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-probe
          path: bot/manifest-probe/target/release/astra-manifest-probe
          retention-days: 1

  check:
    needs: [roots, triage, selftest]
    if: needs.triage.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # A cron run can carry several releases. Three at a time keeps the
      # unauthenticated GitHub reads well inside the rate limit.
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.triage.outputs.targets) }}
    # Read, and nothing else. This job downloads a stranger's release asset.
    permissions:
      contents: read
      # `gh attestation verify` reads Sigstore's public transparency log and
      # GitHub's public attestation API. Neither needs a token beyond rate
      # limit, and neither writes anything.
      id-token: none
      attestations: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Every job in this run reads the same tree. The commit that added
          # this pin to `publish` said "every job" and pinned one, which is the
          # class of claim this repository treats as a defect in its own right:
          # a comment that describes a change nobody made.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: manifest-probe
          path: probe

      - run: chmod +x probe/astra-manifest-probe

      - name: Ingest, then decide whether it publishes
        id: ingest
        env:
          # Rate limit and public reads. The bot needs no write scope anywhere,
          # which is what lets task 3.4's release ping be unauthenticated.
          GITHUB_TOKEN: ${{ github.token }}
          ASTRA_MANIFEST_PROBE: ${{ github.workspace }}/probe/astra-manifest-probe
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          SUBMITTER: ${{ matrix.submitter }}
          ISSUE: ${{ needs.triage.outputs.issue }}
          # Present only on a target that came from `/approve`, and empty on
          # every other one. It says a hold was cleared by a named account at a
          # named moment — it carries no verdict, no digest and no listing, so
          # every check below still runs from scratch. `bot/lib/policy.mjs`
          # explains why there is deliberately no shortcut here.
          APPROVED_BY: ${{ matrix.approved_by }}
          APPROVED_AT: ${{ matrix.approved_at }}
          # And WHAT was approved: the fingerprint the maintainer copied out of
          # the comment they answered. `bot/lib/policy.mjs` recomputes it from
          # the repository, tag, version and artifact digests THIS run hashed,
          # and refuses the approval when the two differ. Without it an approval
          # applies to whatever the issue body says at the moment the comment is
          # processed, and that body is the author's to edit.
          APPROVED_FOR: ${{ matrix.approved_for }}
          # `/publish` rather than `/approve`. Travels ON the matrix entry, so a
          # second target in the same run cannot borrow this one's waiver.
          #
          # Compared against "true" and not tested with `${VAR:+…}`: an unset
          # flag arrives here as the STRING "false", which is non-empty, so the
          # idiom every other argument on this line uses would have passed
          # --publish-now on every run and waived every delay silently.
          PUBLISH_NOW: ${{ matrix.publish_now }}
        run: |
          set -uo pipefail
          mkdir -p out
          # The three values are attacker-influenced and are passed as separate
          # argv entries from environment variables, never interpolated into the
          # command line. bot/ingest.mjs rejects anything that is not
          # `owner/name` and a conservative tag charset before either reaches a
          # URL or `gh`.
          # `|| code=$?` rather than a bare call, because the runner's default
          # shell is `bash -e {0}` and `set -uo pipefail` above does not turn
          # that off. Without it, `-e` aborts this script the instant decide
          # returns anything but 0 — so `code=$?` never ran, the output was
          # never set, the report never reached the job summary, and the `exit
          # 0` below was unreachable. Every run that worked exactly as designed
          # ended in a red X, which is precisely what the note under it says
          # must not happen. A command on the left of `||` is exempt from `-e`.
          code=0
          node bot/decide.mjs \
            --repo "$REPO" --tag "$TAG" --submitter "$SUBMITTER" \
            ${ISSUE:+--issue "$ISSUE"} \
            ${APPROVED_BY:+--approved-by "$APPROVED_BY"} \
            ${APPROVED_AT:+--approved-at "$APPROVED_AT"} \
            ${APPROVED_FOR:+--approved-for "$APPROVED_FOR"} \
            $([ "$PUBLISH_NOW" = "true" ] && echo --publish-now) \
            --out out > out/comment.log || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat out/comment.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat out/comment.log >> "$GITHUB_STEP_SUMMARY"
          # 0 published · 1 refused · 3 held for a maintainer · 4 delayed, and
          # it publishes itself · 2 the bot broke. Five outcomes, five exit
          # codes, and the step itself fails on only two of them: a workflow
          # that paged somebody every time the process worked as designed would
          # be turned off within a week.
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-report-${{ strategy.job-index }}
          path: out
          retention-days: 14

      - name: Fail the job when the release was refused, or when the bot did
        if: steps.ingest.outputs.code != '0' && steps.ingest.outputs.code != '3' && steps.ingest.outputs.code != '4'
        run: |
          echo "decide exited ${{ steps.ingest.outputs.code }}; the report is in the job summary." >&2
          exit 1

  # Posts the report, and — when there is no issue to post it on — makes sure
  # the author is told anyway.
  #
  # Runs no submitter code, touches no archive, and reads markdown and JSON out
  # of artifacts.
  #
  # The second half is not decoration. PRODUCTION_PLAN §5.5's only defence
  # against a compromised author account is *a publication delay plus an
  # out-of-band notification*, and a delay nobody is told about is just a delay.
  # A release that arrived by ping or by the backstop has no submission issue
  # behind it, so when such a release is held or delayed the bot opens one — the
  # author is watching this repository's issues for their own listing, and this
  # is the channel that reaches them without the registry holding a credential
  # for anything of theirs.
  #
  # Routine publications get no issue: they are recorded by the commit and by
  # the index serial, and an issue per patch release would train everybody to
  # ignore the notifications that matter. Every release of a plugin holding a
  # high-risk permission is delayed, so every one of those is announced 24 hours
  # before it happens.
  comment:
    # `needs: publish` costs this job the publish job's few minutes, and buys the
    # one thing a delay notice has to be: true. `comment` used to run beside
    # `publish`, so an author could be told "publishing itself at 14:00" by a run
    # whose queue entry never reached the repository — nothing retries that, and
    # the only record of the release was a comment promising it would appear.
    # The promise is now made from `publish`'s `queued` output: the entries that
    # are in the pushed commit, not the ones the decision wanted.
    needs: [roots, triage, check, publish]
    # `always()` runs this job over a SKIPPED triage too, so the roots gate is
    # spelled out here rather than left to the dependency. Without it a run
    # that stopped at the anchor would go on to post on the thread about a
    # decision no job took.
    if: always() && needs.roots.result == 'success' && needs.triage.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ingest-report-*
          path: reports
        continue-on-error: true

      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.triage.outputs.issue }}
          # What `publish` actually got onto `main`, and how it ended. Both are
          # read as facts about the repository, never as a restatement of the
          # decision: `outcome` is `committed`, `nothing`, `conflict` or
          # `refused`, and `queued` is the queue entries that are in the tree.
          PUBLISH_OUTCOME: ${{ needs.publish.outputs.outcome }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          QUEUED: ${{ needs.publish.outputs.queued }}
          # The report directories publish-apply refused. One report's refusal
          # is one release's refusal now, so a run can commit nine listings and
          # refuse the tenth, and only the tenth author may be told nothing
          # happened.
          REFUSED: ${{ needs.publish.outputs.refused }}
        with:
          script: |
            const fs = require("node:fs");
            const issue = Number(process.env.ISSUE) || null;

            // A delayed release is a promise with a file behind it. When the
            // file is not in the pushed commit the promise is false, and saying
            // so is the whole reason this job now waits for `publish`.
            const queued = (process.env.QUEUED || "").split(" ").filter(Boolean);
            const landed = (d) => queued.includes(`state/queue/${d.id}@${d.version}.json`);
            const why =
              process.env.PUBLISH_OUTCOME === "conflict"
                ? "another commit changed the same listing while this run was working"
                : `the publish job ended as \`${process.env.PUBLISH_OUTCOME || process.env.PUBLISH_RESULT || "unknown"}\``;
            const refused = (process.env.REFUSED || "").split(" ").filter(Boolean);
            const committed = process.env.PUBLISH_OUTCOME === "committed";
            // What to do about it, written once. `/recheck` is honoured only on
            // an issue carrying the `listing` label (bot/triage.mjs), and the
            // [notice] issues this same script opens carry no labels — so the
            // advice has to name both doors rather than the one that happens to
            // work on a submission thread.
            const again =
              "Nothing retries this on its own. On a submission issue, comment `/recheck`; " +
              "anywhere else, ping the release again with a `[release]` issue naming " +
              "`owner/repo` and the tag. Either way it is decided from scratch against the " +
              "release as it is now.";
            const notQueued =
              "\n\n---\n\n**This release is not waiting to publish.** The delay above describes " +
              "what was decided; the file that would make it happen \u2014 " +
              "`state/queue/<id>@<version>.json` \u2014 is not in this repository, because " +
              `${why}. ${again}`;
            const notPublished =
              "\n\n---\n\n**This release is not in the catalogue.** The report above says it " +
              "passed every check; the commit that would have put it there was not made, " +
              `because ${why}. ` + again;
            let dirs = [];
            try {
              dirs = fs.readdirSync("reports").sort();
            } catch { /* the check job produced nothing at all */ }

            if (issue && dirs.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue,
                body: "The ingest job did not produce a report. That is a fault in this registry, " +
                      "not in the submission — the run log is linked above.",
              });
              return;
            }

            // The run this report came from, so a truncated or refused comment
            // still names the place the whole thing is.
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // GitHub refuses a comment over 65,536 characters with a 422.
            // `bot/ingest.mjs` already keeps its reports under that, in three
            // independent places, but this loop is the last line: it posts on
            // behalf of EVERY report in the run, and one throw here used to end
            // the step — so a single oversized report meant every other
            // submission in the same run got no answer at all. A cut body with
            // a link beats no body, and a failed post has to be survivable.
            const GITHUB_COMMENT_MAX = 65536;
            const fit = (text) => {
              if (text.length <= GITHUB_COMMENT_MAX) return text;
              const tail =
                `\n\n---\n\n**Cut to fit.** The full report is ${text.length} characters and GitHub ` +
                `caps a comment at ${GITHUB_COMMENT_MAX}. The complete finding list is in this run's ` +
                `\`ingest-report-*\` artifact: ${runUrl}`;
              return text.slice(0, GITHUB_COMMENT_MAX - tail.length - 1) + tail;
            };
            const post = async (issue_number, text) => {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number, body: fit(text),
                });
              } catch (e) {
                core.warning(`could not post the report on #${issue_number}: ${e.message}`);
                // One more try, with a body that cannot itself be the problem.
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number,
                    body:
                      "The ingest report for this submission could not be posted here " +
                      `(\`${e.status ?? "?"}\`). That is a fault in this registry, not in the ` +
                      `submission. The report is in this run's \`ingest-report-*\` artifact: ${runUrl}`,
                  });
                } catch (e2) {
                  core.warning(`and the fallback failed too on #${issue_number}: ${e2.message}`);
                }
              }
            };

            for (const dir of dirs) {
              let body = "";
              let decision = {};
              try { body = fs.readFileSync(`reports/${dir}/comment.md`, "utf8"); } catch { continue; }
              try { decision = JSON.parse(fs.readFileSync(`reports/${dir}/decision.json`, "utf8")); } catch { /* older shape */ }

              // The event's issue when one drove this run; otherwise the number the
              // decision carried out of the queue entry, which is how a release that
              // waited out the delay and is being drained by cron gets its answer on
              // the thread that asked for it instead of in a new one.
              const thread = issue || Number(decision.issue) || null;

              // Both promises are checked against what the repository holds, not
              // against what was decided. A delay is true only if the queue
              // entry is in the pushed commit; a publication is true only if
              // this run committed AND this report was not the one refused.
              // Until this block covered `publish` too, a decision that said
              // "**Published.** `<id> <version>` is live" was posted verbatim
              // over a run that committed nothing.
              const delayed = decision.outcome === "delay";
              const landedHere = committed && !refused.includes(dir);
              const text = delayed
                ? (landed(decision) ? body : body + notQueued)
                : decision.outcome === "publish" && !landedHere
                  ? body + notPublished
                  : body;

              if (thread) {
                await post(thread, text);
                continue;
              }
              if (!delayed && decision.outcome !== "review") continue;

              const what = delayed
                ? (landed(decision)
                    ? `publishes itself at ${decision.publish_after}`
                    : "did NOT reach the publication queue")
                : "is held for a maintainer";
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[notice] ${decision.id} ${decision.version} ${what}`,
                body:
                  `\`${decision.repo}@${decision.tag}\` reached the registry without a submission ` +
                  "issue — a release ping, or the backstop noticing it.\n\n" +
                  "**If you did not publish this release, say so here now.** This notice, and the " +
                  "delay it describes, are the only defence this registry has against a compromised " +
                  "author account (PRODUCTION_PLAN §5.5), and they only work if somebody reads them.\n\n" +
                  text,
              });
            }

  # Commits whatever the decision produced: a listing that publishes now, a
  # queue entry for one that waits, the backstop's etag memory, and the
  # regenerated index.
  #
  # It reads JSON files out of an artifact and copies them into place. It runs
  # no submitter code — but the FILES are derived from a submission, so before
  # anything is committed every path is checked against the shape it is allowed
  # to have, and `tools/validate.mjs` is run over the result. The bot's output
  # is held to the rules the bot's input would have been held to; that check
  # already ran inside `bot/ingest.mjs`, and it runs again here because this is
  # the job with write access and the one that has to be right.
  publish:
    needs: [roots, triage, check]
    # Also on a backstop run that found nothing: the etag memory it just wrote
    # is the entire reason the next run is cheap, and a poll whose result is
    # never committed is a poll that happens again tomorrow.
    # Same as `comment`: `always()` would otherwise carry this job past a
    # failed roots check, and this is the job that commits.
    if: >-
      always() && !cancelled() && needs.roots.result == 'success' &&
      (needs.triage.outputs.targets != '[]' || needs.triage.outputs.watch == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # No `concurrency:` here, deliberately. It used to be
    # `group: registry-publish, cancel-in-progress: false`, which serialised
    # commits and, in exchange, let any stranger's release ping replace another
    # author's PENDING publish — GitHub keeps one pending run per group. Two
    # publishes racing is now handled where the race actually is, in
    # `bot/publish-apply.mjs`, which re-applies and re-checks against whatever
    # landed, or refuses when the other commit touched the same listing.
    outputs:
      outcome: ${{ steps.apply.outputs.outcome }}
      queued: ${{ steps.apply.outputs.queued }}
      refused: ${{ steps.apply.outputs.refused }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Every job in this run reads the same tree, and `publish-apply` takes
          # that commit as its base: what it compares against, when a push is
          # refused, to decide whether the other commit is a conflict or
          # somebody else's plugin. Without the pin, each job clones whatever
          # `main` happens to be when it starts, and "what changed since my
          # base" has no answer.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: ingest-report-*
          path: reports
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: watch-state
          path: watch-state
        continue-on-error: true

      # One step, because the apply, the checks and the push are one decision:
      # a tree that passed every rule is only worth pushing onto the commit it
      # was checked against, and when that commit is no longer the tip the whole
      # decision has to be taken again. The shell this replaces could not do
      # that — it ended with
      #
      #     git push || { git pull --rebase --autostash && git push; }
      #
      # which re-applies the commit onto whatever landed and pushes it WITHOUT
      # re-running validate, build-index or selftest. The index in that commit
      # then describes the tree the job built on rather than the one it landed
      # on, and `build-index.yml` asserts on every push that the committed index
      # is byte-identical to a fresh generation — so the red build appeared on
      # the next person's commit.
      #
      # `bot/publish-apply.mjs` carries the checks that used to be the three
      # steps below this one, in the same order and for the same reasons (the
      # listings are validated BEFORE the index is regenerated; the index is
      # checked only once it describes this tree). Its own tests are
      # `bot/tests/publish-apply.test.mjs`, which builds two clones and a bare
      # remote, because every property here is a property of a race.
      #
      # Exit codes: 0 committed or nothing to do, 1 refused, 2 the bot broke,
      # 3 another commit touched the same listing and nothing was committed.
      - name: Apply the decisions, hold them to the rules, and push
        id: apply
        env:
          MESSAGE: "registry: publish (${{ github.event_name }})"
          TRAILER: "Decided by bot/decide.mjs in run ${{ github.run_id }}. See docs/POLICY.md."
        run: |
          set -euo pipefail
          git config user.name "astra-registry-bot"
          git config user.email "bot@users.noreply.github.com"
          node bot/publish-apply.mjs \
            --reports reports \
            --watch-state watch-state \
            --base "$GITHUB_SHA" \
            --message "$MESSAGE" \
            --trailer "$TRAILER"

  # Closes the submission issue once the listing is actually in the catalogue.
  #
  # Two rules, and they are the same two the rejection close obeys further up.
  #
  # **Only on fact, never on intent.** `decision.outcome === "publish"` is what
  # the bot decided, not what happened: the `publish` job still has to derive the
  # files, pass `tools/validate.mjs` a second time, and get a commit onto `main`.
  # So this job needs that job and runs only when it succeeded. A thread closed
  # over a publication that failed to land is worse than one left open — it tells
  # the author to stop watching.
  #
  # **Only after the reason is on the thread.** `needs: comment` is what makes
  # that ordering hold; a close that races the comment is a silent close, which
  # is the thing this whole workflow is built not to do.
  # **And "it succeeded" is not the fact this needs.** `needs.publish.result` is
  # `success` whenever publish-apply exited 0, which it also does for
  # `outcome=nothing` — a run that applied nothing at all. That is reachable with
  # nothing going wrong loudly: both of publish's artifact downloads are
  # `continue-on-error`, so a transient failure leaves `reports/` absent, nothing
  # is applied, the job is green, and this job would then close a submission over
  # a listing that is not in the catalogue. `comment` was given the output that
  # says what actually landed, in the same change where this gate was not.
  close:
    needs: [roots, triage, check, publish, comment]
    if: needs.publish.outputs.outcome == 'committed'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ingest-report-*
          path: reports
        continue-on-error: true

      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.triage.outputs.issue }}
          # The reports publish-apply refused. The gate above says the RUN
          # committed; this says which releases in it did not, and a thread
          # closed over one of those tells its author to stop watching for a
          # listing that was refused. Same shape as the gate, one level down.
          REFUSED: ${{ needs.publish.outputs.refused }}
        with:
          script: |
            const fs = require("node:fs");
            const issue = Number(process.env.ISSUE) || null;
            let dirs = [];
            try {
              dirs = fs.readdirSync("reports").sort();
            } catch { return; }

            // One issue can carry several releases; close it once.
            const closed = new Set();
            const refused = (process.env.REFUSED || "").split(" ").filter(Boolean);

            for (const dir of dirs) {
              let decision = {};
              try { decision = JSON.parse(fs.readFileSync(`reports/${dir}/decision.json`, "utf8")); } catch { continue; }
              if (decision.outcome !== "publish") continue;
              // One report's refusal is one release's refusal, so "the run
              // committed" is not the same statement as "this listing landed".
              if (refused.includes(dir)) continue;

              const thread = issue || Number(decision.issue) || null;
              if (!thread || closed.has(thread)) continue;
              closed.add(thread);

              // `completed`, not `not_planned`: this issue asked for a listing and
              // the listing exists. The distinction is what GitHub's own UI reads
              // to tell a finished request from an abandoned one.
              //
              // Per issue, like `comment`'s `post()` and for the same reason: a
              // locked, deleted or transferred thread used to throw out of the
              // step, so one unclosable issue left every other author in the run
              // watching a thread that would never be closed — and unlike a
              // comment, nothing tries a close again.
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: thread,
                  state: "closed", state_reason: "completed",
                });
              } catch (e) {
                core.warning(`could not close #${thread}: ${e.message}`);
              }
            }

  # The review queue, said out loud on every drain.
  #
  # A published SLA nobody measures is a wish. POLICY.md's answer to a breach is
  # to widen auto-publication rather than let the queue rot, and that decision
  # only ever gets made if the breach is visible without anybody going to look.
  sla:
    needs: roots
    if: github.event_name == 'schedule' && github.event.schedule == '17 * * * *'
    runs-on: ubuntu-24.04
    permissions:
      issues: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Every job in this run reads the same tree. The commit that added
          # this pin to `publish` said "every job" and pinned one, which is the
          # class of claim this repository treats as a defect in its own right:
          # a comment that describes a change nobody made.
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/issues?state=open&labels=listing&per_page=100" \
            --jq '[.[] | {number, title, created_at}]' > open-listings.json
          node bot/watch.mjs --sla open-listings.json | tee -a "$GITHUB_STEP_SUMMARY"
