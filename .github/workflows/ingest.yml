name: Ingest

# The registry bot (PRODUCTION_PLAN tasks 3.3, 3.4 and 3.5), wired to every way
# this repository can learn that a release exists:
#
#   * a listing issue is opened or edited (task 3.3's submission form);
#   * somebody comments `/recheck` on one;
#   * a maintainer comments **`/approve`** or **`/reject <reason>`** on one —
#     the other half of `outcome: "review"`. `/approve` clears the hold and
#     nothing else: it becomes an ordinary target carrying two extra fields, and
#     the whole ingest runs again from scratch against the release as it is now.
#     The permission is proved against the GitHub API in `triage`, which has no
#     write access to anything, before a target is emitted at all;
#   * a **release ping** — `/release v0.2.0` on a listing issue, or
#     `/release you/plugin v0.2.0` as a new issue. Task 3.4's first layer: it
#     carries owner/repo/tag and no authority whatsoever, which is what lets an
#     author use it with no token for this repository. `bot/triage.mjs` honours
#     an unlabelled one only for a repository that is already listed, so the
#     worst a stranger achieves is a re-check of a listing that is already
#     pinned to a repository identity;
#   * a **cron backstop** for the ping that never arrived (task 3.4, layer 2):
#     `releases.atom` with `If-None-Match`, over only the listings that have
#     been quiet, so an unchanged repository costs one 304;
#   * a **cron drain** for releases waiting out task 3.5's publication delay;
#   * `repository_dispatch`, which is where the GitHub App upgrade lands when
#     the maintainer's account can create one. Same payload, same verification.
#
# ── the permission split, which is the point ────────────────────────────────
#
# `check` runs a stranger's issue text through a parser, downloads a stranger's
# release asset, and inspects it. It has `contents: read`, no secrets, and no
# write access to anything. `comment` posts the result and has `issues: write`;
# `publish` commits the listing and has `contents: write`. Neither runs a line
# of submitter-controlled code: one posts a markdown file out of an artifact,
# the other copies JSON files out of one, revalidates them with this
# repository's own validator, and commits.
#
# `respond` is the same split applied to the reply an unlabelled submission
# gets. `triage` — no write access, no downloads — decides what to say and
# writes it to a FILE; `respond` has `issues: write`, reads that one file out of
# an artifact, posts it, and closes the issue when the mode was `reject`. The
# job that can write to an issue never parses a submission, and the job that
# parses a submission can write nothing. That is the same rule as check/comment,
# and it is why the fix for "an author heard nothing" did not become a fourth
# job with a token and a parser in it.
#
# That split is the whole security design of this file. A single job with write
# access that also downloads attacker-controlled archives is one sandbox escape
# away from a bot that can edit the catalogue, and the catalogue is the thing
# every Astra trusts.
#
# The submission text NEVER reaches a `run:` block through `${{ }}`. Every
# stranger-controlled value travels via a file or an environment variable, which
# is the documented way to avoid script injection in GitHub Actions: `${{
# github.event.issue.body }}` inside a shell command is substituted by the
# runner before bash parses a single quote.
#
# ── why the cron paths are a matrix and not a dispatch ──────────────────────
#
# The obvious shape for "the backstop found a release" is for the cron job to
# fire a `workflow_dispatch` at this same workflow. It does not work, and the
# reason is worth writing down so nobody rediscovers it: **events triggered with
# the repository's own `GITHUB_TOKEN` do not start workflow runs.** Doing it that
# way would need a personal access token with write access to this repository,
# sitting in a secret, for a job whose entire purpose is to need no credentials.
# So `triage` emits a JSON array of targets and `check` is a matrix over it —
# one job definition serving the submission path, the ping, the backstop and the
# queue drain, which also means all four are verified by exactly the same code.

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [plugin-release]
  schedule:
    # The queue drain. Hourly, because that is the resolution a publication
    # delay is quoted at: a release that says it publishes at 14:00 should not
    # appear at 20:00.
    - cron: '17 * * * *'
    # The release backstop. Daily, and it polls only listings that have been
    # quiet for a week — the ping is the fast path and this is the safety net,
    # so paying for it more often would buy minutes on a path that is already
    # measured in days.
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repository (owner/name)'
        required: true
      tag:
        description: 'Release tag'
        required: true
      submitter:
        description: 'GitHub login whose control of the repository is checked'
        required: true

permissions: {}

# ── what may cancel what, and what may never ────────────────────────────────
#
# This used to be `group: ingest-<issue number>` with `cancel-in-progress: true`
# for both `issues` and `issue_comment`. The intent was sound — an author who
# edits their submission six times should not start six ingests — but a comment
# became able to *publish* when `/approve` landed, and the group did not move
# with it. Every event on the issue shared one key, so any second event killed a
# decision that was already running: an edit, a `/recheck`, a `/release`, a
# second comment of any kind.
#
# What a cancelled publish leaves behind is not "nothing":
#
#   * `publish` is the only job that commits. Cancel it and the listing is not
#     written, the QUEUE ENTRY for a delayed release is not written either, and
#     the backstop's etag memory is thrown away. The queue entry is the worst of
#     the three: `comment` may already have told the author "publishing itself
#     at 14:00", and the file that would have made that true never reached the
#     repository. Nothing retries it. The release simply never publishes, and
#     the only record is a comment promising that it will.
#   * a cancelled run may have posted its comment and not made its commit, or
#     removed a queue entry in the artifact it never got to apply.
#   * and the `/approve` itself is spent. GitHub will not redeliver the comment;
#     the hold stays up, and nobody is told why.
#
# So: **nothing cancels anything in progress any more.** The spending argument
# survives without cancellation, because a group with `cancel-in-progress: false`
# still serialises: a second event on the same issue waits, and a third replaces
# the second *while it is still pending*. An edit storm therefore costs one
# in-flight run plus one queued run, whatever its length — bounded, and with
# nothing half-written.
#
# `cancel-in-progress: false` is not the whole story, and the version of this
# comment that gave a maintainer's decision its own `comment-<id>` key read as
# though it were. GitHub keeps at most ONE running and ONE pending run per
# group: a third arrival does not queue behind the second, it REPLACES it, and
# the replaced run is cancelled while still pending. `cancel-in-progress: false`
# protects the running job and says nothing about the pending one.
#
# That property is unavoidable, so the only question is what shares a key with
# what — and the per-comment key answered it the wrong way. It made every
# comment its own workflow run, so N comments started N parallel ingests, and
# all N of their `publish` jobs then queued on the single repo-wide
# `registry-publish` group, where the same replace-the-pending-one rule applies
# but now BETWEEN STRANGERS. A `/release <listed-repo> <tag>` ping needs no
# authority at all, so anyone could keep that lane churning and drop somebody
# else's pending publish. The hazard did not go away when it left this key; it
# moved from per-issue and bounded to repo-wide and third-party-triggerable.
#
# So `issue_comment` shares the issue's key again. A superseded pending run is
# then always another event on the SAME submission — an edit, a second
# `/recheck` — which is a duplicate of work the replacing run redoes from
# scratch, rather than a different author's release.
#
# What this does NOT fix, said plainly, because the comment it replaces claimed
# a hazard was eliminated when it had only been relocated: an `/approve` that
# arrives while an ingest for the same issue is pending still replaces it, and
# any run's `publish` can still be dropped while pending on `registry-publish`.
# `comment` does not depend on `publish` (both are `needs: [triage, check]`), so
# an author can be told "publishing itself at 14:00" by a run whose queue entry
# never reached the repository. The fix for that is recovery rather than a key:
# the hourly drain should reconcile decisions that promised a `publish_after`
# and have no `state/queue/` entry. Until it does, a publish can still be lost,
# and the honest statement is that this key makes such a loss same-submission
# instead of cross-author.
concurrency:
  # Folded to one line: every continuation below is at the same indentation as
  # the first, which is what makes YAML join them with spaces rather than keep
  # the newlines. An expression with a newline inside `${{ }}` is not worth
  # finding out about on a live run.
  group: >-
    ingest-${{ github.event.issue.number
    || github.event.client_payload.repo
    || github.event.schedule
    || github.run_id }}
  cancel-in-progress: false

env:
  # The AstraPlugins commit whose `astra-plugin-manifest` this bot validates
  # manifests with. Pinned by SHA, never by branch: the crate is the daemon's
  # own parser, and "whatever HEAD says today" is not a thing to decide a
  # stranger's listing with. Bump it deliberately, in a reviewed commit.
  #
  # The note that used to be here said this SHA was the tip of an unpushed
  # branch, and that a pin nobody can fetch "fails loudly, which is the right
  # failure". Both halves stopped being true. That branch was rewritten before it
  # was pushed, so the commit is on no reachable ref and never will be —
  # `fatal: unable to read tree (50eaa616…)` — and the failure was not loud at
  # all: `selftest` failed, `check` was skipped, and the first real submission
  # got "the ingest job did not produce a report", which reads as a fault
  # somewhere in the bot rather than as a one-line pin.
  #
  # It was for a while the same commit as `plugin-release/v1` and as the one
  # `trust.json` allows an attestation from. **They have now diverged, and that
  # is correct.** This pin says which manifest rules a listing is judged by, and
  # moving it is a code review. `trust.json`'s allowlist says which builder's
  # word is worth anything, and moving that is a root-key ceremony. Tying a
  # cheap decision to an expensive one means either the cheap one stops moving
  # or the expensive one gets made casually.
  #
  # Bumped to `aaf480ea` for `spec/icon-formats.yaml`, which the icon-format
  # coupling in `tools/validate.mjs` reads. Safe to move: `astra-plugin-manifest`
  # and `plugin-release.yml` are byte-identical between the two commits
  # (`git diff --stat e3329df2 aaf480ea -- <path>` is empty for both), so no
  # manifest is judged differently and no attestation changes meaning.
  ASTRA_PLUGINS_REF: aaf480ea0b8b70a4cf18ad47646cf40f6efa0520
  ASTRA_PLUGINS_URL: https://github.com/mihailinl/AstraPlugins.git

jobs:
  # Does this event ask for an ingest at all, and of what? Runs no submitter
  # code and touches no network beyond the public reads it was already given.
  triage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      # A JSON array of `{repo, tag, submitter}`. One entry for a submission or
      # a ping, N for a cron run, `[]` for an event that asked for nothing.
      targets: ${{ steps.decide.outputs.targets }}
      issue: ${{ steps.decide.outputs.issue }}
      watch: ${{ steps.decide.outputs.watch }}
      # `form`, `ping`, `approve`, `reject`, `reply` or `none`. Read by
      # `respond`, which needs to know whether a reply also closes the issue —
      # and reads it from HERE rather than from the reply file, because the
      # instruction must not travel inside the text a stranger influenced.
      mode: ${{ steps.decide.outputs.mode }}
      # There is a markdown file waiting for somebody to read. Set on every path
      # that decided not to start work: the whole point of this workflow's
      # rewrite is that "decided not to start work" and "said nothing" stopped
      # being the same thing.
      reply: ${{ steps.decide.outputs.reply }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Which submission, if any
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # `opened`, `edited`, `labeled`, `created`. It decides only how often
          # the bot repeats itself, never whether it may act.
          ACTION: ${{ github.event.action }}
          REGISTRY: ${{ github.repository }}
          SCHEDULE: ${{ github.event.schedule }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          # Whose control of THIS repository is proved before `/approve` or
          # `/reject` is honoured. A login, never a claim: `bot/lib/maintainer.mjs`
          # asks GitHub about it.
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          # The one payload field that check will look at, and only when the
          # permission API declines to answer: `OWNER` is GitHub asserting that
          # this commenter is the account the repository belongs to. This job's
          # token holds `contents: read`, the collaborators endpoint is
          # documented as needing push access, and `administration` is not a
          # scope a workflow token can ask for — so without this the endpoint
          # 403ing would make `/approve` refuse the owner of the repository, on
          # every path, silently. See the block at the top of maintainer.mjs;
          # the API is still tried first and an answered denial still stands.
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          # Stranger text. All three go to files, never into a command.
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_REPO: ${{ github.event.client_payload.repo }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_SUBMITTER: ${{ github.event.client_payload.submitter }}
          INPUT_REPO: ${{ github.event.inputs.repo }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_SUBMITTER: ${{ github.event.inputs.submitter }}
        run: |
          set -euo pipefail
          printf '%s' "$ISSUE_BODY" > issue-body.md
          printf '%s' "$ISSUE_TITLE" > issue-title.md
          printf '%s' "$COMMENT_BODY" > comment-body.md
          mkdir -p out
          echo 'targets=[]' >> "$GITHUB_OUTPUT"

          one_target() {
            # $1 repo, $2 tag, $3 submitter — as separate argv entries, never
            # interpolated into a command line.
            node -e '
              const [repo, tag, submitter] = process.argv.slice(1);
              process.stdout.write(JSON.stringify([{ repo, tag, submitter }]));
            ' "$1" "$2" "$3" > targets.json
            echo "targets=$(cat targets.json)" >> "$GITHUB_OUTPUT"
          }

          case "$EVENT" in
            workflow_dispatch)
              one_target "$INPUT_REPO" "$INPUT_TAG" "$INPUT_SUBMITTER"
              ;;

            repository_dispatch)
              # Where the GitHub App upgrade lands. A dispatch carries
              # owner/repo/tag and no authority; the submitter it names is the
              # account that published the release, and is proved against
              # GitHub downstream exactly like every other path's.
              one_target "$DISPATCH_REPO" "$DISPATCH_TAG" "$DISPATCH_SUBMITTER"
              ;;

            schedule)
              case "$SCHEDULE" in
                '17 * * * *')
                  # The publication queue. Reads files this repository wrote.
                  node bot/watch.mjs --drain --out out
                  ;;
                *)
                  # The release backstop. Polls the quiet listings, writes the
                  # updated etag memory for `publish` to commit.
                  node bot/watch.mjs --watch --out out
                  echo "watch=true" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              # Three fields, and deliberately not an approval among them. A
              # release that a maintainer approved and that then landed in the
              # publication delay is re-ingested here with no comment behind it,
              # and it must not raise the same hold again — so the approval is
              # carried in the QUEUE ENTRY, which is a file in this repository
              # that only the publish job can write, and `bot/lib/policy.mjs`
              # reads it back. Passing it through a cron job's output instead
              # would put a permission in a place a workflow input can reach.
              echo "targets=$(node -e '
                const fs = require("node:fs");
                const list = JSON.parse(fs.readFileSync("out/dispatch.json", "utf8"));
                process.stdout.write(JSON.stringify(list.map(({ repo, tag, submitter }) => ({ repo, tag, submitter }))));
              ')" >> "$GITHUB_OUTPUT"
              ;;

            issues|issue_comment)
              # `bot/triage.mjs` answers form / ping / approve / reject / reply
              # / none, resolves a ping's submitter from the release author, and
              # — for `/approve` and `/reject` only — asks GitHub whether the
              # commenter may decide. Its answers arrive as three files; nothing
              # here sources a file written from stranger text.
              node bot/triage.mjs \
                --event "$EVENT" --action "$ACTION" --labels "$LABELS" \
                --repository "$REGISTRY" \
                --issue-body issue-body.md --issue-title issue-title.md \
                --comment-body comment-body.md \
                --issue-author "$ISSUE_AUTHOR" --commenter "$COMMENT_AUTHOR" \
                --commenter-association "$COMMENT_ASSOCIATION" \
                --mode-file mode.txt --targets-file targets.json \
                --reply-file out/reply.md
              mode="$(cat mode.txt)"
              echo "mode=$mode" >> "$GITHUB_OUTPUT"
              case "$mode" in
                form)
                  # The two facts out of the rendered form, with the
                  # confirmations checked. The submitter is the issue author,
                  # whose control of the repository is then proved against
                  # GitHub — this is the path a first listing takes.
                  #
                  # `read-submission.mjs` exits 2 on a form it cannot read, and
                  # `set -e` above would kill the step — no target, no comment,
                  # a red X and silence for somebody who ticked one box instead
                  # of two. It cannot get here any more: triage answers the same
                  # question with the same parser first, and an unreadable form
                  # leaves as `reply` with a comment naming the missing field.
                  node bot/read-submission.mjs --body-file issue-body.md --output form.env
                  one_target \
                    "$(grep '^repo=' form.env | head -1 | cut -d= -f2-)" \
                    "$(grep '^tag=' form.env | head -1 | cut -d= -f2-)" \
                    "$ISSUE_AUTHOR"
                  echo "issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  ;;
                ping|approve)
                  # An approval is an ordinary target with `approved_by` and
                  # `approved_at` alongside it. Everything downstream is
                  # identical, which is the property that matters: there is no
                  # second, shorter route into the catalogue for a release
                  # somebody said yes to.
                  echo "targets=$(cat targets.json)" >> "$GITHUB_OUTPUT"
                  echo "issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  ;;
                reply|reject)
                  # Nothing is downloaded, verified or published. One comment is
                  # posted by `respond` — and for `reject`, the issue is closed
                  # with the reason on the thread rather than in silence.
                  echo "issue=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  ;;
              esac
              ;;
          esac

          # Every path above that refused to start work either produced a target
          # or produced this file. An empty one means the event genuinely asked
          # for nothing — an unrelated comment, one of the bot's own notices —
          # and that is the only case in which nobody is told anything.
          if [ -s out/reply.md ]; then echo "reply=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.watch == 'true'
        with:
          name: watch-state
          path: out/state
          if-no-files-found: ignore
          retention-days: 7

      # The markdown a human will read, handed to the job that may post it.
      # An artifact rather than a job output for the same reason `comment` reads
      # one: a workflow output is a string that gets expanded, and this text was
      # composed with a stranger's repository name in it.
      - uses: actions/upload-artifact@v4
        if: steps.decide.outputs.reply == 'true'
        with:
          name: intake-reply
          path: out/reply.md
          retention-days: 7

  # The answer to an event that started no verification.
  #
  # This job is the whole of defect 1. Two listing requests arrived carrying the
  # rendered form and no labels; `triage` answered `none`, every later job was
  # skipped, the run went green — it had succeeded at deciding to do nothing —
  # and neither author was told anything at all. Not refused. Nothing.
  #
  # It runs no submitter code, downloads no archive and parses nothing. It reads
  # one markdown file out of an artifact and posts it, which is exactly what
  # `comment` does with the ingest report and for exactly the same reason.
  #
  # `mode` comes from the triage job's output rather than from inside the file,
  # because "and also close the issue" is an instruction and instructions must
  # not travel in text a stranger influenced.
  respond:
    needs: triage
    if: needs.triage.outputs.reply == 'true' && needs.triage.outputs.issue != ''
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: intake-reply
          path: reply

      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.triage.outputs.issue }}
          MODE: ${{ needs.triage.outputs.mode }}
        with:
          script: |
            const fs = require("node:fs");
            const issue_number = Number(process.env.ISSUE);
            if (!issue_number) return;
            const body = fs.readFileSync("reply/reply.md", "utf8");
            const { owner, repo } = context.repo;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

            // A rejection closes the issue, and only after the reason is on the
            // thread. In that order, always: a close that races the comment is
            // the silent close this whole job exists to stop being possible.
            if (process.env.MODE === "reject") {
              await github.rest.issues.update({
                owner, repo, issue_number, state: "closed", state_reason: "not_planned",
              });
            }

  # The bot that judges a stranger's release runs its own tests first. A suite
  # that only runs on pull requests is a suite that is green on the day it
  # matters and unverified on every other one.
  selftest:
    needs: triage
    if: needs.triage.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch the manifest crate the daemon uses
        run: |
          set -euo pipefail
          bot/manifest-probe/link-deps.sh --clone

      - name: Build the manifest probe
        run: cargo build --release --manifest-path bot/manifest-probe/Cargo.toml

      - name: The probe's own tests — the daemon's manifest rules, asserted
        run: cargo test --manifest-path bot/manifest-probe/Cargo.toml

      - name: The bot's tests, including every shared bundle vector
        run: node bot/tests/ingest.test.mjs

      - name: The publication policy's tests, including its published numbers
        run: node bot/tests/policy.test.mjs

      # The icon and the README are the only bytes in a listing that Astra
      # renders BEFORE the user has agreed to anything — they are what somebody
      # reads in order to reach the consent sheet. So most of what this suite
      # asserts is not that a picture survives the trip, but what a hostile
      # picture and a hostile README are turned into on the way.
      - name: The icon and README derivation, including the hostile cases
        run: node bot/tests/presentation.test.mjs

      # The nightly asset check runs against a stranger's release assets and
      # decides whether bytes that are already listed still match. Its tests
      # belong beside the bot's for the same reason the bot's run here at all:
      # a suite that only runs on pull requests is a suite that is green on the
      # day it matters and unverified on every other one.
      - name: The asset check, measured against a real HTTP server
        run: node bot/tests/asset-check.test.mjs

      - name: The moderation sources, and the log built from them
        run: node bot/moderation.mjs --check

      - name: The listing rules, unchanged
        run: node tools/selftest.mjs

      - name: The error-code documentation is not stale
        run: node bot/gen-checks-doc.mjs --check

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-probe
          path: bot/manifest-probe/target/release/astra-manifest-probe
          retention-days: 1

  check:
    needs: [triage, selftest]
    if: needs.triage.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # A cron run can carry several releases. Three at a time keeps the
      # unauthenticated GitHub reads well inside the rate limit.
      max-parallel: 3
      matrix:
        include: ${{ fromJson(needs.triage.outputs.targets) }}
    # Read, and nothing else. This job downloads a stranger's release asset.
    permissions:
      contents: read
      # `gh attestation verify` reads Sigstore's public transparency log and
      # GitHub's public attestation API. Neither needs a token beyond rate
      # limit, and neither writes anything.
      id-token: none
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: manifest-probe
          path: probe

      - run: chmod +x probe/astra-manifest-probe

      - name: Ingest, then decide whether it publishes
        id: ingest
        env:
          # Rate limit and public reads. The bot needs no write scope anywhere,
          # which is what lets task 3.4's release ping be unauthenticated.
          GITHUB_TOKEN: ${{ github.token }}
          ASTRA_MANIFEST_PROBE: ${{ github.workspace }}/probe/astra-manifest-probe
          REPO: ${{ matrix.repo }}
          TAG: ${{ matrix.tag }}
          SUBMITTER: ${{ matrix.submitter }}
          ISSUE: ${{ needs.triage.outputs.issue }}
          # Present only on a target that came from `/approve`, and empty on
          # every other one. It says a hold was cleared by a named account at a
          # named moment — it carries no verdict, no digest and no listing, so
          # every check below still runs from scratch. `bot/lib/policy.mjs`
          # explains why there is deliberately no shortcut here.
          APPROVED_BY: ${{ matrix.approved_by }}
          APPROVED_AT: ${{ matrix.approved_at }}
          # And WHAT was approved: the fingerprint the maintainer copied out of
          # the comment they answered. `bot/lib/policy.mjs` recomputes it from
          # the repository, tag, version and artifact digests THIS run hashed,
          # and refuses the approval when the two differ. Without it an approval
          # applies to whatever the issue body says at the moment the comment is
          # processed, and that body is the author's to edit.
          APPROVED_FOR: ${{ matrix.approved_for }}
          # `/publish` rather than `/approve`. Travels ON the matrix entry, so a
          # second target in the same run cannot borrow this one's waiver.
          #
          # Compared against "true" and not tested with `${VAR:+…}`: an unset
          # flag arrives here as the STRING "false", which is non-empty, so the
          # idiom every other argument on this line uses would have passed
          # --publish-now on every run and waived every delay silently.
          PUBLISH_NOW: ${{ matrix.publish_now }}
        run: |
          set -uo pipefail
          mkdir -p out
          # The three values are attacker-influenced and are passed as separate
          # argv entries from environment variables, never interpolated into the
          # command line. bot/ingest.mjs rejects anything that is not
          # `owner/name` and a conservative tag charset before either reaches a
          # URL or `gh`.
          # `|| code=$?` rather than a bare call, because the runner's default
          # shell is `bash -e {0}` and `set -uo pipefail` above does not turn
          # that off. Without it, `-e` aborts this script the instant decide
          # returns anything but 0 — so `code=$?` never ran, the output was
          # never set, the report never reached the job summary, and the `exit
          # 0` below was unreachable. Every run that worked exactly as designed
          # ended in a red X, which is precisely what the note under it says
          # must not happen. A command on the left of `||` is exempt from `-e`.
          code=0
          node bot/decide.mjs \
            --repo "$REPO" --tag "$TAG" --submitter "$SUBMITTER" \
            ${ISSUE:+--issue "$ISSUE"} \
            ${APPROVED_BY:+--approved-by "$APPROVED_BY"} \
            ${APPROVED_AT:+--approved-at "$APPROVED_AT"} \
            ${APPROVED_FOR:+--approved-for "$APPROVED_FOR"} \
            $([ "$PUBLISH_NOW" = "true" ] && echo --publish-now) \
            --out out > out/comment.log || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat out/comment.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || cat out/comment.log >> "$GITHUB_STEP_SUMMARY"
          # 0 published · 1 refused · 3 held for a maintainer · 4 delayed, and
          # it publishes itself · 2 the bot broke. Five outcomes, five exit
          # codes, and the step itself fails on only two of them: a workflow
          # that paged somebody every time the process worked as designed would
          # be turned off within a week.
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-report-${{ strategy.job-index }}
          path: out
          retention-days: 14

      - name: Fail the job when the release was refused, or when the bot did
        if: steps.ingest.outputs.code != '0' && steps.ingest.outputs.code != '3' && steps.ingest.outputs.code != '4'
        run: |
          echo "decide exited ${{ steps.ingest.outputs.code }}; the report is in the job summary." >&2
          exit 1

  # Posts the report, and — when there is no issue to post it on — makes sure
  # the author is told anyway.
  #
  # Runs no submitter code, touches no archive, and reads markdown and JSON out
  # of artifacts.
  #
  # The second half is not decoration. PRODUCTION_PLAN §5.5's only defence
  # against a compromised author account is *a publication delay plus an
  # out-of-band notification*, and a delay nobody is told about is just a delay.
  # A release that arrived by ping or by the backstop has no submission issue
  # behind it, so when such a release is held or delayed the bot opens one — the
  # author is watching this repository's issues for their own listing, and this
  # is the channel that reaches them without the registry holding a credential
  # for anything of theirs.
  #
  # Routine publications get no issue: they are recorded by the commit and by
  # the index serial, and an issue per patch release would train everybody to
  # ignore the notifications that matter. Every release of a plugin holding a
  # high-risk permission is delayed, so every one of those is announced 24 hours
  # before it happens.
  comment:
    needs: [triage, check]
    if: always() && needs.triage.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ingest-report-*
          path: reports
        continue-on-error: true

      - uses: actions/github-script@v7
        env:
          ISSUE: ${{ needs.triage.outputs.issue }}
        with:
          script: |
            const fs = require("node:fs");
            const issue = Number(process.env.ISSUE) || null;
            let dirs = [];
            try {
              dirs = fs.readdirSync("reports").sort();
            } catch { /* the check job produced nothing at all */ }

            if (issue && dirs.length === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue,
                body: "The ingest job did not produce a report. That is a fault in this registry, " +
                      "not in the submission — the run log is linked above.",
              });
              return;
            }

            for (const dir of dirs) {
              let body = "";
              let decision = {};
              try { body = fs.readFileSync(`reports/${dir}/comment.md`, "utf8"); } catch { continue; }
              try { decision = JSON.parse(fs.readFileSync(`reports/${dir}/decision.json`, "utf8")); } catch { /* older shape */ }

              if (issue) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: issue, body,
                });
                continue;
              }
              if (decision.outcome !== "delay" && decision.outcome !== "review") continue;

              const what = decision.outcome === "delay"
                ? `publishes itself at ${decision.publish_after}`
                : "is held for a maintainer";
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[notice] ${decision.id} ${decision.version} ${what}`,
                body:
                  `\`${decision.repo}@${decision.tag}\` reached the registry without a submission ` +
                  "issue — a release ping, or the backstop noticing it.\n\n" +
                  "**If you did not publish this release, say so here now.** This notice, and the " +
                  "delay it describes, are the only defence this registry has against a compromised " +
                  "author account (PRODUCTION_PLAN §5.5), and they only work if somebody reads them.\n\n" +
                  body,
              });
            }

  # Commits whatever the decision produced: a listing that publishes now, a
  # queue entry for one that waits, the backstop's etag memory, and the
  # regenerated index.
  #
  # It reads JSON files out of an artifact and copies them into place. It runs
  # no submitter code — but the FILES are derived from a submission, so before
  # anything is committed every path is checked against the shape it is allowed
  # to have, and `tools/validate.mjs` is run over the result. The bot's output
  # is held to the rules the bot's input would have been held to; that check
  # already ran inside `bot/ingest.mjs`, and it runs again here because this is
  # the job with write access and the one that has to be right.
  publish:
    needs: [triage, check]
    # Also on a backstop run that found nothing: the etag memory it just wrote
    # is the entire reason the next run is cheap, and a poll whose result is
    # never committed is a poll that happens again tomorrow.
    if: >-
      always() && !cancelled() &&
      (needs.triage.outputs.targets != '[]' || needs.triage.outputs.watch == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    # Never two commits to the catalogue at once, and never cancel one that is
    # already pushing.
    concurrency:
      group: registry-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          pattern: ingest-report-*
          path: reports
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: watch-state
          path: watch-state
        continue-on-error: true

      - name: Apply the decisions
        id: apply
        run: |
          set -euo pipefail
          changed=0

          # The etag memory the backstop wrote. Not derived from anything a
          # stranger controls beyond an HTTP header, and it is a cache: the
          # worst a bad value does is cost one extra poll.
          if [ -d watch-state ]; then
            mkdir -p state
            cp -r watch-state/. state/
            changed=1
          fi

          for dir in reports/*/; do
            [ -d "$dir" ] || continue
            # `reports/*/` globs WITH a trailing slash, so `$dir/plugins` is
            # `reports/1//plugins`, `find` prints that doubled separator back
            # verbatim, and `${p#"$dir"}` then leaves a LEADING SLASH on every
            # path — `/plugins/x/plugin.json`, which matches neither shape
            # pattern below. Both guards therefore rejected every file they
            # were ever handed, and the zero-touch publication this workflow
            # exists to perform had never once run to completion: the first
            # listing reached the catalogue through a hand-opened pull request,
            # so nothing had exercised this path. Normalise once, here, rather
            # than making each use remember.
            dir="${dir%/}"

            # ── the shape check ───────────────────────────────────────────
            # A listing directory is `plugins/<id>/` with `plugin.json` and
            # `versions/<semver>.json` under it, plus the two presentation
            # files the bot lifts out of the attested bundle — the icon and the
            # README. An id is the charset the daemon will turn into a
            # directory name on a user's disk. Anything else in the artifact
            # means the ingest produced something nobody designed, and the
            # answer to that is to stop, not to commit it.
            #
            # The icon extensions are listed one by one rather than as
            # `icon.*`, and must stay in step with
            # `AstraPlugins/spec/icon-formats.yaml`. A glob here would accept
            # `icon.sh` out of an artifact this job is about to commit.
            if [ -d "$dir/plugins" ]; then
              while IFS= read -r p; do
                rel="${p#"$dir/"}"
                case "$rel" in
                  plugins/*/plugin.json|plugins/*/versions/*.json) ;;
                  plugins/*/README.md) ;;
                  plugins/*/icon.png|plugins/*/icon.webp|plugins/*/icon.svg) ;;
                  plugins/*/icon.jpg|plugins/*/icon.jpeg|plugins/*/icon.ico) ;;
                  *) echo "::error::$rel is not a listing file"; exit 1 ;;
                esac
                id="$(printf '%s' "$rel" | cut -d/ -f2)"
                printf '%s' "$id" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$' \
                  || { echo "::error::$id is not a plugin id"; exit 1; }
              done < <(find "$dir/plugins" -type f)
              cp -r "$dir/plugins/." plugins/
              changed=1
            fi

            # ── the publication queue ─────────────────────────────────────
            if [ -d "$dir/state" ]; then
              while IFS= read -r p; do
                rel="${p#"$dir/"}"
                case "$rel" in
                  state/queue/*.json) ;;
                  *) echo "::error::$rel is not a queue entry"; exit 1 ;;
                esac
              done < <(find "$dir/state" -type f)
              mkdir -p state/queue
              cp -r "$dir/state/." state/
              changed=1
            fi

            # ── and what stops waiting ────────────────────────────────────
            if [ -s "$dir/remove.txt" ]; then
              while IFS= read -r rel; do
                [ -n "$rel" ] || continue
                case "$rel" in
                  state/queue/*.json) ;;
                  *) echo "::error::refusing to delete $rel"; exit 1 ;;
                esac
                if [ -f "$rel" ]; then rm -f "$rel"; changed=1; fi
              done < "$dir/remove.txt"
            fi
          done

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Three steps, in this order, and the order is the point.
      #
      # It used to validate first and regenerate second, which cannot pass: the
      # committed index does not describe a listing that was added a moment ago,
      # and `validate.mjs` compares the two. Every publish died on
      # `registry/v1/index.json: is not byte-identical to a fresh generation`,
      # having correctly noticed a mismatch the next step existed to remove.
      # Nothing caught it because no publish had ever got this far.
      #
      # The listings are still checked BEFORE the generator runs. Regenerating
      # first would feed a stranger's freshly derived documents to the
      # generator ahead of the schema check, which is the wrong way round for
      # the one step in this workflow that reads submitter-shaped input.
      - name: Hold the listings to this repository's own rules
        if: steps.apply.outputs.changed == '1'
        run: |
          set -euo pipefail
          # --allow-staging matches .github/workflows/build-index.yml and goes
          # away with it, on the day the bootstrap listing gains a digest.
          # --no-index because the index has not been regenerated yet; the run
          # below checks it once it describes this tree.
          #
          # `selftest.mjs` is NOT here, and moved down for the same reason as
          # the index check itself: it asserts `index.json is byte-identical to
          # a fresh generation`, which is false by construction between adding a
          # listing and rebuilding. Splitting only the validator's index check
          # out and leaving the selftest behind fixed half the ordering and left
          # the run just as red.
          node tools/validate.mjs --allow-staging --no-index

      - name: Regenerate the index the catalogue is built from
        if: steps.apply.outputs.changed == '1'
        run: |
          set -euo pipefail
          # build-index.yml asserts on every push that the committed index is
          # exactly what the generator produces. A publish that added a listing
          # and left the index alone would turn that assertion into a red build
          # on somebody else's commit.
          node tools/build-index.mjs
          node tools/build-index.mjs --check

      - name: And to every rule about the index, now that it describes this tree
        if: steps.apply.outputs.changed == '1'
        run: |
          set -euo pipefail
          node tools/validate.mjs --allow-staging
          node tools/selftest.mjs

      - name: Commit
        if: steps.apply.outputs.changed == '1'
        env:
          MESSAGE: "registry: publish (${{ github.event_name }})"
        run: |
          set -euo pipefail
          git config user.name "astra-registry-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p state
          git add -A plugins state registry/v1/index.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "$MESSAGE" -m "Decided by bot/decide.mjs in run ${{ github.run_id }}. See docs/POLICY.md."
          # A cron drain and an issue-driven publish can land in the same
          # minute. Rebase and retry once rather than failing a publication
          # somebody is waiting on; a second failure is a real conflict and
          # should be looked at.
          git push || { git pull --rebase --autostash && git push; }

  # The review queue, said out loud on every drain.
  #
  # A published SLA nobody measures is a wish. POLICY.md's answer to a breach is
  # to widen auto-publication rather than let the queue rot, and that decision
  # only ever gets made if the breach is visible without anybody going to look.
  sla:
    if: github.event_name == 'schedule' && github.event.schedule == '17 * * * *'
    runs-on: ubuntu-24.04
    permissions:
      issues: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/issues?state=open&labels=listing&per_page=100" \
            --jq '[.[] | {number, title, created_at}]' > open-listings.json
          node bot/watch.mjs --sla open-listings.json | tee -a "$GITHUB_STEP_SUMMARY"
