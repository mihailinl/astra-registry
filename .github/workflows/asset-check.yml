name: Asset check

# ─────────────────────────────────────────────────────────────────────────────
# Nightly: does every artifact this catalogue lists still hash to what the
# signed index says?
#
# PRODUCTION_PLAN task 6.6, and the reason it is written the way it is: the
# obvious version of this job downloads every listed artifact every night. For
# eleven plugins that is tens of megabytes a night and hundreds a week; for a
# hundred plugins it is gigabytes. It is paid nightly to learn a fact that
# changes approximately never, and it is the wrong shape besides — the event
# worth catching is an asset being REPLACED, and a replaced object announces
# itself in two headers before a byte of body moves:
#
#   * `Content-Length`, compared against the `size` the SIGNED INDEX records.
#     This needs no memory of a previous run at all. It works on a cold runner.
#   * `ETag`, compared against what the last run saw. This is the only thing
#     that catches a replacement of exactly the same length.
#
# So: one conditional request per artifact, and a body fetch only when a header
# disagrees — at which point the download is the investigation rather than the
# cost. Measured in `bot/tests/asset-check.test.mjs` against a real HTTP server:
# two artifacts totalling 15.9 MB cost 326 bytes of headers and zero bytes of
# body on a cold run, and 196 bytes warm, against 15.9 MB per run for the
# unconditional version.
#
# THE ETAG MEMORY IS NOT COMMITTED. It lives in the Actions cache, because it
# has no security value: the worst a lost or poisoned cache can do is cost one
# extra HEAD, since the `Content-Length`-against-`size` comparison never
# consults it. Committing it would put a machine-written file with a new
# timestamp into this repository's history every night, for nothing.
#
# WHAT A MISMATCH MEANS. Not that anybody is in danger: Astra pins the digest
# out of the signed index and refuses bytes that do not match, so a swapped
# asset is UNINSTALLABLE rather than dangerous. It means the release this
# catalogue points at is no longer the release that was reviewed. What happens
# next is one of the four moderation actions, and that is a maintainer's
# decision — which is why this job opens an issue and does not touch the
# catalogue.

on:
  schedule:
    # 03:23 UTC. Off the hour so it does not queue behind everybody else's cron,
    # and well clear of 04:17, which the withdrawal workflow will take at R1 so
    # the two never contend (the workflow that used to hold that slot was
    # deleted at R0: it failed on every run it ever made).
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Download and hash every artifact, ignoring the headers"
        type: boolean
        default: false

concurrency:
  group: asset-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Keyed by the catalogue serial so a new listing starts from a cold cache
      # for its own artifacts and a warm one for everybody else's. `restore-keys`
      # falls back to the newest cache from any serial, which is the whole point:
      # a cache miss must degrade to a slightly less informative run, never to a
      # download of everything.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/asset-cache.json
          key: asset-etags-${{ hashFiles('registry/v1/index.json') }}
          restore-keys: |
            asset-etags-

      - name: Check the pinned artifacts
        id: check
        run: |
          set -uo pipefail
          node bot/asset-check.mjs \
            --index registry/v1/index.json \
            --cache "${{ runner.temp }}/asset-cache.json" \
            --out asset-report.json \
            ${{ inputs.full && '--full' || '' }} | tee -a "$GITHUB_STEP_SUMMARY"
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asset-check-report
          path: asset-report.json
          if-no-files-found: ignore
          retention-days: 30

      # An alarm, not an issue (registry plan M-T6.2 commit C, BOT-53). This step
      # used to open an issue; from the cutover no issue on this repository
      # reaches anybody (DEC-12), and the job lost `issues: write` with it. The
      # verdict is composed HERE, where the report is read, and handed to the
      # `alert` job as a job output: the job that holds the alarm channel's
      # credential reads no report and no plugin file (BOT-46).
      - name: The verdict an artifact mismatch owes the alarm channel
        id: verdict
        if: always()
        env:
          CHECK_CODE: ${{ steps.check.outputs.code }}
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import fs from "node:fs";
            import { runUrl } from "./bot/lib/alert-verdict.mjs";
            import { invalidId } from "./tools/lib/ids.mjs";
            let report = { results: [] };
            try { report = JSON.parse(fs.readFileSync("asset-report.json", "utf8")); } catch {}
            const bad = (report.results ?? []).filter((r) => r.verdict === "mismatch");
            const ids = [...new Set(bad.map((r) => String(r.id)).filter((id) => !invalidId(id)))];
            const red = bad.length > 0;
            const run = runUrl();
            const verdict = { schema: "astra.registry.alert-verdict/1", check: "asset-check",
              status: red ? "red" : "green", codes: red ? ["ASSET_MISMATCH"] : [], ids, ...(run ? { run } : {}) };
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `verdict=${JSON.stringify(verdict)}\n`);
            console.log(red ? `${bad.length} artifact(s) no longer match: ${ids.join(", ")}` : "no mismatch; nothing to send");
          '

      - name: Fail the job too, so the run history shows it
        if: steps.check.outputs.code != '0'
        run: exit 1

  # The alarm, in environment `alerts`, reading nothing but the verdict the
  # check job composed. Replaces the issue the check job used to open.
  alert:
    needs: check
    if: always() && !cancelled() && needs.check.outputs.verdict != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: alerts
    permissions:
      contents: read
    env:
      ASTRA_ALERT_TELEGRAM_TOKEN: ${{ secrets.ASTRA_ALERT_TELEGRAM_TOKEN }}
      ASTRA_ALERT_CHAT_ID: ${{ secrets.ASTRA_ALERT_CHAT_ID }}
      ASTRA_ALERT_COPY_CHAT_ID: ${{ secrets.ASTRA_ALERT_COPY_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/alert
            bot/alert.mjs
            bot/heartbeat.mjs
            bot/lib/alert-verdict.mjs
            bot/lib/alert-checks.mjs
            tools/lib/ids.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The verdict the check job composed
        env:
          VERDICT: ${{ needs.check.outputs.verdict }}
        run: printf '%s\n' "$VERDICT" > verdict.json
      - uses: ./.github/actions/alert
        with:
          verdict: verdict.json
          no-heartbeat-because: >-
            The nightly asset check has no receiver check of its own: it is not
            on BOT-85's list, and its silence costs a delayed finding about a
            re-uploaded artifact, which Astra's digest check already makes
            uninstallable rather than dangerous. A red run is also the job's
            own red X.
